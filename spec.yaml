# Naibunga Lower -- Human-Wildlife Conflict Report
id: nl_hwc_report
requirements:
- name: ecoscope-platform
  version: '>=2.28.0, <2.29.0'
  channel: https://repo.prefix.dev/ecoscope-workflows/
- name: ecoscope-workflows-ext-custom
  version: 0.1.5
  channel: https://repo.prefix.dev/ecoscope-workflows-custom/
- name: pydeck
  version: 0.9.2
  channel: conda-forge
# Section 4's storyboard. Same package and version `incidents_reports` uses, and
# the only dependency added this round -- if the solve fails, dropping this
# requirement and the Incident Storyboard task-group leaves everything else
# intact.
- name: ecoscope-workflows-ext-wd
  version: 0.0.14
  channel: https://repo.prefix.dev/ecoscope-workflows-custom/

rjsf-overrides:
  properties:
    # `set_string_var`'s only argument is `var`, declared with `Field(title="")`,
    # so the run form had nothing to label it with and fell back to the argument
    # name. Review feedback: "Under 'Prepared by', replace var* caption".
    prepared_by.properties.var.title: Prepared by
    prepared_by.properties.var.description: >-
      Type in the name of the user preparing the analysis - this will appear in
      the report.
    base_map_defs.properties.base_maps.default:
    - url: https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}
      opacity: 1
    - url: https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}
      opacity: 0.5
task-instance-defaults:
  skipif:
    conditions:
    - any_is_empty_df
    - any_dependency_skipped
workflow:
- name: Workflow Details
  id: workflow_details
  task: set_workflow_details
- name: Data Source
  id: er_client_name
  task: set_er_connection
- name: Time Range
  id: time_range
  task: set_time_range
  partial:
    time_format: '%d %b %Y'
- name: Extract Timezone
  id: get_timezone
  task: get_timezone_from_time_range
  partial:
    time_range: ${{ workflow.time_range.return }}
# MRD, Header & period: "Report generated by (Configured in workflow
# details)". A form field, not a pinned constant -- whoever runs the report
# puts their own name or their organisation's on the cover.
#
# TOP LEVEL, NOT IN A TASK-GROUP, and that matters. While this sat inside a
# "Report Details" task-group it was the only form field in one, and the
# generated rjsf.json nested it under a group node whose `title` was null
# while params.json kept it at the top level. Desktop rendered "Error Loading
# Page" for the whole configuration form. Every other form field here --
# workflow_details, er_client_name, time_range, base_map_defs -- is a
# top-level task, so this one is too.
- name: Prepared By
  id: prepared_by
  task: set_string_var
- name: Base Maps
  id: base_map_defs
  task: set_base_maps
# ONE VIEW, WHOLE PERIOD -- deliberately no grouper.
#
# The MRD's section list is whole-period throughout: one bar chart, one map,
# one species chart. The only month-wise outputs it names are the seasonality
# series, the damage-over-time line and the by-month headline table, and each
# of those derives the month itself in SQL from incident_time.
#
# With a month grouper every grouped widget rendered once per month, so the
# Word report repeated each figure for each month -- ten pie charts for one pie
# widget over a ten-month period, which is what the first review flagged.
#
# `set_groupers` with no groupers returns the AllGrouper, and `split_groups`
# then yields a single group holding the whole frame. Every chain downstream is
# unchanged: one view per widget, one figure per section in the report, and no
# month dropdown on the dashboard.
#
# To restore month views, put the temporal grouper back here and nothing else
# needs to change -- but the Word report will fan out again.
- name: Reporting Period
  id: groupers
  task: set_groupers
  partial:
    groupers: null

- title: Fetch Events
  type: task-group
  description: Every event in the period; each section selects its own types in SQL.
  tasks:
  - name: Get Events
    id: events_raw
    task: get_events
    partial:
      client: ${{ workflow.er_client_name.return }}
      time_range: ${{ workflow.time_range.return }}
      event_types: []
      event_columns: null
      event_states: null
      include_null_geometry: true
      raise_on_empty: false
      include_details: true
      include_updates: false
      # Required by the MRD's incident rule. Switching this on is what makes
      # `is_collection`, `contains` and `is_contained_in` appear on every row;
      # without it an incident can only ever be a single event.
      include_related_events: true
      include_display_values: true
      force_point_geometry: true
  - name: Process Event Details
    id: events_details
    task: process_events_details
    partial:
      df: ${{ workflow.events_raw.return }}
      client: ${{ workflow.er_client_name.return }}
      map_to_titles: true
      ordered: true
  - name: Events or Empty Frame
    id: events_safe
    task: concat_dataframes
    skipif:
      conditions:
      - never
    partial:
      dfs:
      - ${{ workflow.events_details.return }}
      reset_index: true
      ensure_columns:
      - id
      - serial_number
      - event_type
      - event_type_display
      - event_category
      - event_details
      - geometry
      - time
      # Incident-collection columns, listed here so the frame carries them even
      # when the instance returns nothing. That is the FAIL-SAFE for the whole
      # incident rule: with these absent or empty, json_extract gives NULL,
      # incident_id falls back to the event's own id, and every event is its own
      # incident -- which is precisely the pre-collection behaviour.
      - is_collection
      - is_contained_in
      # Review feedback on the casualty table: "What is the 'Circumstances'
      # column referring to? I think this is best as event notes." Listed here
      # for the same reason as the two above -- an instance with no notes on any
      # event returns no column at all, and a SELECT naming it would fail
      # outright rather than show a dash.
      - notes


  # THE MRD'S INCIDENT RULE lives in the outermost SELECT of this query.
  #
  #   Total incidents = (incident collections containing >=1 qualifying
  #   conflict event) + (qualifying conflict events not in any collection)
  #   An incident's date     = earliest child event time
  #   An incident's location = first child event geometry
  #   Loss totals are unaffected -- they still sum over events/victims
  #
  # It does NOT collapse rows. Every event row survives, carrying the incident
  # it belongs to. Each output then reads whichever level the MRD names for it:
  # the headline count and the incident map read one row per incident
  # (conflict_seq = 1), while the conflict-type bar, the per-event-type map and
  # every loss total stay at event level.
  #
  # conflict_seq numbers the QUALIFYING events within an incident, so
  # conflict_seq = 1 marks exactly one row per incident that has at least one --
  # which is the MRD's sum, both halves at once: a collection contributes its
  # first qualifying child, and an uncollected event is its own incident and
  # contributes itself.
  #
  # THREE RULES THE VALIDATOR ENFORCES ON THE QUERY TEXT BELOW, ALL OF WHICH
  # THIS TASK HAS BROKEN AT SOME POINT:
  #
  #   1. It must START with SELECT, so a leading `--` block fails with "Only
  #      SELECT queries are allowed". That is why these notes are YAML
  #      comments.
  #   2. No `;` anywhere, INCLUDING inside a `--` comment.
  #   3. Max 10,000 characters, comments included. This query reached 10,025
  #      and the run stopped at "Query exceeds maximum length of 10000
  #      characters". Anything here that runs past a line or two belongs in
  #      this YAML block instead, which does not count against the budget.
  #      Keep a few hundred characters of headroom.
  #
  # WHAT THE NON-OBVIOUS COLUMNS DO, since their explanations live here now:
  #
  #   note_txt       The first EarthRanger note's text. Notes arrive as a list
  #                  of note objects and sanitize turns the column into a JSON
  #                  string, so json_extract reads it directly. json_valid
  #                  guards the extract -- json_extract on a column that is not
  #                  JSON raises "malformed JSON" and fails the whole query,
  #                  which an instance storing notes as plain text would do.
  #                  Falls back to the raw cast, then to NULL for the empty
  #                  column ensure_columns synthesises.
  #   incident_id    The collection this event sits in, else the event itself.
  #                  `is_contained_in` is a list of parent collections, also a
  #                  JSON string after sanitize. NULL -- column absent, empty
  #                  list, or no collections configured on the instance --
  #                  falls back to the event id, making every event its own
  #                  incident, which is the pre-collection behaviour.
  #   report_time    The form's own incident date where it has one, else the
  #                  EarthRanger event time.
  #   species_h      The animal RESPONSIBLE. `animal_h` is the animal that died
  #                  or was hurt (Carcass, Sick / Injured). Kept apart so a
  #                  dead zebra never reads as a species responsible.
  #   wl_cause       Carcass and Sick / Injured split the cause into one field
  #                  per type of death or injury. The un-suffixed names are the
  #                  legacy forms.
  #   ret_taken,     Booleans arrive as 1/true/True/Yes depending on how the
  #   ret_threatened record was written, so all four are matched. Crop Damage
  #                  drops the question mark from both titles.
  #   sp_raw..sp_h   Species harmonisation, innermost to outermost: read the
  #                  per-form field name, keep the English half of a bilingual
  #                  label, flip "Hyena - Spotted" to "Spotted Hyena", then
  #                  normalise the known spelling variants.
  - name: Prepare and Label Events
    id: events_prepared
    task: apply_sql_query
    skipif:
      conditions: &deps
      - any_dependency_skipped
    partial:
      df: ${{ workflow.events_safe.return }}
      query: |
        SELECT *,
               MIN(report_time) OVER (PARTITION BY incident_id) AS incident_time,
               FIRST_VALUE(geometry) OVER (
                 PARTITION BY incident_id ORDER BY report_time, id
               ) AS incident_geometry,
               ROW_NUMBER() OVER (
                 PARTITION BY CASE WHEN is_conflict = 1 THEN incident_id END
                 ORDER BY report_time, id
               ) AS conflict_seq
        FROM (
        SELECT id, serial_number, event_type, event_type_display, event_category,
               event_details, geometry,

               -- note_txt, incident_id, species_h, wl_cause: see the YAML
               -- notes above this task. They are up there because this query
               -- is capped at 10,000 characters, comments included.
               NULLIF(TRIM(COALESCE(
                 CASE WHEN json_valid(notes) = 1
                      THEN COALESCE(json_extract(notes, '$[0].text'),
                                    json_extract(notes, '$[0].note')) END,
                 NULLIF(CAST(notes AS TEXT), '[]'))), '') AS note_txt,

               COALESCE(json_extract(is_contained_in, '$[0].id'), id) AS incident_id,

               strftime('%Y-%m-%dT%H:%M:%SZ', COALESCE(
                 CASE
                   WHEN event_type IN ('human_injury', 'crop_damage',
                        'infrastructure_damage') THEN json_extract(event_details, '$."Incident date & time"')
                   WHEN event_type = 'poisoning' THEN COALESCE(
                        json_extract(event_details, '$."Date & Time"'),
                        json_extract(event_details, '$."Date & time"'))
                 END,
                 time)) AS report_time,

               CASE
                 WHEN event_type = 'hwc_livestock_predation' THEN 1
                 WHEN event_type = 'human_injury'
                      AND json_extract(event_details, '$."Cause of injury"') = 'Human-wildlife conflict' THEN 1
                 WHEN event_type = 'human_death'
                      AND json_extract(event_details, '$."Cause"') = 'Human-wildlife conflict' THEN 1
                 WHEN event_type IN ('crop_damage', 'infrastructure_damage')
                      AND json_extract(event_details, '$."Cause of damage"') = 'Wildlife' THEN 1
                 WHEN event_type = 'animal_carcass'
                      AND json_extract(event_details, '$."Type of Death"') LIKE 'Conflict%' THEN 1
                 -- the live choice label is "Conflict - fill in relevant HWC form"
                 WHEN event_type = 'sick_injured_animal'
                      AND json_extract(event_details, '$."Type of Injury"') LIKE 'Conflict%' THEN 1
                 WHEN event_type = 'poisoning'
                      AND json_extract(event_details, '$."Suspected motive"') = 'HWC retaliation' THEN 1
                 ELSE 0
               END AS is_conflict,

               CASE event_type
                 WHEN 'hwc_livestock_predation' THEN 'Livestock predation'
                 WHEN 'human_injury'            THEN 'Human injury'
                 WHEN 'human_death'             THEN 'Human death'
                 WHEN 'crop_damage'             THEN 'Crop damage'
                 WHEN 'infrastructure_damage'   THEN 'Infrastructure damage'
                 WHEN 'animal_carcass'          THEN 'Wildlife death'
                 WHEN 'sick_injured_animal'     THEN 'Wildlife injury'
                 WHEN 'poisoning'               THEN 'Poisoning'
                 ELSE event_type_display
               END AS conflict_type,

               CASE WHEN event_type IN ('animal_carcass', 'sick_injured_animal') THEN 'Unknown' ELSE sp_h END AS species_h,
               CASE WHEN event_type IN ('animal_carcass', 'sick_injured_animal') THEN sp_h END AS animal_h,

               COALESCE(json_extract(event_details, '$."Cause of Death (CONFLICT)"'),
                        json_extract(event_details, '$."Cause of Injury (CONFLICT)"'),
                        json_extract(event_details, '$."Cause of Death (POACHED)"'),
                        json_extract(event_details, '$."Cause of Injury (POACHED)"'),
                        json_extract(event_details, '$."Cause of Death (PAC)"'),
                        json_extract(event_details, '$."Cause of Injury (PAC)"'),
                        json_extract(event_details, '$."Cause of Death (NATURAL)"'),
                        json_extract(event_details, '$."Cause of Injury (NATURAL)"'),
                        json_extract(event_details, '$."Cause of Injury (UNKNOWN)"'),
                        json_extract(event_details, '$."Cause of Death"'),
                        json_extract(event_details, '$."Cause of Injury"')) AS wl_cause,

               CASE WHEN COALESCE(json_extract(event_details, '$."Retaliation action taken?"'),
                                  json_extract(event_details, '$."Retaliation action taken"'))
                         IN (1, 'true', 'True', 'Yes') THEN 1 ELSE 0 END AS ret_taken,
               CASE WHEN COALESCE(json_extract(event_details, '$."Retaliation action threatened?"'),
                                  json_extract(event_details, '$."Retaliation action threatened"'))
                         IN (1, 'true', 'True', 'Yes') THEN 1 ELSE 0 END AS ret_threatened,

               -- Multi-selects arrive as JSON arrays. Flatten to "a, b" for display.
               NULLIF(TRIM(REPLACE(REPLACE(REPLACE(REPLACE(CAST(COALESCE(
                 json_extract(event_details, '$."Evidence of retaliation?"'),
                 json_extract(event_details, '$."Evidence of retaliation"')) AS TEXT),
                 '","', ', '), '["', ''), '"]', ''), '[]', '')), '') AS ret_evidence,
               NULLIF(TRIM(REPLACE(REPLACE(REPLACE(REPLACE(CAST(COALESCE(
                 json_extract(event_details, '$."Action"'),
                 json_extract(event_details, '$."Action taken"'),
                 json_extract(event_details, '$."Action Taken"')) AS TEXT),
                 '","', ', '), '["', ''), '"]', ''), '[]', '')), '') AS action_txt

        FROM (
          SELECT *,
                 CASE
                   WHEN sp2 IS NULL OR sp2 = '' THEN 'Unknown'
                   WHEN LOWER(sp2) IN ('baboon, olive', 'baboon olive', 'olive baboon') THEN 'Olive Baboon'
                   WHEN LOWER(sp2) IN ('hyena, spotted', 'hyena spotted', 'spotted hyena') THEN 'Spotted Hyena'
                   WHEN LOWER(sp2) IN ('hyena, striped', 'hyena striped', 'striped hyena') THEN 'Striped Hyena'
                   WHEN LOWER(sp2) IN ('zebra, burchells', 'burchells zebra') THEN 'Burchells Zebra'
                   WHEN LOWER(sp2) IN ('zebra, grevys', 'grevys zebra') THEN 'Grevys Zebra'
                   WHEN LOWER(sp2) IN ('gazelle, grants', 'grants gazelle') THEN 'Grants Gazelle'
                   WHEN LOWER(sp2) IN ('gazelle, thompsons', 'thompsons gazelle') THEN 'Thompsons Gazelle'
                   WHEN LOWER(sp2) IN ('kudu, lesser', 'lesser kudu') THEN 'Lesser Kudu'
                   WHEN LOWER(sp2) IN ('kudu, greater', 'greater kudu') THEN 'Greater Kudu'
                   WHEN LOWER(sp2) IN ('jackal, side striped', 'side striped jackal', 'side-striped jackal') THEN 'Side-striped Jackal'
                   WHEN LOWER(sp2) IN ('jackal, black backed', 'black backed jackal', 'black-backed jackal') THEN 'Black-backed Jackal'
                   ELSE UPPER(SUBSTR(sp2, 1, 1)) || SUBSTR(sp2, 2)
                 END AS sp_h
          FROM (
            -- "Hyena - Spotted" -> "Spotted Hyena"
            SELECT *,
                   CASE WHEN INSTR(sp1, ' - ') > 0
                        THEN TRIM(SUBSTR(sp1, INSTR(sp1, ' - ') + 3)) || ' ' || TRIM(SUBSTR(sp1, 1, INSTR(sp1, ' - ') - 1))
                        ELSE sp1 END AS sp2
            FROM (
              -- ER labels are bilingual: "Lion / Simba", "Elephant / Ndovu (Tembo)".
              -- Keep the English half so one animal gives one bar.
              SELECT *,
                     TRIM(CASE WHEN INSTR(sp_raw, ' / ') > 0 THEN SUBSTR(sp_raw, 1, INSTR(sp_raw, ' / ') - 1)
                               ELSE sp_raw END) AS sp1
              FROM (
                -- Human Injury titles it "Species Responsible", Human Death
                -- "Species responsible". JSON keys are case-sensitive, so read both.
                SELECT *,
                       CASE WHEN event_type IN ('human_injury', 'human_death')
                              THEN COALESCE(json_extract(event_details, '$."Species responsible"'),
                                            json_extract(event_details, '$."Species Responsible"'))
                            WHEN event_type IN ('hwc_livestock_predation', 'crop_damage', 'infrastructure_damage',
                                                'animal_carcass', 'sick_injured_animal')
                              THEN json_extract(event_details, '$."Species"')
                       END AS sp_raw
                -- Collection CONTAINER events are excluded here, not later. A
                -- collection is itself an event record with is_collection
                -- true, and counting it alongside its children would double-count
                -- the incident and, worse, add a row with no conflict fields
                -- of its own. Written as a NOT-true test rather than = 0 so a
                -- missing column (NULL) keeps the row.
                FROM df
                -- '1' as well as 1: SQLite will not equate a TEXT '1' with an
                -- INTEGER 1, so a frame that serialises the boolean as a string
                -- would let container rows straight through this filter.
                WHERE COALESCE(is_collection, 0) NOT IN (1, '1', 'true', 'True')
              )
            )
          )
        )
        )
      columns: null
      sanitize: true

  - name: Parse Report Time
    id: events_time
    task: extract_column_as_type
    skipif:
      conditions: *deps
    partial:
      df: ${{ workflow.events_prepared.return }}
      column_name: report_time
      output_type: datetime
      output_column_name: report_time
      fan_out: true
  # incident_time is MIN() over an ISO-8601 string column, so SQLite orders it
  # lexicographically -- which for that format is chronological order. It comes
  # back a string and needs the same parse and timezone conversion as
  # report_time, because the month grouper now keys on it.
  - name: Parse Incident Time
    id: events_incident_time
    task: extract_column_as_type
    skipif:
      conditions: *deps
    partial:
      df: ${{ workflow.events_time.return }}
      column_name: incident_time
      output_type: datetime
      output_column_name: incident_time
      fan_out: true
  - name: Convert Events to Timezone
    id: events_tz
    task: convert_values_to_timezone
    skipif:
      conditions: *deps
    partial:
      df: ${{ workflow.events_incident_time.return }}
      timezone: ${{ workflow.get_timezone.return }}
      columns:
      - report_time
      - incident_time
      auto_detect: false
  # MRD: "An incident's date = earliest child event time (that's what Table 2
  # and seasonality group on)". Grouping on incident_time rather than
  # report_time is what puts every event of one incident in the same month,
  # including a child logged after midnight on the following day.
  - name: Add Incident Month Index
    id: events_indexed
    task: add_temporal_index
    skipif:
      conditions: *deps
    partial:
      df: ${{ workflow.events_tz.return }}
      time_col: incident_time
      groupers: ${{ workflow.groupers.return }}
      cast_to_datetime: true
      format: mixed
  - name: Split Events by Month
    id: events_grouped
    task: split_groups
    skipif:
      conditions: *deps
    partial:
      df: ${{ workflow.events_indexed.return }}
      groupers: ${{ workflow.groupers.return }}

- title: Headline Totals
  type: task-group
  description: The eight numbers at the top of the report.
  tasks:
  # One row, eight named columns. dataframe_column_sum reads one each.
  # COALESCE everywhere: a month with no records of a type must give 0, not
  # NULL, or the KPI card renders blank instead of zero.
  - name: Headline Figures
    id: hwc_kpis
    task: apply_sql_query
    partial:
      query: |
        SELECT
          -- INCIDENTS, not events. conflict_seq = 1 marks the first qualifying
          -- event of each incident, so this counts collections-with-a-
          -- qualifying-child plus uncollected qualifying events, exactly as the
          -- MRD defines it. Every other figure below deliberately stays at
          -- EVENT or victim level: "Loss totals are unaffected -- people
          -- injured, livestock killed etc. still sum over events/victims, so
          -- Table 1 would show 23 incidents but still 3 people injured."
          COALESCE(SUM(CASE WHEN is_conflict = 1 AND conflict_seq = 1 THEN 1 ELSE 0 END), 0) AS "Total incidents",
          COALESCE(SUM(CASE WHEN is_conflict = 1 AND event_type = 'human_injury' THEN 1 ELSE 0 END), 0) AS "People injured",
          COALESCE(SUM(CASE WHEN is_conflict = 1 AND event_type = 'human_death' THEN 1 ELSE 0 END), 0) AS "People killed",
          CAST(COALESCE(SUM(CASE WHEN event_type = 'hwc_livestock_predation'
                       THEN CAST(COALESCE(json_extract(event_details, '$."Total livestock dead"'), 0) AS REAL) ELSE 0 END), 0) AS INTEGER) AS "Livestock killed",
          CAST(COALESCE(SUM(CASE WHEN event_type = 'hwc_livestock_predation'
                       THEN CAST(COALESCE(json_extract(event_details, '$."Total livestock injured"'), 0) AS REAL) ELSE 0 END), 0) AS INTEGER) AS "Livestock injured",
          COALESCE(SUM(CASE WHEN is_conflict = 1 AND event_type = 'animal_carcass' THEN 1 ELSE 0 END), 0) AS "Wildlife killed",
          COALESCE(SUM(CASE WHEN is_conflict = 1 AND event_type = 'sick_injured_animal' THEN 1 ELSE 0 END), 0) AS "Wildlife injured",
          COALESCE(SUM(CASE WHEN event_type = 'poisoning' THEN 1 ELSE 0 END), 0) AS "Poisoning events",
          COALESCE(SUM(ret_taken), 0) AS "Retaliation recorded"
        FROM df
      columns: null
      sanitize: true
    mapvalues:
      argnames: df
      argvalues: ${{ workflow.events_grouped.return }}

  - {name: Total Incidents Value, id: hwc_kpi_0_val, task: dataframe_column_sum,
     partial: {column_name: Total incidents},
     mapvalues: {argnames: df, argvalues: "${{ workflow.hwc_kpis.return }}"}}
  - {name: Total Incidents Widget, id: hwc_kpi_0_sv, task: create_single_value_widget_single_view,
     skipif: {conditions: &never [never]},
     partial: {title: Total Conflict Incidents, decimal_places: 0},
     map: {argnames: [view, data], argvalues: "${{ workflow.hwc_kpi_0_val.return }}"}}
  - {name: Merge Total Incidents Views, id: hwc_kpi_0_svw, task: merge_widget_views,
     partial: {widgets: "${{ workflow.hwc_kpi_0_sv.return }}"}}

  - {name: People Injured Value, id: hwc_kpi_1_val, task: dataframe_column_sum,
     partial: {column_name: People injured},
     mapvalues: {argnames: df, argvalues: "${{ workflow.hwc_kpis.return }}"}}
  - {name: People Injured Widget, id: hwc_kpi_1_sv, task: create_single_value_widget_single_view,
     skipif: {conditions: *never},
     partial: {title: People Injured, decimal_places: 0},
     map: {argnames: [view, data], argvalues: "${{ workflow.hwc_kpi_1_val.return }}"}}
  - {name: Merge People Injured Views, id: hwc_kpi_1_svw, task: merge_widget_views,
     partial: {widgets: "${{ workflow.hwc_kpi_1_sv.return }}"}}

  - {name: People Killed Value, id: hwc_kpi_2_val, task: dataframe_column_sum,
     partial: {column_name: People killed},
     mapvalues: {argnames: df, argvalues: "${{ workflow.hwc_kpis.return }}"}}
  - {name: People Killed Widget, id: hwc_kpi_2_sv, task: create_single_value_widget_single_view,
     skipif: {conditions: *never},
     partial: {title: People Killed, decimal_places: 0},
     map: {argnames: [view, data], argvalues: "${{ workflow.hwc_kpi_2_val.return }}"}}
  - {name: Merge People Killed Views, id: hwc_kpi_2_svw, task: merge_widget_views,
     partial: {widgets: "${{ workflow.hwc_kpi_2_sv.return }}"}}

  - {name: Livestock Killed Value, id: hwc_kpi_3_val, task: dataframe_column_sum,
     partial: {column_name: Livestock killed},
     mapvalues: {argnames: df, argvalues: "${{ workflow.hwc_kpis.return }}"}}
  - {name: Livestock Killed Widget, id: hwc_kpi_3_sv, task: create_single_value_widget_single_view,
     skipif: {conditions: *never},
     partial: {title: Livestock Killed, decimal_places: 0},
     map: {argnames: [view, data], argvalues: "${{ workflow.hwc_kpi_3_val.return }}"}}
  - {name: Merge Livestock Killed Views, id: hwc_kpi_3_svw, task: merge_widget_views,
     partial: {widgets: "${{ workflow.hwc_kpi_3_sv.return }}"}}

  - {name: Wildlife Killed Value, id: hwc_kpi_4_val, task: dataframe_column_sum,
     partial: {column_name: Wildlife killed},
     mapvalues: {argnames: df, argvalues: "${{ workflow.hwc_kpis.return }}"}}
  - {name: Wildlife Killed Widget, id: hwc_kpi_4_sv, task: create_single_value_widget_single_view,
     skipif: {conditions: *never},
     partial: {title: Wildlife Killed in Conflict, decimal_places: 0},
     map: {argnames: [view, data], argvalues: "${{ workflow.hwc_kpi_4_val.return }}"}}
  - {name: Merge Wildlife Killed Views, id: hwc_kpi_4_svw, task: merge_widget_views,
     partial: {widgets: "${{ workflow.hwc_kpi_4_sv.return }}"}}

  - {name: Wildlife Injured Value, id: hwc_kpi_5_val, task: dataframe_column_sum,
     partial: {column_name: Wildlife injured},
     mapvalues: {argnames: df, argvalues: "${{ workflow.hwc_kpis.return }}"}}
  - {name: Wildlife Injured Widget, id: hwc_kpi_5_sv, task: create_single_value_widget_single_view,
     skipif: {conditions: *never},
     partial: {title: Wildlife Injured in Conflict, decimal_places: 0},
     map: {argnames: [view, data], argvalues: "${{ workflow.hwc_kpi_5_val.return }}"}}
  - {name: Merge Wildlife Injured Views, id: hwc_kpi_5_svw, task: merge_widget_views,
     partial: {widgets: "${{ workflow.hwc_kpi_5_sv.return }}"}}

  # The MRD's summary lists "Livestock injured / killed" as a pair. Only killed
  # was built, so injured animals never reached the headline at all.
  - {name: Livestock Injured Value, id: hwc_kpi_8_val, task: dataframe_column_sum,
     partial: {column_name: Livestock injured},
     mapvalues: {argnames: df, argvalues: "${{ workflow.hwc_kpis.return }}"}}
  - {name: Livestock Injured Widget, id: hwc_kpi_8_sv, task: create_single_value_widget_single_view,
     skipif: {conditions: *never},
     partial: {title: Livestock Injured, decimal_places: 0},
     map: {argnames: [view, data], argvalues: "${{ workflow.hwc_kpi_8_val.return }}"}}
  - {name: Merge Livestock Injured Views, id: hwc_kpi_8_svw, task: merge_widget_views,
     partial: {widgets: "${{ workflow.hwc_kpi_8_sv.return }}"}}

  # Naibunga has NO poisoning records as of 8 Nov 2026. This card exists so
  # the slot holds and reads 0 rather than vanishing from the layout.
  - {name: Poisoning Events Value, id: hwc_kpi_6_val, task: dataframe_column_sum,
     partial: {column_name: Poisoning events},
     mapvalues: {argnames: df, argvalues: "${{ workflow.hwc_kpis.return }}"}}
  - {name: Poisoning Events Widget, id: hwc_kpi_6_sv, task: create_single_value_widget_single_view,
     skipif: {conditions: *never},
     partial: {title: Poisoning Events, decimal_places: 0},
     map: {argnames: [view, data], argvalues: "${{ workflow.hwc_kpi_6_val.return }}"}}
  - {name: Merge Poisoning Events Views, id: hwc_kpi_6_svw, task: merge_widget_views,
     partial: {widgets: "${{ workflow.hwc_kpi_6_sv.return }}"}}

  - {name: Retaliation Recorded Value, id: hwc_kpi_7_val, task: dataframe_column_sum,
     partial: {column_name: Retaliation recorded},
     mapvalues: {argnames: df, argvalues: "${{ workflow.hwc_kpis.return }}"}}
  - {name: Retaliation Recorded Widget, id: hwc_kpi_7_sv, task: create_single_value_widget_single_view,
     skipif: {conditions: *never},
     partial: {title: Retaliation Recorded, decimal_places: 0},
     map: {argnames: [view, data], argvalues: "${{ workflow.hwc_kpi_7_val.return }}"}}
  - {name: Merge Retaliation Events Views, id: hwc_kpi_7_svw, task: merge_widget_views,
     partial: {widgets: "${{ workflow.hwc_kpi_7_sv.return }}"}}

  # TABLE 2 (headline figures month by month) WAS HERE AND IS GONE.
  #
  # Review feedback: "I think we can drop this. Stacked bar chart for conflict
  # type covers the temporal trend." The month-by-month read now lives entirely
  # in the stacked seasonality chart, which moved into section 2.
  #
  # TABLE 1 -- the headline figures for the whole period.
  - name: Whole-Period Headline
    id: period_kpis
    task: apply_sql_query
    partial:
      df: ${{ workflow.events_indexed.return }}
      query: |
        SELECT
          -- INCIDENTS, not events. conflict_seq = 1 marks the first qualifying
          -- event of each incident, so this counts collections-with-a-
          -- qualifying-child plus uncollected qualifying events, exactly as the
          -- MRD defines it. Every other figure below deliberately stays at
          -- EVENT or victim level: "Loss totals are unaffected -- people
          -- injured, livestock killed etc. still sum over events/victims, so
          -- Table 1 would show 23 incidents but still 3 people injured."
          COALESCE(SUM(CASE WHEN is_conflict = 1 AND conflict_seq = 1 THEN 1 ELSE 0 END), 0) AS "Total incidents",
          COALESCE(SUM(CASE WHEN is_conflict = 1 AND event_type = 'human_injury' THEN 1 ELSE 0 END), 0) AS "People injured",
          COALESCE(SUM(CASE WHEN is_conflict = 1 AND event_type = 'human_death' THEN 1 ELSE 0 END), 0) AS "People killed",
          CAST(COALESCE(SUM(CASE WHEN event_type = 'hwc_livestock_predation'
                       THEN CAST(COALESCE(json_extract(event_details, '$."Total livestock dead"'), 0) AS REAL) ELSE 0 END), 0) AS INTEGER) AS "Livestock killed",
          CAST(COALESCE(SUM(CASE WHEN event_type = 'hwc_livestock_predation'
                       THEN CAST(COALESCE(json_extract(event_details, '$."Total livestock injured"'), 0) AS REAL) ELSE 0 END), 0) AS INTEGER) AS "Livestock injured",
          COALESCE(SUM(CASE WHEN is_conflict = 1 AND event_type = 'animal_carcass' THEN 1 ELSE 0 END), 0) AS "Wildlife killed",
          COALESCE(SUM(CASE WHEN is_conflict = 1 AND event_type = 'sick_injured_animal' THEN 1 ELSE 0 END), 0) AS "Wildlife injured",
          COALESCE(SUM(CASE WHEN event_type = 'poisoning' THEN 1 ELSE 0 END), 0) AS "Poisoning events",
          COALESCE(SUM(ret_taken), 0) AS "Retaliation recorded"
        FROM df
      columns: null
      sanitize: true
  # period_ctype and period_species were here. Both computed whole-period
  # versions of charts that the Word report never read -- they were written for
  # docx tables that the MRD pass replaced with figures, and nothing has
  # referenced them since. Removed rather than left running.

- title: Conflict Type
  type: task-group
  description: How the incidents break down by kind of conflict, when, and where.
  tasks:
  # ONE COLOUR PER CONFLICT TYPE, EVERYWHERE.
  #
  # Review feedback: "Can we make colours consistent across the outputs? E.g.
  # conflict event type colour for any charts or map points". Two mechanisms,
  # because the tasks take colour differently:
  #
  #   maps and pies -- apply_color_map accepts a {value: hex} DICT, so the
  #     colour is matched to the label by name and is correct whatever subset
  #     of types the period happens to contain. `ctype_colors` below is the
  #     single source of truth, reused by anchor.
  #
  #   stacked bars -- draw_chart's `palette` is a LIST, cycled over the series
  #     in sorted order, with no way to key it by label. So any chart that
  #     stacks by conflict type pads its frame with a zero row for every type
  #     (the CROSS JOIN scaffolds below). The series set is then always the
  #     same eight, in the same sorted order, and `ctype_palette` lines up with
  #     it. Without the padding, a period missing one type would shift every
  #     colour after it.
  #
  # The eight labels are exactly the CASE arms of `conflict_type` in
  # events_prepared, and `is_conflict = 1` is only ever set for those eight
  # event types, so the ELSE branch cannot reach a chart or a map.
  - name: Conflict Type Counts
    id: ctype_counts
    task: apply_sql_query
    partial:
      query: |
        SELECT conflict_type AS "Conflict type", COUNT(*) AS "Events"
        FROM df WHERE is_conflict = 1
        GROUP BY 1 ORDER BY 2 DESC
      columns: null
      sanitize: true
    mapvalues:
      argnames: df
      argvalues: ${{ workflow.events_grouped.return }}
  - name: Conflict Type Colormap
    id: ctype_cmap
    task: apply_color_map
    partial:
      input_column_name: Conflict type
      colormap: &ctype_colors
        Crop damage: '#b62879'
        Human death: '#8c1700'
        Human injury: '#ed3ea2'
        Infrastructure damage: '#ff803e'
        Livestock predation: '#3e35a3'
        Poisoning: '#a100cb'
        Wildlife death: '#004e26'
        Wildlife injury: '#7ab800'
      output_column_name: ctype_color
    mapvalues:
      argnames: df
      argvalues: ${{ workflow.ctype_counts.return }}
  # A PIE, not the bar this was. Review feedback: "Can we swap this to a pie
  # chart please? Change the caption to 'Conflict events by type'."
  #
  # `color_column` is what makes the slice colours match the map points: it
  # reads the hex straight off the row that apply_color_map wrote.
  - name: Draw Conflict Type Pie
    id: ctype_pie
    task: draw_pie_chart
    partial:
      value_column: Events
      label_column: Conflict type
      color_column: ctype_color
      plot_style: {textinfo: value+percent}
      layout_style: {showlegend: true, legend_title: Conflict type}
    mapvalues:
      argnames: dataframe
      argvalues: ${{ workflow.ctype_cmap.return }}
  - {name: Persist Conflict Type Pie, id: ctype_bar_html, task: persist_text,
     partial: {root_path: "${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}", filename_suffix: conflict_type_pie},
     mapvalues: {argnames: text, argvalues: "${{ workflow.ctype_pie.return }}"}}
  - {name: Conflict Type Pie Widget, id: ctype_bar_w, task: create_plot_widget_single_view,
     skipif: {conditions: *never}, partial: {title: Conflict Events by Type},
     map: {argnames: [view, data], argvalues: "${{ workflow.ctype_bar_html.return }}"}}
  - {name: Merge Conflict Type Pie Views, id: ctype_bar_wm, task: merge_widget_views,
     partial: {widgets: "${{ workflow.ctype_bar_w.return }}"}}

  # SEASONALITY, moved here from its own section.
  #
  # Review feedback: "Can we move the stacked bar chart from section 5 to here
  # with the caption?" and "Stacked bar time axis must include every month in
  # the period, including zero months (currently Jan is dropped)."
  #
  # Both the dropped months and the shifting colours are the same bug: the
  # chart only ever saw the (month, type) pairs that had rows. The frame below
  # is built the other way round -- every month CROSS JOINed with every
  # conflict type, counts LEFT JOINed on -- so a month with no conflict at all
  # still contributes a zero-height bar and holds its place on the axis.
  #
  # The month list spans MIN to MAX of incident_time over EVERY event fetched
  # for the period, not just the conflict ones, which is why a January with
  # patrol events but no conflict events still appears. It is a close proxy for
  # the configured range rather than the range itself: apply_sql_query sees
  # only the dataframe, and nothing carries since/until into SQL.
  #
  # `s` is a counter, and the only way to get one here: the validator requires
  # the query to start with SELECT, so WITH RECURSIVE is unavailable, and df is
  # the single readable table. It yields one integer per row of df, so the
  # month axis can span at most as many months as the period has events -- 11
  # months needs 11 events anywhere in the period, which no real report misses.
  - name: Conflict Trend Frame
    id: trend_df
    task: apply_sql_query
    partial:
      df: ${{ workflow.events_indexed.return }}
      query: |
        SELECT mon."Month" AS "Month",
               typ."Conflict type" AS "Conflict type",
               COALESCE(cnt.n, 0) AS "Incidents"
        FROM (
          SELECT substr('000' || CAST((b.lo + s.n) / 12 AS TEXT), -4, 4) || '-' ||
                 substr('0' || CAST(((b.lo + s.n) % 12) + 1 AS TEXT), -2, 2) AS "Month"
          FROM (
            SELECT MIN(CAST(substr(incident_time, 1, 4) AS INTEGER) * 12
                       + CAST(substr(incident_time, 6, 2) AS INTEGER) - 1) AS lo,
                   MAX(CAST(substr(incident_time, 1, 4) AS INTEGER) * 12
                       + CAST(substr(incident_time, 6, 2) AS INTEGER) - 1) AS hi
            FROM df WHERE incident_time IS NOT NULL
          ) b
          JOIN (SELECT ROW_NUMBER() OVER () - 1 AS n FROM df LIMIT 1200) s
            ON b.lo + s.n <= b.hi
        ) mon
        CROSS JOIN (
                    SELECT 'Crop damage' AS "Conflict type"
          UNION ALL SELECT 'Human death'
          UNION ALL SELECT 'Human injury'
          UNION ALL SELECT 'Infrastructure damage'
          UNION ALL SELECT 'Livestock predation'
          UNION ALL SELECT 'Poisoning'
          UNION ALL SELECT 'Wildlife death'
          UNION ALL SELECT 'Wildlife injury'
        ) typ
        LEFT JOIN (
          SELECT strftime('%Y-%m', incident_time) AS mth,
                 conflict_type AS ct, COUNT(*) AS n
          FROM df WHERE is_conflict = 1 GROUP BY 1, 2
        ) cnt ON cnt.mth = mon."Month" AND cnt.ct = typ."Conflict type"
        ORDER BY 1, 2
      columns: null
      sanitize: true
  # draw_chart, not draw_time_series_bar_chart or draw_bar_chart.
  #
  # draw_bar_chart cannot stack at all: it builds go.Figure(layout=LayoutStyle),
  # and LayoutStyle has no barmode field, so the `layout_kwargs: {barmode:
  # stack}` that used to sit on several of these charts was silently dropped by
  # pydantic and every one of them rendered grouped. draw_chart takes barmode
  # as a real argument.
  #
  # time_interval is left null on purpose: "Month" is already a 'YYYY-MM'
  # string, so the x axis is categorical and the padded months survive. Asking
  # draw_chart to bucket by month instead would re-derive the axis from the
  # data and drop the empty ones again.
  - name: Draw Conflict Trend
    id: trend_chart
    task: draw_chart
    partial:
      dataframe: ${{ workflow.trend_df.return }}
      x_axis: Month
      figures:
      - metric: {display_name: Incidents, aggregator: sum, column: Incidents, decimal_places: 0}
        chart_type: bar
      time_interval: null
      category: Conflict type
      time_breakdown: null
      barmode: stack
      palette: &ctype_palette ['#b62879', '#8c1700', '#ed3ea2', '#ff803e',
                               '#3e35a3', '#a100cb', '#004e26', '#7ab800']
      plot_style: null
      layout_style:
        showlegend: true
        legend_title: Conflict type
        xaxis: {title: Month}
        yaxis: {title: Conflict events}
  - name: Persist Conflict Trend
    id: trend_html
    task: persist_text
    partial:
      text: ${{ workflow.trend_chart.return }}
      root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      filename_suffix: conflict_trend
  - name: Conflict Trend Widget
    id: trend_w
    task: create_plot_widget_single_view
    skipif:
      conditions: *never
    partial:
      title: Conflict Events per Month by Type
      data: ${{ workflow.trend_html.return }}

- title: Species Responsible
  type: task-group
  description: Which animals, and what kind of conflict each causes.
  tasks:
  # STACKED, and in long format because of it.
  #
  # Review feedback: "Can we change this to a stacked bar chart please. Again
  # check the colours are consistent."
  #
  # draw_chart stacks by a single `category` COLUMN, so the wide cross-tab this
  # used to be -- one column per conflict type -- cannot feed it. The query now
  # emits one row per (species, conflict type) instead, scaffolded so that all
  # five types are present for every species even at zero. That padding is what
  # keeps `ctype_palette5` aligned: draw_chart cycles the palette over the
  # series in sorted order, so a period with no Human death would otherwise
  # hand Human death's colour to Human injury.
  #
  # Species order is by total descending, which a categorical x axis preserves
  # only if the rows arrive that way; the ORDER BY at the end does that.
  - name: Species by Conflict Type
    id: species_x
    task: apply_sql_query
    partial:
      query: |
        SELECT sp."Species responsible" AS "Species responsible",
               typ."Conflict type" AS "Conflict type",
               COALESCE(cnt.n, 0) AS "Events"
        FROM (
          SELECT species_h AS "Species responsible", COUNT(*) AS total
          FROM df WHERE is_conflict = 1
            AND event_type IN ('hwc_livestock_predation', 'crop_damage',
                               'infrastructure_damage', 'human_injury', 'human_death')
          GROUP BY 1
        ) sp
        CROSS JOIN (
                    SELECT 'Crop damage' AS "Conflict type"
          UNION ALL SELECT 'Human death'
          UNION ALL SELECT 'Human injury'
          UNION ALL SELECT 'Infrastructure damage'
          UNION ALL SELECT 'Livestock predation'
        ) typ
        LEFT JOIN (
          SELECT species_h AS sp_name, conflict_type AS ct, COUNT(*) AS n
          FROM df WHERE is_conflict = 1
            AND event_type IN ('hwc_livestock_predation', 'crop_damage',
                               'infrastructure_damage', 'human_injury', 'human_death')
          GROUP BY 1, 2
        ) cnt ON cnt.sp_name = sp."Species responsible"
             AND cnt.ct = typ."Conflict type"
        ORDER BY sp.total DESC, 1, 2
      columns: null
      sanitize: true
    mapvalues:
      argnames: df
      argvalues: ${{ workflow.events_grouped.return }}
  - name: Draw Species Bar
    id: species_bar
    task: draw_chart
    partial:
      x_axis: Species responsible
      figures:
      - metric: {display_name: Events, aggregator: sum, column: Events, decimal_places: 0}
        chart_type: bar
      time_interval: null
      category: Conflict type
      time_breakdown: null
      barmode: stack
      # The first five of ctype_palette, in the same sorted order, so a species
      # chart and the seasonality chart give Crop damage the same pink.
      palette: &ctype_palette5 ['#b62879', '#8c1700', '#ed3ea2', '#ff803e', '#3e35a3']
      plot_style: null
      layout_style:
        showlegend: true
        legend_title: Conflict type
        xaxis: {title: Species responsible}
        yaxis: {title: Conflict events}
    mapvalues:
      argnames: dataframe
      argvalues: ${{ workflow.species_x.return }}
  - {name: Persist Species Bar, id: species_bar_html, task: persist_text,
     partial: {root_path: "${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}", filename_suffix: species_bar},
     mapvalues: {argnames: text, argvalues: "${{ workflow.species_bar.return }}"}}
  # Quoted: an unquoted comma inside a flow mapping ends the value and starts
  # a new KEY, so this title became a second partial called "by Conflict
  # Type" and the compiler rejected it as a non-identifier. Every title with
  # a comma, colon or bracket in it is quoted for the same reason.
  - {name: Species Bar Widget, id: species_bar_w, task: create_plot_widget_single_view,
     skipif: {conditions: *never}, partial: {title: "Species Responsible"},
     map: {argnames: [view, data], argvalues: "${{ workflow.species_bar_html.return }}"}}
  - {name: Merge Species Bar Views, id: species_bar_wm, task: merge_widget_views,
     partial: {widgets: "${{ workflow.species_bar_w.return }}"}}

- title: Hotspots
  type: task-group
  description: Where conflict happens, as points and as density.
  tasks:
  # Village/area is free TEXT on four of the five conflict events, so it
  # cannot be grouped on. Hotspots are therefore geometry-based. Grouping by
  # Patrol Block would need a Patrol Blocks spatial feature group in ER,
  # which does not exist -- see the MRD, section 4.
  # MRD: "Map: one point per incident". ONE row per incident, at the
  # incident's location -- the first child event's geometry, per the
  # report-wide rules. conflict_seq = 1 picks that single row.
  #
  # incident_geometry is aliased back to `geometry` because apply_sql_query
  # only reconstructs a geometry column under that exact name. Any other name
  # comes back as plain WKT text and the map layer gets nothing to draw.
  - name: Incident Points
    id: inc_points
    task: apply_sql_query
    partial:
      query: |
        SELECT incident_geometry AS geometry,
               conflict_type AS "Conflict type", species_h AS "Species responsible",
               substr(incident_time, 1, 16) AS "Date", serial_number AS "Serial"
        FROM df
        WHERE is_conflict = 1 AND conflict_seq = 1 AND incident_geometry IS NOT NULL
      columns: null
      sanitize: true
    mapvalues:
      argnames: df
      argvalues: ${{ workflow.events_grouped.return }}
  # The DICT form, shared by anchor with the pie and the event map. The list
  # this used to be assigned colours by position in whatever order the period's
  # types happened to appear, so Livestock predation was indigo on the map and
  # a different colour in the chart beside it.
  - name: Incident Points Colormap
    id: inc_cmap
    task: apply_color_map
    partial:
      input_column_name: Conflict type
      colormap: *ctype_colors
      output_column_name: inc_color
    mapvalues:
      argnames: df
      argvalues: ${{ workflow.inc_points.return }}
  - name: Incident Points Layer
    id: inc_layer
    task: create_point_layer
    skipif:
      conditions: &geo
      - any_is_empty_df
      - any_dependency_skipped
      - all_geometry_are_none
    partial:
      layer_style:
        get_radius: 8.0
        radius_units: pixels
        fill_color_column: inc_color
        get_line_color: '#ffffff'
        stroked: true
        get_line_width: 1
        opacity: 0.9
      legend: {label_column: Conflict type, color_column: inc_color}
      tooltip_columns: [Conflict type, Species responsible, Date, Serial]
    mapvalues:
      argnames: geodataframe
      argvalues: ${{ workflow.inc_cmap.return }}
  - name: Draw Incident Map
    id: inc_map
    task: draw_ecomap
    partial:
      tile_layers: ${{ workflow.base_map_defs.return }}
      static: false
      title: null
      north_arrow_style: {placement: top-left}
      legend_style: {placement: bottom-right}
      # Review feedback: "Check zoom. Make sure it's not rendering grey tiles."
      # At 20 the auto-fitted view state zooms past the level the ArcGIS
      # basemaps actually serve tiles for over rural Laikipia, and a map with
      # one or two points -- which several of these are -- fits to exactly
      # that. 15 is inside tile coverage everywhere and still shows
      # individual bomas.
      max_zoom: 15
    mapvalues:
      argnames: geo_layers
      argvalues: ${{ workflow.inc_layer.return }}
  - {name: Persist Incident Map, id: inc_map_html, task: persist_text,
     partial: {root_path: "${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}", filename_suffix: incident_map},
     mapvalues: {argnames: text, argvalues: "${{ workflow.inc_map.return }}"}}
  - {name: Incident Map Widget, id: inc_map_w, task: create_map_widget_single_view,
     skipif: {conditions: *never}, partial: {title: Conflict Incidents},
     map: {argnames: [view, data], argvalues: "${{ workflow.inc_map_html.return }}"}}
  - {name: Merge Incident Map Views, id: inc_map_wm, task: merge_widget_views,
     partial: {widgets: "${{ workflow.inc_map_w.return }}"}}

  # THE SECOND MAP THE MRD ASKS FOR: "Map: one point per event type".
  #
  # The difference from the map above is the row it draws. That one plots one
  # point per INCIDENT, at the earliest child's geometry; this plots every
  # qualifying conflict EVENT at its own location, so a collection of three
  # linked reports is one dot there and three dots here. The two read together:
  # how many distinct incidents, and how much reporting each generated.
  #
  # Same colour dict as the incident map and the pie, so a type is one colour
  # across all three.
  - name: Event Points
    id: evt_points
    task: apply_sql_query
    partial:
      query: |
        SELECT geometry,
               conflict_type AS "Conflict type", species_h AS "Species responsible",
               substr(report_time, 1, 16) AS "Date", serial_number AS "Serial"
        FROM df
        WHERE is_conflict = 1 AND geometry IS NOT NULL
      columns: null
      sanitize: true
    mapvalues:
      argnames: df
      argvalues: ${{ workflow.events_grouped.return }}
  - name: Event Points Colormap
    id: evt_cmap
    task: apply_color_map
    partial:
      input_column_name: Conflict type
      colormap: *ctype_colors
      output_column_name: evt_color
    mapvalues:
      argnames: df
      argvalues: ${{ workflow.evt_points.return }}
  - name: Event Points Layer
    id: evt_layer
    task: create_point_layer
    skipif:
      conditions: *geo
    partial:
      layer_style:
        get_radius: 6.0
        radius_units: pixels
        fill_color_column: evt_color
        get_line_color: '#ffffff'
        stroked: true
        get_line_width: 1
        opacity: 0.85
      legend: {label_column: Conflict type, color_column: evt_color}
      tooltip_columns: [Conflict type, Species responsible, Date, Serial]
    mapvalues:
      argnames: geodataframe
      argvalues: ${{ workflow.evt_cmap.return }}
  - name: Draw Event Map
    id: evt_map
    task: draw_ecomap
    partial:
      tile_layers: ${{ workflow.base_map_defs.return }}
      static: false
      title: null
      north_arrow_style: {placement: top-left}
      legend_style: {placement: bottom-right}
      max_zoom: 15
    mapvalues:
      argnames: geo_layers
      argvalues: ${{ workflow.evt_layer.return }}
  - {name: Persist Event Map, id: evt_map_html, task: persist_text,
     partial: {root_path: "${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}", filename_suffix: event_map},
     mapvalues: {argnames: text, argvalues: "${{ workflow.evt_map.return }}"}}
  - {name: Event Map Widget, id: evt_map_w, task: create_map_widget_single_view,
     skipif: {conditions: *never}, partial: {title: Conflict Events},
     map: {argnames: [view, data], argvalues: "${{ workflow.evt_map_html.return }}"}}
  - {name: Merge Event Map Views, id: evt_map_wm, task: merge_widget_views,
     partial: {widgets: "${{ workflow.evt_map_w.return }}"}}

# SECTION 5 (Seasonality) WAS A TASK-GROUP HERE AND IS GONE.
#
# Review feedback: "Can we move the stacked bar chart from section 5 to here
# [section 2]" and "Section 5 -- I think we can drop this section as we have
# moved the output earlier". trend_df / trend_chart / trend_html / trend_w now
# live in the Conflict Type group above, rebuilt to keep zero months.
- title: Human Injury and Death
  type: task-group
  description: People hurt or killed in conflict, by species responsible.
  tasks:
  # STACKED. Review feedback, section 6: "Could we change this to a stacked bar
  # chart please?" Long format for the same reason as the species chart, and
  # scaffolded so Injured and Killed are both always present and the palette
  # cannot swap them in a period with no deaths.
  #
  # `outcome_palette` is used by the wildlife and livestock charts too: injured
  # is amber and killed is dark red in all three, which is the other half of
  # "make colours consistent across the outputs". Sorted order puts Injured
  # before Killed.
  - name: Casualties by Species
    id: cas_by_species
    task: apply_sql_query
    partial:
      query: |
        SELECT sp."Species responsible" AS "Species responsible",
               o."Outcome" AS "Outcome",
               COALESCE(cnt.n, 0) AS "People"
        FROM (
          SELECT species_h AS "Species responsible", COUNT(*) AS total
          FROM df
          WHERE is_conflict = 1 AND event_type IN ('human_injury', 'human_death')
          GROUP BY 1
        ) sp
        CROSS JOIN (SELECT 'Injured' AS "Outcome" UNION ALL SELECT 'Killed') o
        LEFT JOIN (
          SELECT species_h AS sp_name,
                 CASE WHEN event_type = 'human_death' THEN 'Killed' ELSE 'Injured' END AS oc,
                 COUNT(*) AS n
          FROM df
          WHERE is_conflict = 1 AND event_type IN ('human_injury', 'human_death')
          GROUP BY 1, 2
        ) cnt ON cnt.sp_name = sp."Species responsible" AND cnt.oc = o."Outcome"
        ORDER BY sp.total DESC, 1, 2
      columns: null
      sanitize: true
    mapvalues:
      argnames: df
      argvalues: ${{ workflow.events_grouped.return }}
  - name: Draw Casualties Bar
    id: cas_bar
    task: draw_chart
    partial:
      x_axis: Species responsible
      figures:
      - metric: {display_name: People, aggregator: sum, column: People, decimal_places: 0}
        chart_type: bar
      time_interval: null
      category: Outcome
      time_breakdown: null
      barmode: stack
      palette: &outcome_palette ['#ff803e', '#8c1700']
      plot_style: null
      layout_style:
        showlegend: true
        legend_title: Outcome
        xaxis: {title: Species responsible}
        yaxis: {title: People injured or killed}
    mapvalues:
      argnames: dataframe
      argvalues: ${{ workflow.cas_by_species.return }}
  - {name: Persist Casualties Bar, id: cas_bar_html, task: persist_text,
     partial: {root_path: "${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}", filename_suffix: casualties_bar},
     mapvalues: {argnames: text, argvalues: "${{ workflow.cas_bar.return }}"}}
  - {name: Casualties Bar Widget, id: cas_bar_w, task: create_plot_widget_single_view,
     skipif: {conditions: *never}, partial: {title: Human Casualties by Species Responsible},
     map: {argnames: [view, data], argvalues: "${{ workflow.cas_bar_html.return }}"}}
  - {name: Merge Casualties Bar Views, id: cas_bar_wm, task: merge_widget_views,
     partial: {widgets: "${{ workflow.cas_bar_w.return }}"}}

  # PII RULE, from the MRD's report-wide rules. This table is a column
  # WHITELIST, not a blacklist: name, ID number, telephone, date of birth,
  # ethnicity and tribe are never selected, so they cannot reach a widget or
  # the Word report even if the form adds them later.
  - name: Casualty Table
    id: cas_table
    task: apply_sql_query
    partial:
      query: |
        SELECT substr(report_time, 1, 10) AS "Date",
               -- Review feedback: "Could we add the event coordinates to the
               -- 'Location' column". Village/Area is free text and is the only
               -- place-name the conflict forms carry. The coordinates come off
               -- the event geometry, which sanitize hands over as WKT
               -- ("POINT (36.9 0.44)"), so they are parsed out of the string
               -- and printed latitude first, the order a reader expects.
               CASE
                 WHEN lon_txt IS NULL THEN village
                 ELSE village || ' (' || lat_txt || ', ' || lon_txt || ')'
               END AS "Location",
               CASE WHEN event_type = 'human_death' THEN 'Killed' ELSE 'Injured' END AS "Outcome",
               species_h AS "Species responsible",
               COALESCE(json_extract(event_details, '$."Age"'), '-') AS "Age",
               COALESCE(json_extract(event_details, '$."Sex"'), '-') AS "Sex",
               COALESCE(action_txt, '-') AS "Action taken",
               -- Review feedback: "What is the 'Circumstances' column referring
               -- to? I think this is best as event notes."
               --
               -- It used to be the structured circumstance fields (Activity at
               -- time of incident, Time of day), chosen BECAUSE they cannot
               -- carry personal detail. The event note is free text, so unlike
               -- every other column in this table it is not covered by the
               -- field whitelist: whatever a ranger typed appears verbatim,
               -- names included. Kept because the review asked for it, and
               -- flagged here so the decision is visible rather than implied.
               COALESCE(note_txt, '-') AS "Notes",
               serial_number AS "Serial"
        FROM (
          SELECT *,
                 COALESCE(json_extract(event_details, '$."village_area"'),
                          json_extract(event_details, '$."Village/Area"'), '-') AS village,
                 NULLIF(substr(wkt, 1, instr(wkt, ' ') - 1), '') AS lon_txt,
                 NULLIF(substr(wkt, instr(wkt, ' ') + 1), '') AS lat_txt
          FROM (
            SELECT *,
                   CASE WHEN geometry IS NULL THEN NULL
                        ELSE TRIM(REPLACE(REPLACE(REPLACE(
                             CAST(geometry AS TEXT), 'POINT', ''), '(', ''), ')', ''))
                   END AS wkt
            FROM df
            WHERE is_conflict = 1 AND event_type IN ('human_injury', 'human_death')
          )
        )
        ORDER BY 1 DESC
      columns: null
      sanitize: true
    mapvalues:
      argnames: df
      argvalues: ${{ workflow.events_grouped.return }}
  - {name: Draw Casualty Table, id: cas_tbl, task: draw_table,
     partial: {columns: null, table_config: {enable_sorting: true, enable_filtering: false,
                                             enable_download: true, hide_header: false}},
     mapvalues: {argnames: dataframe, argvalues: "${{ workflow.cas_table.return }}"}}
  - {name: Persist Casualty Table, id: cas_tbl_html, task: persist_text,
     partial: {root_path: "${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}", filename_suffix: casualty_table},
     mapvalues: {argnames: text, argvalues: "${{ workflow.cas_tbl.return }}"}}
  - {name: Casualty Table Widget, id: cas_tbl_w, task: create_table_widget_single_view,
     skipif: {conditions: *never}, partial: {title: "Human Casualties"},
     map: {argnames: [view, data], argvalues: "${{ workflow.cas_tbl_html.return }}"}}
  - {name: Merge Casualty Table Views, id: cas_tbl_wm, task: merge_widget_views,
     partial: {widgets: "${{ workflow.cas_tbl_w.return }}"}}

- title: Wildlife Injury and Death
  type: task-group
  description: Animals killed or hurt in conflict, by species and by cause.
  tasks:
  - name: Wildlife Casualties by Species
    id: wl_by_species
    task: apply_sql_query
    partial:
      query: |
        SELECT sp."Species" AS "Species",
               o."Outcome" AS "Outcome",
               COALESCE(cnt.n, 0) AS "Animals"
        FROM (
          SELECT COALESCE(animal_h, 'Unknown') AS "Species", COUNT(*) AS total
          FROM df
          WHERE is_conflict = 1 AND event_type IN ('animal_carcass', 'sick_injured_animal')
          GROUP BY 1
        ) sp
        CROSS JOIN (SELECT 'Injured' AS "Outcome" UNION ALL SELECT 'Killed') o
        LEFT JOIN (
          SELECT COALESCE(animal_h, 'Unknown') AS sp_name,
                 CASE WHEN event_type = 'animal_carcass' THEN 'Killed' ELSE 'Injured' END AS oc,
                 COUNT(*) AS n
          FROM df
          WHERE is_conflict = 1 AND event_type IN ('animal_carcass', 'sick_injured_animal')
          GROUP BY 1, 2
        ) cnt ON cnt.sp_name = sp."Species" AND cnt.oc = o."Outcome"
        ORDER BY sp.total DESC, 1, 2
      columns: null
      sanitize: true
    mapvalues:
      argnames: df
      argvalues: ${{ workflow.events_grouped.return }}
  # STACKED. Review feedback, section 7: "Bar chart - Wildlife killed and
  # injured by species: change to stacked bar chart."
  - name: Draw Wildlife Casualties Bar
    id: wl_bar
    task: draw_chart
    partial:
      x_axis: Species
      figures:
      - metric: {display_name: Animals, aggregator: sum, column: Animals, decimal_places: 0}
        chart_type: bar
      time_interval: null
      category: Outcome
      time_breakdown: null
      barmode: stack
      palette: *outcome_palette
      plot_style: null
      layout_style:
        showlegend: true
        legend_title: Outcome
        xaxis: {title: Species}
        yaxis: {title: Animals killed or injured}
    mapvalues:
      argnames: dataframe
      argvalues: ${{ workflow.wl_by_species.return }}
  - {name: Persist Wildlife Casualties Bar, id: wl_bar_html, task: persist_text,
     partial: {root_path: "${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}", filename_suffix: wildlife_casualties_bar},
     mapvalues: {argnames: text, argvalues: "${{ workflow.wl_bar.return }}"}}
  - {name: Wildlife Casualties Bar Widget, id: wl_bar_w, task: create_plot_widget_single_view,
     skipif: {conditions: *never}, partial: {title: Wildlife Killed and Injured},
     map: {argnames: [view, data], argvalues: "${{ workflow.wl_bar_html.return }}"}}
  - {name: Merge Wildlife Casualties Bar Views, id: wl_bar_wm, task: merge_widget_views,
     partial: {widgets: "${{ workflow.wl_bar_w.return }}"}}

  # Cause of Death and Cause of Injury are separate conditional fields that
  # carry the same vocabulary (Arrow / Euthanised / Fence / Gunshot / Other /
  # Poisoning / Snare / Spear), so they are COALESCEd into one column.
  - name: Wildlife Casualty Causes
    id: wl_by_cause
    task: apply_sql_query
    partial:
      query: |
        SELECT COALESCE(wl_cause, 'Not recorded') AS "Cause",
               COUNT(*) AS "Animals"
        FROM df
        WHERE is_conflict = 1 AND event_type IN ('animal_carcass', 'sick_injured_animal')
        GROUP BY 1 ORDER BY 2 DESC
      columns: null
      sanitize: true
    mapvalues:
      argnames: df
      argvalues: ${{ workflow.events_grouped.return }}
  # A PIE. Review feedback: "Bar chart - Cause of wildlife death or injury: can
  # we change this to a pie chart please? Flagging that the legend is missing
  # on the bar graph." A single-series bar had nothing to put in a legend; as a
  # pie, the causes ARE the legend.
  - name: Draw Wildlife Cause Pie
    id: wl_cause_bar
    task: draw_pie_chart
    partial:
      value_column: Animals
      label_column: Cause
      color_column: null
      plot_style: {textinfo: value+percent}
      layout_style: {showlegend: true, legend_title: Cause}
    mapvalues:
      argnames: dataframe
      argvalues: ${{ workflow.wl_by_cause.return }}
  - {name: Persist Wildlife Cause Bar, id: wl_cause_html, task: persist_text,
     partial: {root_path: "${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}", filename_suffix: wildlife_cause_bar},
     mapvalues: {argnames: text, argvalues: "${{ workflow.wl_cause_bar.return }}"}}
  - {name: Wildlife Cause Bar Widget, id: wl_cause_w, task: create_plot_widget_single_view,
     skipif: {conditions: *never}, partial: {title: Cause of Wildlife Death or Injury},
     map: {argnames: [view, data], argvalues: "${{ workflow.wl_cause_html.return }}"}}
  - {name: Merge Wildlife Cause Bar Views, id: wl_cause_wm, task: merge_widget_views,
     partial: {widgets: "${{ workflow.wl_cause_w.return }}"}}

  - name: Wildlife Casualty Points
    id: wl_points
    task: apply_sql_query
    partial:
      query: |
        SELECT geometry,
               CASE WHEN event_type = 'animal_carcass' THEN 'Killed' ELSE 'Injured' END AS "Outcome",
               COALESCE(animal_h, 'Unknown') AS "Species",
               COALESCE(wl_cause, '-') AS "Cause",
               substr(report_time, 1, 16) AS "Date"
        FROM df
        WHERE is_conflict = 1 AND event_type IN ('animal_carcass', 'sick_injured_animal')
          AND geometry IS NOT NULL
      columns: null
      sanitize: true
    mapvalues:
      argnames: df
      argvalues: ${{ workflow.events_grouped.return }}
  - {name: Wildlife Casualty Colormap, id: wl_cmap, task: apply_color_map,
     partial: {input_column_name: Outcome, colormap: ['#8c1700', '#ff803e'], output_column_name: wl_color},
     mapvalues: {argnames: df, argvalues: "${{ workflow.wl_points.return }}"}}
  - name: Wildlife Casualty Layer
    id: wl_layer
    task: create_point_layer
    skipif:
      conditions: *geo
    partial:
      layer_style:
        get_radius: 7.0
        radius_units: pixels
        fill_color_column: wl_color
        get_line_color: '#ffffff'
        stroked: true
        get_line_width: 1
        opacity: 0.85
      legend: {label_column: Outcome, color_column: wl_color}
      tooltip_columns: [Outcome, Species, Cause, Date]
    mapvalues:
      argnames: geodataframe
      argvalues: ${{ workflow.wl_cmap.return }}
  - name: Draw Wildlife Casualty Map
    id: wl_map
    task: draw_ecomap
    partial:
      tile_layers: ${{ workflow.base_map_defs.return }}
      static: false
      title: null
      north_arrow_style: {placement: top-left}
      legend_style: {placement: bottom-right}
      # Review feedback: "Check zoom. Make sure it's not rendering grey tiles."
      # At 20 the auto-fitted view state zooms past the level the ArcGIS
      # basemaps actually serve tiles for over rural Laikipia, and a map with
      # one or two points -- which several of these are -- fits to exactly
      # that. 15 is inside tile coverage everywhere and still shows
      # individual bomas.
      max_zoom: 15
    mapvalues:
      argnames: geo_layers
      argvalues: ${{ workflow.wl_layer.return }}
  - {name: Persist Wildlife Casualty Map, id: wl_map_html, task: persist_text,
     partial: {root_path: "${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}", filename_suffix: wildlife_casualty_map},
     mapvalues: {argnames: text, argvalues: "${{ workflow.wl_map.return }}"}}
  - {name: Wildlife Casualty Map Widget, id: wl_map_w, task: create_map_widget_single_view,
     skipif: {conditions: *never}, partial: {title: Wildlife Killed or Injured},
     map: {argnames: [view, data], argvalues: "${{ workflow.wl_map_html.return }}"}}
  - {name: Merge Wildlife Casualty Map Views, id: wl_map_wm, task: merge_widget_views,
     partial: {widgets: "${{ workflow.wl_map_w.return }}"}}

- title: Livestock Predation
  type: task-group
  description: What was taken, by what, and whether the boma held.
  tasks:
  # Every predation record is a conflict record, so no cause filter here.
  - name: Livestock Losses by Species
    id: pred_by_species
    task: apply_sql_query
    partial:
      query: |
        SELECT a."Livestock species" AS "Livestock species",
               o."Outcome" AS "Outcome",
               CASE WHEN o."Outcome" = 'Killed' THEN a.killed ELSE a.injured END AS "Animals"
        FROM (
          SELECT COALESCE(NULLIF(TRIM(REPLACE(REPLACE(REPLACE(REPLACE(
                   CAST(json_extract(event_details, '$."Livestock species"') AS TEXT),
                   '","', ', '), '["', ''), '"]', ''), '[]', '')), ''), 'Unspecified') AS "Livestock species",
                 CAST(COALESCE(SUM(CAST(COALESCE(json_extract(event_details, '$."Total livestock dead"'), 0) AS REAL)), 0) AS INTEGER) AS killed,
                 CAST(COALESCE(SUM(CAST(COALESCE(json_extract(event_details, '$."Total livestock injured"'), 0) AS REAL)), 0) AS INTEGER) AS injured
          FROM df WHERE event_type = 'hwc_livestock_predation'
          GROUP BY 1
        ) a
        CROSS JOIN (SELECT 'Injured' AS "Outcome" UNION ALL SELECT 'Killed') o
        ORDER BY a.killed DESC, a.injured DESC, 1, 2
      columns: null
      sanitize: true
    mapvalues:
      argnames: df
      argvalues: ${{ workflow.events_grouped.return }}
  # STACKED. Review feedback, section 8: "Bar graph - Livestock killed and
  # injured by livestock species: could we make this stacked please?" The
  # CROSS JOIN turns the two aggregate columns into two rows per species, which
  # is the shape draw_chart's `category` needs, and guarantees both series
  # exist so `outcome_palette` keeps amber on injured.
  - name: Draw Livestock Losses Bar
    id: pred_bar
    task: draw_chart
    partial:
      x_axis: Livestock species
      figures:
      - metric: {display_name: Animals, aggregator: sum, column: Animals, decimal_places: 0}
        chart_type: bar
      time_interval: null
      category: Outcome
      time_breakdown: null
      barmode: stack
      palette: *outcome_palette
      plot_style: null
      layout_style:
        showlegend: true
        legend_title: Outcome
        xaxis: {title: Livestock species}
        yaxis: {title: Animals killed or injured}
    mapvalues:
      argnames: dataframe
      argvalues: ${{ workflow.pred_by_species.return }}
  - {name: Persist Livestock Losses Bar, id: pred_bar_html, task: persist_text,
     partial: {root_path: "${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}", filename_suffix: predation_losses_bar},
     mapvalues: {argnames: text, argvalues: "${{ workflow.pred_bar.return }}"}}
  - {name: Livestock Losses Bar Widget, id: pred_bar_w, task: create_plot_widget_single_view,
     skipif: {conditions: *never}, partial: {title: Livestock Killed and Injured by Species},
     map: {argnames: [view, data], argvalues: "${{ workflow.pred_bar_html.return }}"}}
  - {name: Merge Livestock Losses Bar Views, id: pred_bar_wm, task: merge_widget_views,
     partial: {widgets: "${{ workflow.pred_bar_w.return }}"}}

  - name: Predators Responsible
    id: pred_predators
    task: apply_sql_query
    partial:
      query: |
        SELECT species_h AS "Predator",
               COUNT(*) AS "Attacks",
               CAST(COALESCE(SUM(CAST(COALESCE(json_extract(event_details, '$."Total livestock dead"'), 0) AS REAL)), 0) AS INTEGER) AS "Livestock killed"
        FROM df WHERE event_type = 'hwc_livestock_predation'
        GROUP BY 1 ORDER BY 3 DESC, 2 DESC
      columns: null
      sanitize: true
    mapvalues:
      argnames: df
      argvalues: ${{ workflow.events_grouped.return }}
  # Review feedback, section 8: "Bar graph - Predators responsible: legend
  # missing." Plotly hides the legend on a single-trace figure unless asked, so
  # showlegend is set explicitly, and the axes are now labelled like every
  # other chart in the report.
  - name: Draw Predators Bar
    id: pred_pred_bar
    task: draw_bar_chart
    partial:
      category: Predator
      bar_chart_configs:
      - {label: Livestock killed, column: Livestock killed, agg_func: sum, show_label: true, style: {marker_color: '#3e35a3'}}
      layout_kwargs:
        showlegend: true
        legend_title: Measure
        xaxis: {title: Predator species}
        yaxis: {title: Livestock killed}
    mapvalues:
      argnames: dataframe
      argvalues: ${{ workflow.pred_predators.return }}
  - {name: Persist Predators Bar, id: pred_pred_html, task: persist_text,
     partial: {root_path: "${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}", filename_suffix: predators_bar},
     mapvalues: {argnames: text, argvalues: "${{ workflow.pred_pred_bar.return }}"}}
  - {name: Predators Bar Widget, id: pred_pred_w, task: create_plot_widget_single_view,
     skipif: {conditions: *never}, partial: {title: Livestock Killed by Predator Species},
     map: {argnames: [view, data], argvalues: "${{ workflow.pred_pred_html.return }}"}}
  - {name: Merge Predators Bar Views, id: pred_pred_wm, task: merge_widget_views,
     partial: {widgets: "${{ workflow.pred_pred_w.return }}"}}

  # Inside / outside boma / not recorded -- the question the boma fields exist
  # to answer, and the one a manager acts on.
  - name: Where Attacks Happened
    id: pred_where
    task: apply_sql_query
    partial:
      query: |
        SELECT COALESCE(json_extract(event_details, '$."Animals found inside or outside boma"'),
                        json_extract(event_details, '$."Animals found"'), 'Not recorded') AS "Attack location",
               COUNT(*) AS "Attacks"
        FROM df WHERE event_type = 'hwc_livestock_predation'
        GROUP BY 1 ORDER BY 2 DESC
      columns: null
      sanitize: true
    mapvalues:
      argnames: df
      argvalues: ${{ workflow.events_grouped.return }}
  - {name: Draw Attack Location Pie, id: pred_where_pie, task: draw_pie_chart,
     partial: {value_column: Attacks, label_column: Attack location, color_column: null,
               plot_style: {textinfo: value+percent},
               layout_style: {showlegend: true, legend_title: Attack location}},
     mapvalues: {argnames: dataframe, argvalues: "${{ workflow.pred_where.return }}"}}
  - {name: Persist Attack Location Pie, id: pred_where_html, task: persist_text,
     partial: {root_path: "${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}", filename_suffix: attack_location_pie},
     mapvalues: {argnames: text, argvalues: "${{ workflow.pred_where_pie.return }}"}}
  - {name: Attack Location Pie Widget, id: pred_where_w, task: create_plot_widget_single_view,
     skipif: {conditions: *never}, partial: {title: Where Attacks Happened},
     map: {argnames: [view, data], argvalues: "${{ workflow.pred_where_html.return }}"}}
  - {name: Merge Attack Location Pie Views, id: pred_where_wm, task: merge_widget_views,
     partial: {widgets: "${{ workflow.pred_where_w.return }}"}}

  # Proportional symbols: radius scales with livestock killed, so one bad
  # night reads differently from one goat.
  - name: Predation Points
    id: pred_points
    task: apply_sql_query
    partial:
      query: |
        SELECT geometry,
               species_h AS "Predator",
               CAST(COALESCE(CAST(json_extract(event_details, '$."Total livestock dead"') AS REAL), 0) AS INTEGER) AS "Livestock killed",
               COALESCE(json_extract(event_details, '$."Animals found inside or outside boma"'),
                        json_extract(event_details, '$."Animals found"'), '-') AS "Attack location",
               substr(report_time, 1, 16) AS "Date"
        FROM df WHERE event_type = 'hwc_livestock_predation' AND geometry IS NOT NULL
      columns: null
      sanitize: true
    mapvalues:
      argnames: df
      argvalues: ${{ workflow.events_grouped.return }}
  - {name: Predation Colormap, id: pred_cmap, task: apply_color_map,
     partial: {input_column_name: Predator,
               colormap: ['#3e35a3', '#b62879', '#ff803e', '#ed3ea2', '#3089ff', '#8c1700', '#a100cb', '#004e26', '#002960', '#f23b0e'],
               output_column_name: pred_color},
     mapvalues: {argnames: df, argvalues: "${{ workflow.pred_points.return }}"}}

  # ON THE get_radius SERIALIZER WARNING, which every mock run prints:
  #
  #     PydanticSerializationUnexpectedValue(Expected `float` …
  #       field_name='get_radius', input_value=array([0, 2, 5, 4, 1, 4, 6, 3]))
  #
  # It is cosmetic. `get_radius` is declared `FloatAccessor = str | float |
  # list[float]`; it receives the resolved column as an ndarray, which matches
  # none of those, so pydantic grumbles while deck.gl consumes it fine -- the
  # maps render.
  #
  # The leading 0 is an attack where livestock were injured but none killed.
  # It does NOT vanish: `radius_min_pixels: 5` below clamps the drawn radius,
  # so a zero-loss attack renders at the minimum dot size, which is the right
  # picture -- smallest dot for smallest loss.
  #
  # `shift_radius_values` was tried here and removed. Its docstring claims it
  # "shifts the given radius column so that values are >= 1", but the code
  # only lifts when `series.min() < 0` or when the series has NaNs. With
  # min == 0 and no NaNs it returns the column untouched, so it was a no-op
  # node that implied a fix it was not making. Worth reporting upstream: the
  # docstring and the behaviour disagree.
  - name: Predation Layer
    id: pred_layer
    task: create_point_layer
    skipif:
      conditions: *geo
    partial:
      layer_style:
        get_radius: Livestock killed
        radius_scale: 3.0
        radius_min_pixels: 5
        radius_max_pixels: 40
        fill_color_column: pred_color
        get_line_color: '#ffffff'
        stroked: true
        get_line_width: 1
        opacity: 0.8
      legend: {label_column: Predator, color_column: pred_color}
      tooltip_columns: [Predator, Livestock killed, Attack location, Date]
    mapvalues:
      argnames: geodataframe
      argvalues: ${{ workflow.pred_cmap.return }}
  - name: Draw Predation Map
    id: pred_map
    task: draw_ecomap
    partial:
      tile_layers: ${{ workflow.base_map_defs.return }}
      static: false
      title: null
      north_arrow_style: {placement: top-left}
      legend_style: {placement: bottom-right}
      # Review feedback: "Check zoom. Make sure it's not rendering grey tiles."
      # At 20 the auto-fitted view state zooms past the level the ArcGIS
      # basemaps actually serve tiles for over rural Laikipia, and a map with
      # one or two points -- which several of these are -- fits to exactly
      # that. 15 is inside tile coverage everywhere and still shows
      # individual bomas.
      max_zoom: 15
    mapvalues:
      argnames: geo_layers
      argvalues: ${{ workflow.pred_layer.return }}
  - {name: Persist Predation Map, id: pred_map_html, task: persist_text,
     partial: {root_path: "${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}", filename_suffix: predation_map},
     mapvalues: {argnames: text, argvalues: "${{ workflow.pred_map.return }}"}}
  - {name: Predation Map Widget, id: pred_map_w, task: create_map_widget_single_view,
     skipif: {conditions: *never}, partial: {title: "Predation Events"},
     map: {argnames: [view, data], argvalues: "${{ workflow.pred_map_html.return }}"}}
  - {name: Merge Predation Map Views, id: pred_map_wm, task: merge_widget_views,
     partial: {widgets: "${{ workflow.pred_map_w.return }}"}}

- title: Crop and Infrastructure Damage
  type: task-group
  description: What was damaged and how much of it, where the cause was wildlife.
  tasks:
  # MRD section "Crop / Infrastructure damage" asks for SEVEN outputs. The
  # review reordered them -- "Line chart: move it to be the first output" -- and
  # replaced the line with a stacked bar, so they now run:
  #   1 stacked bar     damage events per month, stacked crop / infrastructure
  #   2 horizontal bar  incidents per crop type
  #   3 stacked bar     extent of CROP damage, stacked by damage type
  #   4 stacked bar     incidents per tree type, stacked by number of trees
  #   5 stacked bar     property damage by property type and extent
  #   6 map             crop damage points
  #   7 map             infrastructure damage points
  # All seven are below, in that order.

  # 1 -- damage over time.
  #
  # Review feedback: "Line chart - I think we should swap this for a stacked bar
  # chart to show events over time. Months for x axis. Move it to be the first
  # output."
  #
  # Same month scaffold as the seasonality chart in section 2, for the same
  # reason: a month with no damage has to keep its slot on the axis rather than
  # vanish. UNGROUPED -- it reads events_indexed and spans the whole period, so
  # it feeds the dashboard unmerged.
  - name: Damage Trend Frame
    id: dmg_trend_df
    task: apply_sql_query
    partial:
      df: ${{ workflow.events_indexed.return }}
      query: |
        SELECT mon."Month" AS "Month",
               typ."Damage type" AS "Damage type",
               COALESCE(cnt.n, 0) AS "Events"
        FROM (
          SELECT substr('000' || CAST((b.lo + s.n) / 12 AS TEXT), -4, 4) || '-' ||
                 substr('0' || CAST(((b.lo + s.n) % 12) + 1 AS TEXT), -2, 2) AS "Month"
          FROM (
            SELECT MIN(CAST(substr(incident_time, 1, 4) AS INTEGER) * 12
                       + CAST(substr(incident_time, 6, 2) AS INTEGER) - 1) AS lo,
                   MAX(CAST(substr(incident_time, 1, 4) AS INTEGER) * 12
                       + CAST(substr(incident_time, 6, 2) AS INTEGER) - 1) AS hi
            FROM df WHERE incident_time IS NOT NULL
          ) b
          JOIN (SELECT ROW_NUMBER() OVER () - 1 AS n FROM df LIMIT 1200) s
            ON b.lo + s.n <= b.hi
        ) mon
        CROSS JOIN (
                    SELECT 'Crop damage' AS "Damage type"
          UNION ALL SELECT 'Infrastructure damage'
        ) typ
        LEFT JOIN (
          SELECT strftime('%Y-%m', incident_time) AS mth,
                 conflict_type AS ct, COUNT(*) AS n
          FROM df
          WHERE is_conflict = 1 AND event_type IN ('crop_damage', 'infrastructure_damage')
          GROUP BY 1, 2
        ) cnt ON cnt.mth = mon."Month" AND cnt.ct = typ."Damage type"
        ORDER BY 1, 2
      columns: null
      sanitize: true
  - name: Draw Damage Trend
    id: dmg_trend
    task: draw_chart
    partial:
      dataframe: ${{ workflow.dmg_trend_df.return }}
      x_axis: Month
      figures:
      - metric: {display_name: Events, aggregator: sum, column: Events, decimal_places: 0}
        chart_type: bar
      time_interval: null
      category: Damage type
      time_breakdown: null
      barmode: stack
      # Crop damage then Infrastructure damage in sorted order -- the same two
      # colours those types carry in the section 2 chart and on both maps.
      palette: ['#b62879', '#ff803e']
      plot_style: null
      layout_style:
        showlegend: true
        legend_title: Damage type
        xaxis: {title: Month}
        yaxis: {title: Damage events}
  - {name: Persist Damage Trend, id: dmg_trend_html, task: persist_text,
     partial: {root_path: "${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}", filename_suffix: damage_trend,
               text: "${{ workflow.dmg_trend.return }}"}}
  # skipif *never, like every other widget here, and it is NOT optional.
  #
  # Without it this inherits task-instance-defaults' [any_is_empty_df,
  # any_dependency_skipped], so on an empty period the widget itself skips and
  # returns a SkipSentinel -- which lands in gather_dashboard's widget list and
  # kills the whole run at response serialization:
  #     Unable to serialize unknown type: <class 'wt_task.skip.SkipSentinel'>
  # Forcing it to run gives a widget with null data, which is what a
  # placeholder is.
  - {name: Damage Trend Widget, id: dmg_trend_w, task: create_plot_widget_single_view,
     skipif: {conditions: *never},
     partial: {title: Crop and Infrastructure Damage over Time, view: null,
               data: "${{ workflow.dmg_trend_html.return }}"}}

  # 2 -- incidents per crop type. A BAR, not the table this used to be.
  - name: Crop Damage by Crop
    id: crop_by_crop
    task: apply_sql_query
    partial:
      query: |
        SELECT COALESCE(NULLIF(TRIM(REPLACE(REPLACE(REPLACE(REPLACE(
                 CAST(json_extract(event_details, '$."Type of crop"') AS TEXT),
                 '","', ', '), '["', ''), '"]', ''), '[]', '')), ''), 'Not recorded') AS "Crop",
               COUNT(*) AS "Incidents"
        FROM df WHERE is_conflict = 1 AND event_type = 'crop_damage'
        GROUP BY 1 ORDER BY 2 DESC
      columns: null
      sanitize: true
    mapvalues:
      argnames: df
      argvalues: ${{ workflow.events_grouped.return }}
  # Review feedback, section 9: "Bar graph - Crop damage incidents by crop:
  # missing legend. Please add."
  #
  # The `layout_kwargs: {barmode: stack}` that used to sit here did nothing at
  # all: LayoutStyle has no barmode field, and pydantic drops unknown keys
  # silently, so it never reached plotly. A single-series bar has nothing to
  # stack anyway -- what it was missing was the legend.
  - name: Draw Crop Bar
    id: crop_bar
    task: draw_bar_chart
    partial:
      category: Crop
      bar_chart_configs:
      - {label: Incidents, column: Incidents, agg_func: sum, show_label: true, style: {marker_color: '#b62879'}}
      layout_kwargs:
        showlegend: true
        legend_title: Measure
        xaxis: {title: Type of crop}
        yaxis: {title: Crop damage incidents}
    mapvalues:
      argnames: dataframe
      argvalues: ${{ workflow.crop_by_crop.return }}
  - {name: Persist Crop Bar, id: crop_bar_html, task: persist_text,
     partial: {root_path: "${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}", filename_suffix: crop_bar},
     mapvalues: {argnames: text, argvalues: "${{ workflow.crop_bar.return }}"}}
  - {name: Crop Bar Widget, id: crop_bar_w, task: create_plot_widget_single_view,
     skipif: {conditions: *never}, partial: {title: Crop Damage Incidents by Crop},
     map: {argnames: [view, data], argvalues: "${{ workflow.crop_bar_html.return }}"}}
  - {name: Merge Crop Bar Views, id: crop_bar_wm, task: merge_widget_views,
     partial: {widgets: "${{ workflow.crop_bar_w.return }}"}}

  # 3 -- extent of CROP damage, stacked by damage type.
  #
  # THE BUG THE REVIEW FOUND: "This seems like it's pulling the wrong data. It
  # should just be the crop acre-bands but it also has the infrastructure
  # damage extents (which belongs in the property-type chart)."
  #
  # Correct. The WHERE read `event_type IN ('crop_damage',
  # 'infrastructure_damage')` while "Extent of damage" means different things
  # on the two forms -- acre bands (<1 / 1-5 / 5-10 / >10 acres) on Crop
  # damage, severity (Low / Medium / High) on Infrastructure damage. Both
  # vocabularies landed on one axis. Now restricted to crop_damage, which is
  # the only form the MRD's acre bands come from, and the severity bands show
  # only in output 5 below.
  #
  # The acre bands are an ORDERED scale, so the x axis is scaffolded to all
  # four in order rather than left to whatever the period contains -- a chart
  # that jumps from "<1 acre" to ">10 acres" misreads badly.
  #
  # The damage type comes from "Cause of Damage - Wildlife" (uprooting /
  # trampling / feeding-raiding), which is empty on every live record (0 of 9
  # crop_damage events on 9 Nov 2026), so today this renders as a placeholder.
  # LIKE, not =, because the field is a multi-select and a record can name more
  # than one cause.
  - name: Crop Damage Extent by Cause
    id: dmg_extent
    task: apply_sql_query
    partial:
      query: |
        SELECT e.label AS "Extent",
               c."Damage type" AS "Damage type",
               COALESCE(SUM(CASE WHEN d.ext IS NULL THEN 0
                 WHEN c."Damage type" = 'Uprooting'        AND LOWER(d.cause_txt) LIKE '%uproot%' THEN 1
                 WHEN c."Damage type" = 'Trampling'        AND LOWER(d.cause_txt) LIKE '%trampl%' THEN 1
                 WHEN c."Damage type" = 'Feeding / raiding'
                      AND (LOWER(d.cause_txt) LIKE '%feed%' OR LOWER(d.cause_txt) LIKE '%raid%')  THEN 1
                 WHEN c."Damage type" = 'Not recorded'
                      AND (d.cause_txt IS NULL OR d.cause_txt = '')                               THEN 1
                 ELSE 0 END), 0) AS "Incidents"
        FROM (
                    SELECT '<1 acre' AS ext, '1. <1 acre' AS label
          UNION ALL SELECT '1-5 acres', '2. 1-5 acres'
          UNION ALL SELECT '5-10 acres', '3. 5-10 acres'
          UNION ALL SELECT '>10 acres', '4. >10 acres'
          UNION ALL SELECT 'Not recorded', '5. Not recorded'
        ) e
        CROSS JOIN (
                    SELECT 'Feeding / raiding' AS "Damage type"
          UNION ALL SELECT 'Not recorded'
          UNION ALL SELECT 'Trampling'
          UNION ALL SELECT 'Uprooting'
        ) c
        LEFT JOIN (
          SELECT COALESCE(json_extract(event_details, '$."Extent of damage"'), 'Not recorded') AS ext,
                 NULLIF(TRIM(REPLACE(REPLACE(REPLACE(REPLACE(
                   CAST(json_extract(event_details, '$."Cause of Damage - Wildlife"') AS TEXT),
                   '","', ', '), '["', ''), '"]', ''), '[]', '')), '') AS cause_txt
          FROM df WHERE is_conflict = 1 AND event_type = 'crop_damage'
        ) d ON d.ext = e.ext
        GROUP BY 1, 2
        ORDER BY 1, 2
      columns: null
      sanitize: true
    mapvalues:
      argnames: df
      argvalues: ${{ workflow.events_grouped.return }}
  - name: Draw Damage Extent Bar
    id: dmg_extent_bar
    task: draw_chart
    partial:
      x_axis: Extent
      figures:
      - metric: {display_name: Incidents, aggregator: sum, column: Incidents, decimal_places: 0}
        chart_type: bar
      time_interval: null
      category: Damage type
      time_breakdown: null
      barmode: stack
      # Sorted: Feeding / raiding, Not recorded, Trampling, Uprooting.
      palette: ['#ff803e', '#8a8a8a', '#3089ff', '#3e35a3']
      plot_style: null
      layout_style:
        showlegend: true
        legend_title: Damage type
        xaxis: {title: Extent of damage}
        yaxis: {title: Crop damage incidents}
    mapvalues:
      argnames: dataframe
      argvalues: ${{ workflow.dmg_extent.return }}
  - {name: Persist Damage Extent Bar, id: dmg_extent_html, task: persist_text,
     partial: {root_path: "${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}", filename_suffix: damage_extent_bar},
     mapvalues: {argnames: text, argvalues: "${{ workflow.dmg_extent_bar.return }}"}}
  - {name: Damage Extent Bar Widget, id: dmg_extent_w, task: create_plot_widget_single_view,
     skipif: {conditions: *never}, partial: {title: Crop Damage Extent by Damage Type},
     map: {argnames: [view, data], argvalues: "${{ workflow.dmg_extent_html.return }}"}}
  - {name: Merge Damage Extent Bar Views, id: dmg_extent_wm, task: merge_widget_views,
     partial: {widgets: "${{ workflow.dmg_extent_w.return }}"}}

  # 3 -- incidents per tree type, stacked by number of trees.
  #
  # Both source fields -- "Type of tree crop" and "Extent of damage (no trees)"
  # -- are empty on every live crop_damage record. Same reasoning as above: the
  # MRD asks for it, so it is built and renders empty rather than being dropped.
  - name: Tree Crop Damage
    id: tree_by_type
    task: apply_sql_query
    partial:
      query: |
        SELECT COALESCE(NULLIF(TRIM(REPLACE(REPLACE(REPLACE(REPLACE(
                 CAST(json_extract(event_details, '$."Type of tree crop"') AS TEXT),
                 '","', ', '), '["', ''), '"]', ''), '[]', '')), ''), 'Not recorded') AS "Tree crop",
               COUNT(*) AS "Incidents",
               CAST(COALESCE(SUM(CAST(COALESCE(json_extract(event_details, '$."Extent of damage (no trees)"'), 0) AS REAL)), 0) AS INTEGER) AS "Trees damaged"
        FROM df WHERE is_conflict = 1 AND event_type = 'crop_damage'
          AND json_extract(event_details, '$."Type of tree crop"') IS NOT NULL
        GROUP BY 1 ORDER BY 3 DESC, 2 DESC
      columns: null
      sanitize: true
    mapvalues:
      argnames: df
      argvalues: ${{ workflow.events_grouped.return }}
  - name: Draw Tree Crop Bar
    id: tree_bar
    task: draw_bar_chart
    partial:
      category: Tree crop
      bar_chart_configs:
      - {label: Incidents,     column: Incidents,     agg_func: sum, show_label: true, style: {marker_color: '#004e26'}}
      - {label: Trees damaged, column: Trees damaged, agg_func: sum, show_label: true, style: {marker_color: '#7ab800'}}
      # Grouped, not stacked, and deliberately so: incidents and trees damaged
      # are different units, and stacking them would draw a total that means
      # nothing. The dead `barmode: stack` that used to sit here never took
      # effect anyway.
      layout_kwargs:
        showlegend: true
        legend_title: Measure
        xaxis: {title: Type of tree crop}
        yaxis: {title: Count}
    mapvalues:
      argnames: dataframe
      argvalues: ${{ workflow.tree_by_type.return }}
  - {name: Persist Tree Crop Bar, id: tree_bar_html, task: persist_text,
     partial: {root_path: "${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}", filename_suffix: tree_crop_bar},
     mapvalues: {argnames: text, argvalues: "${{ workflow.tree_bar.return }}"}}
  - {name: Tree Crop Bar Widget, id: tree_bar_w, task: create_plot_widget_single_view,
     skipif: {conditions: *never}, partial: {title: Tree Crop Damage by Tree Type},
     map: {argnames: [view, data], argvalues: "${{ workflow.tree_bar_html.return }}"}}
  - {name: Merge Tree Crop Bar Views, id: tree_bar_wm, task: merge_widget_views,
     partial: {widgets: "${{ workflow.tree_bar_w.return }}"}}

  # 4 -- property damage by property type, stacked by extent band.
  #
  # ONE ROW PER COMBINATION, not per property -- a known limitation. Type of
  # Property is a multi-select and 4 of the 6 live records name more than one
  # thing, so "Water Pipes, Water Tank" is its own category and a reader cannot
  # total water tanks alone. json_each would fix it and apply_sql_query's own
  # source lists it as readable, but opening the virtual table trips
  # SQLITE_UPDATE on sqlite_master, which the deny-by-default authorizer
  # rejects: "vtable constructor failed: json_each". A recursive CTE is the
  # other route and validate_sql_query refuses anything not starting with
  # SELECT. The report states the limitation rather than letting a reader
  # assume otherwise.
  - name: Infrastructure Damage by Property
    id: infra_by_type
    task: apply_sql_query
    partial:
      query: |
        SELECT p."Property" AS "Property",
               x.label AS "Extent",
               COALESCE(SUM(CASE WHEN d.prop IS NULL THEN 0
                                 WHEN d.ext = x.ext THEN 1 ELSE 0 END), 0) AS "Incidents"
        FROM (
          SELECT COALESCE(NULLIF(TRIM(REPLACE(REPLACE(REPLACE(REPLACE(
                   CAST(json_extract(event_details, '$."Type of Property"') AS TEXT),
                   '","', ', '), '["', ''), '"]', ''), '[]', '')), ''), 'Not recorded') AS "Property",
                 COUNT(*) AS total
          FROM df WHERE is_conflict = 1 AND event_type = 'infrastructure_damage'
          GROUP BY 1
        ) p
        CROSS JOIN (
                    SELECT 'Low' AS ext, '1. Low' AS label
          UNION ALL SELECT 'Medium', '2. Medium'
          UNION ALL SELECT 'High', '3. High'
          UNION ALL SELECT 'Not recorded', '4. Not recorded'
        ) x
        LEFT JOIN (
          SELECT COALESCE(NULLIF(TRIM(REPLACE(REPLACE(REPLACE(REPLACE(
                   CAST(json_extract(event_details, '$."Type of Property"') AS TEXT),
                   '","', ', '), '["', ''), '"]', ''), '[]', '')), ''), 'Not recorded') AS prop,
                 COALESCE(json_extract(event_details, '$."Extent of damage"'), 'Not recorded') AS ext
          FROM df WHERE is_conflict = 1 AND event_type = 'infrastructure_damage'
        ) d ON d.prop = p."Property"
        GROUP BY 1, 2
        ORDER BY p.total DESC, 1, 2
      columns: null
      sanitize: true
    mapvalues:
      argnames: df
      argvalues: ${{ workflow.events_grouped.return }}
  # STACKED, and retitled. Review feedback, section 9: "Bar graph -
  # Infrastructure damage by property type: make this stacked please. Change
  # chart caption to say 'Infrastructure damage by property type and damage
  # extent'."
  #
  # Low / Medium / High is an ordered severity scale, so the series labels
  # carry a sort prefix: draw_chart orders its series with sorted(), which
  # would otherwise stack High, Low, Medium alphabetically and make the
  # gradient meaningless.
  - name: Draw Infrastructure Damage Bar
    id: infra_bar
    task: draw_chart
    partial:
      x_axis: Property
      figures:
      - metric: {display_name: Incidents, aggregator: sum, column: Incidents, decimal_places: 0}
        chart_type: bar
      time_interval: null
      category: Extent
      time_breakdown: null
      barmode: stack
      palette: ['#ffc14d', '#ff803e', '#8c1700', '#8a8a8a']
      plot_style: null
      layout_style:
        showlegend: true
        legend_title: Extent of damage
        xaxis: {title: Type of property}
        yaxis: {title: Infrastructure damage incidents}
    mapvalues:
      argnames: dataframe
      argvalues: ${{ workflow.infra_by_type.return }}
  - {name: Persist Infrastructure Damage Bar, id: infra_bar_html, task: persist_text,
     partial: {root_path: "${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}", filename_suffix: infrastructure_bar},
     mapvalues: {argnames: text, argvalues: "${{ workflow.infra_bar.return }}"}}
  - {name: Infrastructure Damage Bar Widget, id: infra_bar_w, task: create_plot_widget_single_view,
     skipif: {conditions: *never},
     partial: {title: "Infrastructure Damage by Property Type and Damage Extent"},
     map: {argnames: [view, data], argvalues: "${{ workflow.infra_bar_html.return }}"}}
  - {name: Merge Infrastructure Damage Bar Views, id: infra_bar_wm, task: merge_widget_views,
     partial: {widgets: "${{ workflow.infra_bar_w.return }}"}}

  # 6 and 7 -- one map each, as the MRD asks, rather than the single combined
  # map this used to be.
  - name: Crop Damage Points
    id: crop_points
    task: apply_sql_query
    partial:
      query: |
        SELECT geometry, species_h AS "Species responsible",
               COALESCE(json_extract(event_details, '$."Extent of damage"'), '-') AS "Extent",
               COALESCE(NULLIF(TRIM(REPLACE(REPLACE(REPLACE(REPLACE(
                 CAST(json_extract(event_details, '$."Type of crop"') AS TEXT),
                 '","', ', '), '["', ''), '"]', ''), '[]', '')), ''), 'Not recorded') AS "Crop",
               substr(report_time, 1, 16) AS "Date"
        FROM df
        WHERE is_conflict = 1 AND event_type = 'crop_damage' AND geometry IS NOT NULL
      columns: null
      sanitize: true
    mapvalues:
      argnames: df
      argvalues: ${{ workflow.events_grouped.return }}
  - name: Crop Damage Layer
    id: crop_layer
    task: create_point_layer
    skipif:
      conditions: *geo
    partial:
      layer_style:
        get_radius: 7.0
        radius_units: pixels
        get_fill_color: '#b62879'
        get_line_color: '#ffffff'
        stroked: true
        get_line_width: 1
        opacity: 0.85
      legend: null
      tooltip_columns: [Crop, Species responsible, Extent, Date]
    mapvalues:
      argnames: geodataframe
      argvalues: ${{ workflow.crop_points.return }}
  - name: Draw Crop Damage Map
    id: crop_map
    task: draw_ecomap
    partial:
      tile_layers: ${{ workflow.base_map_defs.return }}
      static: false
      title: null
      north_arrow_style: {placement: top-left}
      legend_style: {placement: bottom-right}
      # Review feedback: "Check zoom. Make sure it's not rendering grey tiles."
      # At 20 the auto-fitted view state zooms past the level the ArcGIS
      # basemaps actually serve tiles for over rural Laikipia, and a map with
      # one or two points -- which several of these are -- fits to exactly
      # that. 15 is inside tile coverage everywhere and still shows
      # individual bomas.
      max_zoom: 15
    mapvalues:
      argnames: geo_layers
      argvalues: ${{ workflow.crop_layer.return }}
  - {name: Persist Crop Damage Map, id: crop_map_html, task: persist_text,
     partial: {root_path: "${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}", filename_suffix: crop_damage_map},
     mapvalues: {argnames: text, argvalues: "${{ workflow.crop_map.return }}"}}
  - {name: Crop Damage Map Widget, id: crop_map_w, task: create_map_widget_single_view,
     skipif: {conditions: *never}, partial: {title: Crop Damage Locations},
     map: {argnames: [view, data], argvalues: "${{ workflow.crop_map_html.return }}"}}
  - {name: Merge Crop Damage Map Views, id: crop_map_wm, task: merge_widget_views,
     partial: {widgets: "${{ workflow.crop_map_w.return }}"}}

  - name: Infrastructure Damage Points
    id: infra_points
    task: apply_sql_query
    partial:
      query: |
        SELECT geometry, species_h AS "Species responsible",
               COALESCE(json_extract(event_details, '$."Extent of damage"'), '-') AS "Extent",
               COALESCE(NULLIF(TRIM(REPLACE(REPLACE(REPLACE(REPLACE(
                 CAST(json_extract(event_details, '$."Type of Property"') AS TEXT),
                 '","', ', '), '["', ''), '"]', ''), '[]', '')), ''), 'Not recorded') AS "Property",
               substr(report_time, 1, 16) AS "Date"
        FROM df
        WHERE is_conflict = 1 AND event_type = 'infrastructure_damage' AND geometry IS NOT NULL
      columns: null
      sanitize: true
    mapvalues:
      argnames: df
      argvalues: ${{ workflow.events_grouped.return }}
  - name: Infrastructure Damage Layer
    id: infra_layer
    task: create_point_layer
    skipif:
      conditions: *geo
    partial:
      layer_style:
        get_radius: 7.0
        radius_units: pixels
        get_fill_color: '#ff803e'
        get_line_color: '#ffffff'
        stroked: true
        get_line_width: 1
        opacity: 0.85
      legend: null
      tooltip_columns: [Property, Species responsible, Extent, Date]
    mapvalues:
      argnames: geodataframe
      argvalues: ${{ workflow.infra_points.return }}
  - name: Draw Infrastructure Damage Map
    id: infra_map
    task: draw_ecomap
    partial:
      tile_layers: ${{ workflow.base_map_defs.return }}
      static: false
      title: null
      north_arrow_style: {placement: top-left}
      legend_style: {placement: bottom-right}
      # Review feedback: "Check zoom. Make sure it's not rendering grey tiles."
      # At 20 the auto-fitted view state zooms past the level the ArcGIS
      # basemaps actually serve tiles for over rural Laikipia, and a map with
      # one or two points -- which several of these are -- fits to exactly
      # that. 15 is inside tile coverage everywhere and still shows
      # individual bomas.
      max_zoom: 15
    mapvalues:
      argnames: geo_layers
      argvalues: ${{ workflow.infra_layer.return }}
  - {name: Persist Infrastructure Damage Map, id: infra_map_html, task: persist_text,
     partial: {root_path: "${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}", filename_suffix: infrastructure_map},
     mapvalues: {argnames: text, argvalues: "${{ workflow.infra_map.return }}"}}
  - {name: Infrastructure Damage Map Widget, id: infra_map_w, task: create_map_widget_single_view,
     skipif: {conditions: *never}, partial: {title: Infrastructure Damage Locations},
     map: {argnames: [view, data], argvalues: "${{ workflow.infra_map_html.return }}"}}
  - {name: Merge Infrastructure Damage Map Views, id: infra_map_wm, task: merge_widget_views,
     partial: {widgets: "${{ workflow.infra_map_w.return }}"}}
- title: Retaliation
  type: task-group
  description: Threatened against carried out, and the evidence behind it.
  tasks:
  # These are fields inside the conditional conflict section of Human Injury,
  # Human Death and HWC Livestock Predation -- not a separate event type.
  # Booleans arrive as 1/true/True/Yes depending on how the record was
  # written, so all four are matched.
  - name: Retaliation Figures
    id: ret_kpis
    task: apply_sql_query
    partial:
      query: |
        SELECT
          COALESCE(SUM(ret_taken), 0)      AS "Retaliation taken",
          COALESCE(SUM(ret_threatened), 0) AS "Retaliation threatened"
        FROM df WHERE is_conflict = 1
      columns: null
      sanitize: true
    mapvalues:
      argnames: df
      argvalues: ${{ workflow.events_grouped.return }}
  - {name: Retaliation Taken Value, id: ret_kpi_0_val, task: dataframe_column_sum,
     partial: {column_name: Retaliation taken},
     mapvalues: {argnames: df, argvalues: "${{ workflow.ret_kpis.return }}"}}
  - {name: Retaliation Taken Widget, id: ret_kpi_0_sv, task: create_single_value_widget_single_view,
     skipif: {conditions: *never}, partial: {title: Retaliation Carried Out, decimal_places: 0},
     map: {argnames: [view, data], argvalues: "${{ workflow.ret_kpi_0_val.return }}"}}
  - {name: Merge Retaliation Taken Views, id: ret_kpi_0_svw, task: merge_widget_views,
     partial: {widgets: "${{ workflow.ret_kpi_0_sv.return }}"}}

  - {name: Retaliation Threatened Value, id: ret_kpi_1_val, task: dataframe_column_sum,
     partial: {column_name: Retaliation threatened},
     mapvalues: {argnames: df, argvalues: "${{ workflow.ret_kpis.return }}"}}
  - {name: Retaliation Threatened Widget, id: ret_kpi_1_sv, task: create_single_value_widget_single_view,
     skipif: {conditions: *never}, partial: {title: Retaliation Threatened, decimal_places: 0},
     map: {argnames: [view, data], argvalues: "${{ workflow.ret_kpi_1_val.return }}"}}
  - {name: Merge Retaliation Threatened Views, id: ret_kpi_1_svw, task: merge_widget_views,
     partial: {widgets: "${{ workflow.ret_kpi_1_sv.return }}"}}

  - name: Retaliation by Species
    id: ret_by_species
    task: apply_sql_query
    partial:
      query: |
        SELECT species_h AS "Species responsible",
               SUM(ret_taken)      AS "Carried out",
               SUM(ret_threatened) AS "Threatened"
        FROM df WHERE is_conflict = 1
        GROUP BY 1 HAVING "Carried out" > 0 OR "Threatened" > 0
        ORDER BY 2 DESC, 3 DESC
      columns: null
      sanitize: true
    mapvalues:
      argnames: df
      argvalues: ${{ workflow.events_grouped.return }}
  - name: Draw Retaliation Bar
    id: ret_bar
    task: draw_bar_chart
    partial:
      category: Species responsible
      bar_chart_configs:
      - {label: Carried out, column: Carried out, agg_func: sum, show_label: true, style: {marker_color: '#8c1700'}}
      - {label: Threatened,  column: Threatened,  agg_func: sum, show_label: true, style: {marker_color: '#f23b0e'}}
      # Grouped, not stacked: an incident can be both threatened and carried
      # out, so the two series overlap and a stacked total would double-count.
      #
      # Review question: "I am assuming the stacked bar chart by species
      # responsible only shows if there are data to populate it?" Yes. The
      # HAVING clause above drops every species with no retaliation at all, so
      # with nothing recorded the frame is empty and the widget renders as a
      # placeholder rather than an axis full of zeros. The widget itself always
      # exists, which is what keeps the dashboard layout stable.
      layout_kwargs:
        showlegend: true
        legend_title: Retaliation
        xaxis: {title: Species responsible}
        yaxis: {title: Conflict events}
    mapvalues:
      argnames: dataframe
      argvalues: ${{ workflow.ret_by_species.return }}
  - {name: Persist Retaliation Bar, id: ret_bar_html, task: persist_text,
     partial: {root_path: "${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}", filename_suffix: retaliation_bar},
     mapvalues: {argnames: text, argvalues: "${{ workflow.ret_bar.return }}"}}
  - {name: Retaliation Bar Widget, id: ret_bar_w, task: create_plot_widget_single_view,
     skipif: {conditions: *never}, partial: {title: Retaliation by Species Responsible},
     map: {argnames: [view, data], argvalues: "${{ workflow.ret_bar_html.return }}"}}
  - {name: Merge Retaliation Bar Views, id: ret_bar_wm, task: merge_widget_views,
     partial: {widgets: "${{ workflow.ret_bar_w.return }}"}}
- title: Incident Storyboard
  type: task-group
  description: How the events of each incident unfolded, in order.
  tasks:
  # MRD section 4: "Plot to show timeline of how events unfolded and time
  # between them". Review feedback: "Could we replace this with the incident
  # storyboard output that Zak has developed? I think this will work better for
  # the purpose of the output to show how events unfolded."
  #
  # This replaces a line chart of days-since-previous-incident. That chart
  # answered "how often", which is the seasonality question, not "how an
  # incident unfolded" -- the review is right that the storyboard is the better
  # fit.
  #
  # IT IS WIRED EXACTLY AS incidents_reports WIRES IT: get_incident_events ->
  # convert_values_to_timezone -> assign_event_type_colors ->
  # format_incident_storyboards. Deliberately NOT fed from this workflow's own
  # events frame: format_incident_storyboards expects the frame
  # get_incident_events produces, and guessing at its columns would be a slower
  # way to get it wrong.
  #
  # IT DOES NOT WORK ON WINDOWS ONCE IT HAS DATA. format_incident_storyboards
  # formats its tile dates with '%-d', a glibc strftime extension for an
  # unpadded day that the Windows C runtime rejects, so with a non-empty frame
  # the task raises
  #     ValueError('Invalid format string')
  # and takes the WHOLE RUN with it -- no dashboard, no Word report. The task
  # returns early on an empty frame, so the failure only appears at a site that
  # actually links events into incidents. Reported upstream against ext-wd
  # 0.0.14; see .scratch/UPSTREAM-ext-wd-windows.md. If that matters before a
  # fix lands, delete this task-group and the ext-wd requirement -- they are a
  # separate commit for exactly this reason.
  #
  # THIS SECTION IS EMPTY UNTIL EVENTS ARE LINKED INTO INCIDENT COLLECTIONS.
  # get_incident_events reads collections, and on 10 Nov 2026 all 4,115
  # Naibunga events had an empty is_contained_in -- the same fact that makes
  # Table 1's incident count equal the event count. The storyboard populates
  # itself the day rangers or HQ start linking related reports; until then it
  # renders as a placeholder.
  #
  # Ungrouped: one view over the whole period, so a plain partial rather than
  # the mapvalues incidents_reports uses for its per-incident views.
  - name: Get Incident Events
    id: inc_events
    task: get_incident_events
    partial:
      client: ${{ workflow.er_client_name.return }}
      time_range: ${{ workflow.time_range.return }}
      max_depth: 5
  - name: Convert Incident Events to Timezone
    id: inc_events_tz
    task: convert_values_to_timezone
    partial:
      df: ${{ workflow.inc_events.return }}
      timezone: ${{ workflow.get_timezone.return }}
      columns:
      - time
      auto_detect: false
  # Colours assigned before rendering so an event type keeps one colour across
  # the storyboard, matching how incidents_reports does it.
  - name: Colour Incident Events
    id: inc_events_colored
    task: assign_event_type_colors
    partial:
      df: ${{ workflow.inc_events_tz.return }}
  - name: Format Incident Storyboards
    id: storyboards
    task: format_incident_storyboards
    partial:
      df: ${{ workflow.inc_events_colored.return }}
  - {name: Persist Incident Storyboards, id: storyboards_html, task: persist_text,
     partial: {text: "${{ workflow.storyboards.return }}",
               root_path: "${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}", filename_suffix: incident_storyboards}}
  - {name: Incident Storyboards Widget, id: storyboards_w, task: create_plot_widget_single_view,
     skipif: {conditions: *never},
     partial: {title: "Incident Storyboards", data: "${{ workflow.storyboards_html.return }}"}}

- name: Word Report
  id: create_report
  task: ecoscope_workflows_ext_custom.tasks.results.create_docx
  skipif:
    conditions: *never
  partial:
    template_path: https://drive.google.com/uc?export=download&id=1lfvoVqrk7LGdTF8mDZc2KPsQryyfpdk5   # pinned: not shown in the run form
    context:
      items:
      # STRICTLY the MRD's report sections, in the MRD's order. Every figure is
      # whole-period: with the AllGrouper there is one view, so each image key
      # receives a single path rather than one path per month.
      # --- Header & period
      # Review feedback: "For the time period of the report, could this be the
      # actual time period inputted by the user on the config? I.e. 01 Jan - 11
      # Nov. It currently shows Jan-November which is misleading given that we
      # are only 11 days into the month." '%B %Y' rendered the month names of
      # the two bounds and lost the days entirely; '%d %b %Y' prints the exact
      # configured dates, and matches the time_format already set on
      # set_time_range.
      - {item_type: timerange, key: report_date, value: "${{ workflow.time_range.return }}", format: '%d %b %Y'}
      - {item_type: text, key: prepared_by, value: "${{ workflow.prepared_by.return }}"}
      # --- 1 Summary: Table 1, whole period. Table 2 (month by month) dropped
      #     on review -- the seasonality chart below covers the temporal read.
      - {item_type: table, key: period_kpis, value: "${{ workflow.period_kpis.return }}"}
      # --- 2 Conflict type: pie, seasonality, map per incident, map per event
      - {item_type: image, key: ctype_bar, value: "${{ workflow.ctype_bar_html.return }}", width_inches: 6.0,
         screenshot_config: {wait_for_timeout: 0, max_concurrent_pages: 2, device_scale_factor: 1.0, timeout: 120000}}
      - {item_type: image, key: conflict_trend, value: "${{ workflow.trend_html.return }}", width_inches: 6.0,
         screenshot_config: {wait_for_timeout: 0, max_concurrent_pages: 2, device_scale_factor: 1.0, timeout: 120000}}
      - {item_type: image, key: incident_map, value: "${{ workflow.inc_map_html.return }}", width_inches: 6.0,
         screenshot_config: {wait_for_timeout: 10000, max_concurrent_pages: 2, device_scale_factor: 1.0, timeout: 120000}}
      - {item_type: image, key: event_map, value: "${{ workflow.evt_map_html.return }}", width_inches: 6.0,
         screenshot_config: {wait_for_timeout: 10000, max_concurrent_pages: 2, device_scale_factor: 1.0, timeout: 120000}}
      # --- 3 Species responsible
      - {item_type: image, key: species_bar, value: "${{ workflow.species_bar_html.return }}", width_inches: 6.0,
         screenshot_config: {wait_for_timeout: 0, max_concurrent_pages: 2, device_scale_factor: 1.0, timeout: 120000}}
      # --- 4 Incident storyboard
      - {item_type: image, key: storyboards, value: "${{ workflow.storyboards_html.return }}", width_inches: 6.0,
         screenshot_config: {wait_for_timeout: 0, max_concurrent_pages: 2, device_scale_factor: 1.0, timeout: 120000}}
      # --- 5 dropped on review; the seasonality chart moved up into section 2
      # --- 6 Human injury / death
      - {item_type: image, key: casualties_bar, value: "${{ workflow.cas_bar_html.return }}", width_inches: 6.0,
         screenshot_config: {wait_for_timeout: 0, max_concurrent_pages: 2, device_scale_factor: 1.0, timeout: 120000}}
      - {item_type: table, key: cas_table, value: "${{ workflow.cas_table.return }}", merge_groups: true}
      # --- 7 Wildlife injury / death
      - {item_type: image, key: wildlife_bar, value: "${{ workflow.wl_bar_html.return }}", width_inches: 6.0,
         screenshot_config: {wait_for_timeout: 0, max_concurrent_pages: 2, device_scale_factor: 1.0, timeout: 120000}}
      - {item_type: image, key: wildlife_cause_bar, value: "${{ workflow.wl_cause_html.return }}", width_inches: 6.0,
         screenshot_config: {wait_for_timeout: 0, max_concurrent_pages: 2, device_scale_factor: 1.0, timeout: 120000}}
      - {item_type: image, key: wildlife_map, value: "${{ workflow.wl_map_html.return }}", width_inches: 6.0,
         screenshot_config: {wait_for_timeout: 10000, max_concurrent_pages: 2, device_scale_factor: 1.0, timeout: 120000}}
      # --- 8 Livestock predation
      - {item_type: image, key: predation_bar, value: "${{ workflow.pred_bar_html.return }}", width_inches: 6.0,
         screenshot_config: {wait_for_timeout: 0, max_concurrent_pages: 2, device_scale_factor: 1.0, timeout: 120000}}
      - {item_type: image, key: predator_bar, value: "${{ workflow.pred_pred_html.return }}", width_inches: 6.0,
         screenshot_config: {wait_for_timeout: 0, max_concurrent_pages: 2, device_scale_factor: 1.0, timeout: 120000}}
      - {item_type: image, key: predation_map, value: "${{ workflow.pred_map_html.return }}", width_inches: 6.0,
         screenshot_config: {wait_for_timeout: 10000, max_concurrent_pages: 2, device_scale_factor: 1.0, timeout: 120000}}
      - {item_type: image, key: boma_pie, value: "${{ workflow.pred_where_html.return }}", width_inches: 6.0,
         screenshot_config: {wait_for_timeout: 0, max_concurrent_pages: 2, device_scale_factor: 1.0, timeout: 120000}}
      # --- 9 Crop / infrastructure damage, the MRD's seven outputs in the
      #     order the review set: damage over time first.
      - {item_type: image, key: damage_trend, value: "${{ workflow.dmg_trend_html.return }}", width_inches: 6.0,
         screenshot_config: {wait_for_timeout: 0, max_concurrent_pages: 2, device_scale_factor: 1.0, timeout: 120000}}
