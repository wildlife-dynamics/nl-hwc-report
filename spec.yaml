  - {name: Merge Wildlife Injured Views, id: hwc_kpi_5_svw, task: merge_widget_views,
     partial: {widgets: "${{ workflow.hwc_kpi_5_sv.return }}"}}

  # The MRD's summary lists "Livestock injured / killed" as a pair. Only killed
  # was built, so injured animals never reached the headline at all.
  - {name: Livestock Injured Value, id: hwc_kpi_8_val, task: dataframe_column_sum,
     partial: {column_name: Livestock injured},
     mapvalues: {argnames: df, argvalues: "${{ workflow.hwc_kpis.return }}"}}
  - {name: Livestock Injured Widget, id: hwc_kpi_8_sv, task: create_single_value_widget_single_view,
     skipif: {conditions: *never},
     partial: {title: Livestock Injured, decimal_places: 0},
     map: {argnames: [view, data], argvalues: "${{ workflow.hwc_kpi_8_val.return }}"}}
  - {name: Merge Livestock Injured Views, id: hwc_kpi_8_svw, task: merge_widget_views,
     partial: {widgets: "${{ workflow.hwc_kpi_8_sv.return }}"}}

  # Naibunga has NO poisoning records as of 8 Nov 2026. This card exists so
  # the slot holds and reads 0 rather than vanishing from the layout.
  - {name: Poisoning Events Value, id: hwc_kpi_6_val, task: dataframe_column_sum,
     partial: {column_name: Poisoning events},
     mapvalues: {argnames: df, argvalues: "${{ workflow.hwc_kpis.return }}"}}
  - {name: Poisoning Events Widget, id: hwc_kpi_6_sv, task: create_single_value_widget_single_view,
     skipif: {conditions: *never},
     partial: {title: Poisoning Events, decimal_places: 0},
     map: {argnames: [view, data], argvalues: "${{ workflow.hwc_kpi_6_val.return }}"}}
  - {name: Merge Poisoning Events Views, id: hwc_kpi_6_svw, task: merge_widget_views,
     partial: {widgets: "${{ workflow.hwc_kpi_6_sv.return }}"}}

  - {name: Retaliation Recorded Value, id: hwc_kpi_7_val, task: dataframe_column_sum,
     partial: {column_name: Retaliation recorded},
     mapvalues: {argnames: df, argvalues: "${{ workflow.hwc_kpis.return }}"}}
  - {name: Retaliation Recorded Widget, id: hwc_kpi_7_sv, task: create_single_value_widget_single_view,
     skipif: {conditions: *never},
     partial: {title: Retaliation Recorded, decimal_places: 0},
     map: {argnames: [view, data], argvalues: "${{ workflow.hwc_kpi_7_val.return }}"}}
  - {name: Merge Retaliation Events Views, id: hwc_kpi_7_svw, task: merge_widget_views,
     partial: {widgets: "${{ workflow.hwc_kpi_7_sv.return }}"}}

  # TABLE 2 (headline figures month by month) WAS HERE AND IS GONE.
  #
  # Review feedback: "I think we can drop this. Stacked bar chart for conflict
  # type covers the temporal trend." The month-by-month read now lives entirely
  # in the stacked seasonality chart, which moved into section 2.
  #
  # TABLE 1 -- the headline figures for the whole period.
  - name: Whole-Period Headline
    id: period_kpis
    task: apply_sql_query
    partial:
      df: ${{ workflow.events_indexed.return }}
      query: |
        SELECT
          -- INCIDENTS, not events. conflict_seq = 1 marks the first qualifying
          -- event of each incident, so this counts collections-with-a-
          -- qualifying-child plus uncollected qualifying events, exactly as the
          -- MRD defines it. Every other figure below deliberately stays at
          -- EVENT or victim level: "Loss totals are unaffected -- people
          -- injured, livestock killed etc. still sum over events/victims, so
          -- Table 1 would show 23 incidents but still 3 people injured."
          COALESCE(SUM(CASE WHEN is_conflict = 1 AND conflict_seq = 1 THEN 1 ELSE 0 END), 0) AS "Total incidents",
          COALESCE(SUM(CASE WHEN is_conflict = 1 AND event_type = 'human_injury' THEN 1 ELSE 0 END), 0) AS "People injured",
          COALESCE(SUM(CASE WHEN is_conflict = 1 AND event_type = 'human_death' THEN 1 ELSE 0 END), 0) AS "People killed",
          CAST(COALESCE(SUM(CASE WHEN event_type = 'hwc_livestock_predation'
                       THEN CAST(COALESCE(json_extract(event_details, '$."Total livestock dead"'), 0) AS REAL) ELSE 0 END), 0) AS INTEGER) AS "Livestock killed",
          CAST(COALESCE(SUM(CASE WHEN event_type = 'hwc_livestock_predation'
                       THEN CAST(COALESCE(json_extract(event_details, '$."Total livestock injured"'), 0) AS REAL) ELSE 0 END), 0) AS INTEGER) AS "Livestock injured",
          COALESCE(SUM(CASE WHEN is_conflict = 1 AND event_type = 'animal_carcass' THEN 1 ELSE 0 END), 0) AS "Wildlife killed",
          COALESCE(SUM(CASE WHEN is_conflict = 1 AND event_type = 'sick_injured_animal' THEN 1 ELSE 0 END), 0) AS "Wildlife injured",
          COALESCE(SUM(CASE WHEN event_type = 'poisoning' THEN 1 ELSE 0 END), 0) AS "Poisoning events",
          COALESCE(SUM(ret_taken), 0) AS "Retaliation recorded"
        FROM df
      columns: null
      sanitize: true
  # period_ctype and period_species were here. Both computed whole-period
  # versions of charts that the Word report never read -- they were written for
  # docx tables that the MRD pass replaced with figures, and nothing has
  # referenced them since. Removed rather than left running.

- title: Conflict Type
  type: task-group
  description: How the incidents break down by kind of conflict, when, and where.
  tasks:
  # ONE COLOUR PER CONFLICT TYPE, EVERYWHERE.
  #
  # Review feedback: "Can we make colours consistent across the outputs? E.g.
  # conflict event type colour for any charts or map points". Two mechanisms,
  # because the tasks take colour differently:
  #
  #   maps and pies -- apply_color_map accepts a {value: hex} DICT, so the
  #     colour is matched to the label by name and is correct whatever subset
  #     of types the period happens to contain. `ctype_colors` below is the
  #     single source of truth, reused by anchor.
  #
  #   stacked bars -- draw_chart's `palette` is a LIST, cycled over the series
  #     in sorted order, with no way to key it by label. So any chart that
  #     stacks by conflict type pads its frame with a zero row for every type
  #     (the CROSS JOIN scaffolds below). The series set is then always the
  #     same eight, in the same sorted order, and `ctype_palette` lines up with
  #     it. Without the padding, a period missing one type would shift every
  #     colour after it.
  #
  # The eight labels are exactly the CASE arms of `conflict_type` in
  # events_prepared, and `is_conflict = 1` is only ever set for those eight
  # event types, so the ELSE branch cannot reach a chart or a map.
  - name: Conflict Type Counts
    id: ctype_counts
    task: apply_sql_query
    partial:
      query: |
        SELECT conflict_type AS "Conflict type", COUNT(*) AS "Events"
        FROM df WHERE is_conflict = 1
        GROUP BY 1 ORDER BY 2 DESC
      columns: null
      sanitize: true
    mapvalues:
      argnames: df
      argvalues: ${{ workflow.events_grouped.return }}
  - name: Conflict Type Colormap
    id: ctype_cmap
    task: apply_color_map
    partial:
      input_column_name: Conflict type
      colormap: &ctype_colors
        Crop damage: '#b62879'
        Human death: '#8c1700'
        Human injury: '#ed3ea2'
        Infrastructure damage: '#ff803e'
        Livestock predation: '#3e35a3'
        Poisoning: '#a100cb'
        Wildlife death: '#004e26'
        Wildlife injury: '#7ab800'
      output_column_name: ctype_color
    mapvalues:
      argnames: df
      argvalues: ${{ workflow.ctype_counts.return }}
  # A PIE, not the bar this was. Review feedback: "Can we swap this to a pie
  # chart please? Change the caption to 'Conflict events by type'."
  #
  # `color_column` is what makes the slice colours match the map points: it
  # reads the hex straight off the row that apply_color_map wrote.
  - name: Draw Conflict Type Pie
    id: ctype_pie
    task: draw_pie_chart
    partial:
      value_column: Events
      label_column: Conflict type
      color_column: ctype_color
      plot_style: {textinfo: value+percent}
      layout_style: {showlegend: true, legend_title: Conflict type}
    mapvalues:
      argnames: dataframe
      argvalues: ${{ workflow.ctype_cmap.return }}
  - {name: Persist Conflict Type Pie, id: ctype_bar_html, task: persist_text,
     partial: {root_path: "${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}", filename_suffix: conflict_type_pie},
     mapvalues: {argnames: text, argvalues: "${{ workflow.ctype_pie.return }}"}}
  - {name: Conflict Type Pie Widget, id: ctype_bar_w, task: create_plot_widget_single_view,
     skipif: {conditions: *never}, partial: {title: Conflict Events by Type},
     map: {argnames: [view, data], argvalues: "${{ workflow.ctype_bar_html.return }}"}}
  - {name: Merge Conflict Type Pie Views, id: ctype_bar_wm, task: merge_widget_views,
     partial: {widgets: "${{ workflow.ctype_bar_w.return }}"}}

  # SEASONALITY, moved here from its own section.
  #
  # Review feedback: "Can we move the stacked bar chart from section 5 to here
  # with the caption?" and "Stacked bar time axis must include every month in
  # the period, including zero months (currently Jan is dropped)."
  #
  # Both the dropped months and the shifting colours are the same bug: the
  # chart only ever saw the (month, type) pairs that had rows. The frame below
  # is built the other way round -- every month CROSS JOINed with every
  # conflict type, counts LEFT JOINed on -- so a month with no conflict at all
  # still contributes a zero-height bar and holds its place on the axis.
  #
  # The month list spans MIN to MAX of incident_time over EVERY event in the
  # view (the whole range, or one year or month when a grouper is chosen), not
  # just the conflict ones, which is why a January with
  # patrol events but no conflict events still appears. It is a close proxy for
  # the configured range rather than the range itself: apply_sql_query sees
  # only the dataframe, and nothing carries since/until into SQL.
  #
  # `s` is a counter, and the only way to get one here: the validator requires
  # the query to start with SELECT, so WITH RECURSIVE is unavailable, and df is
  # the single readable table. It yields one integer per row of df, so the
  # month axis can span at most as many months as the period has events -- 11
  # months needs 11 events anywhere in the period, which no real report misses.
  - name: Conflict Trend Frame
    id: trend_df
    task: apply_sql_query
    partial:
      query: |
        SELECT mon."Month" AS "Month",
               typ."Conflict type" AS "Conflict type",
               COALESCE(cnt.n, 0) AS "Incidents"
        FROM (
          SELECT ym, substr('​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​', 1, n)
                 || CASE substr(ym, 6, 2) WHEN '01' THEN 'Jan' WHEN '02' THEN 'Feb' WHEN '03' THEN 'Mar'
                   WHEN '04' THEN 'Apr' WHEN '05' THEN 'May' WHEN '06' THEN 'Jun' WHEN '07' THEN 'Jul'
                   WHEN '08' THEN 'Aug' WHEN '09' THEN 'Sep' WHEN '10' THEN 'Oct' WHEN '11' THEN 'Nov'
                   ELSE 'Dec' END || ' ' || substr(ym, 1, 4) AS "Month"
          FROM (
          SELECT substr('000' || CAST((b.lo + s.n) / 12 AS TEXT), -4, 4) || '-' ||
                 substr('0' || CAST(((b.lo + s.n) % 12) + 1 AS TEXT), -2, 2) AS ym, s.n AS n
          FROM (
            SELECT MIN(CAST(substr(incident_time, 1, 4) AS INTEGER) * 12
                       + CAST(substr(incident_time, 6, 2) AS INTEGER) - 1) AS lo,
                   MAX(CAST(substr(incident_time, 1, 4) AS INTEGER) * 12
                       + CAST(substr(incident_time, 6, 2) AS INTEGER) - 1) AS hi
            FROM df WHERE incident_time IS NOT NULL
          ) b
          JOIN (SELECT ROW_NUMBER() OVER () - 1 AS n FROM df LIMIT 1200) s
            ON b.lo + s.n <= b.hi
          )
        ) mon
        CROSS JOIN (
                    SELECT 'Crop damage' AS "Conflict type"
          UNION ALL SELECT 'Human death'
          UNION ALL SELECT 'Human injury'
          UNION ALL SELECT 'Infrastructure damage'
          UNION ALL SELECT 'Livestock predation'
          UNION ALL SELECT 'Poisoning'
          UNION ALL SELECT 'Wildlife death'
          UNION ALL SELECT 'Wildlife injury'
        ) typ
        LEFT JOIN (
          SELECT substr(incident_time, 1, 7) AS mth,
                 conflict_type AS ct, COUNT(*) AS n
          FROM df WHERE is_conflict = 1 GROUP BY 1, 2
        ) cnt ON cnt.mth = mon.ym AND cnt.ct = typ."Conflict type"
        -- a view (year or month) with no conflict at all gives no rows, so
        -- the chart is skipped rather than drawn as a row of empty bars
        WHERE EXISTS (SELECT 1 FROM df WHERE is_conflict = 1)
        ORDER BY mon.ym, 2
      columns: null
      sanitize: true
    mapvalues:
      argnames: df
      argvalues: ${{ workflow.events_grouped.return }}
  # draw_chart, not draw_time_series_bar_chart or draw_bar_chart.
  #
  # draw_bar_chart cannot stack at all: it builds go.Figure(layout=LayoutStyle),
  # and LayoutStyle has no barmode field, so the `layout_kwargs: {barmode:
  # stack}` that used to sit on several of these charts was silently dropped by
  # pydantic and every one of them rendered grouped. draw_chart takes barmode
  # as a real argument.
  #
  # time_interval is left null on purpose: "Month" is already a label, so the
  # x axis is categorical and the padded months survive. Asking draw_chart to
  # bucket by month instead would re-derive the axis from the data and drop
  # the empty ones again.
  #
  # EVERY MONTH LABELLED -- review 0.2: "Fig. 2: label every month on the
  # x-axis (currently every second month)." The label used to be '2026-01',
  # which plotly recognises as a DATE and puts on a date axis with its own
  # tick spacing -- every second month at this width. "Jan 2026" is not a
  # date, so the axis stays categorical and every bar gets its label.
  # draw_chart sorts categorical x values as text, which would put Apr before
  # Jan, so each label carries n invisible zero-width spaces (U+200B), n = the
  # month's position: fewer prefixes sort first, text order = month order.
  # Months are cut from the local timestamp text (substr), not strftime,
  # which converts to UTC and would move a 1 a.m. incident on the 1st into
  # the previous month.
  # COUNT AXES. Review 0.3: "several charts still show fractional ticks
  # (0.2, 0.5, 1.5) when counts are small ... Please force whole numbers on
  # every count axis so this holds whatever the data."
  #
  # ecoscope-platform 2.28's AxisStyle has only `title` and `range` -- dtick,
  # tickformat and rangemode are dropped by pydantic -- so the range is the
  # one lever. plotly picks its tick step as range / (at most 10 ticks),
  # rounded up to 1, 2 or 5 x 10^n: any range over 5 gives a step of 1 or
  # more, never a fraction. So every count chart gets a y range of
  # [0, max(5, tallest bar) x 1.15] -- the 15% is headroom for the bar -- and
  # the tallest bar is taken over every view, so with a grouper all months
  # share one scale. Three steps per chart: the top per view, merged, max.
  # The per-view query runs on an empty frame too (one row, 5.75), so a month
  # with no data never breaks the merge.
  #
  # The merge looks two levels into its argument (unpack_depth: 2) so a SKIPPED
  # per-view top -- every view's frame skipped, which happens only when the
  # period has no events at all -- skips the merge instead of handing
  # merge_df a SkipSentinel (CI "empty" test case, 22 Nov 2026). A view is
  # never skipped on its own: split_groups only makes views that hold events,
  # and each chart frame runs on its view.
  - name: "Count Axis Top per View, Draw Conflict Trend"
    id: trend_chart_ytop_v
    task: apply_sql_query
    skipif:
      conditions: *deps
    partial:
      query: |
        SELECT MAX(5.0, COALESCE(MAX(t), 0)) * 1.15 AS ytop FROM (SELECT "Month" AS k, SUM("Incidents") AS t FROM df GROUP BY 1)
      columns: null
      sanitize: true
    mapvalues:
      argnames: df
      argvalues: ${{ workflow.trend_df.return }}
  - {name: 'Count Axis Top, All Views, Draw Conflict Trend', id: trend_chart_ytop_all, task: merge_df,
     skipif: {conditions: *deps, unpack_depth: 2}, partial: {iterables: "${{ workflow.trend_chart_ytop_v.return }}"}}
  - {name: 'Count Axis Top, Draw Conflict Trend', id: trend_chart_ytop, task: dataframe_column_max,
     skipif: {conditions: *deps}, partial: {df: "${{ workflow.trend_chart_ytop_all.return }}", column_name: ytop}}
  - name: Draw Conflict Trend
    id: trend_chart
    task: draw_chart
    partial:
      x_axis: Month
      figures:
      - metric: {display_name: Incidents, aggregator: sum, column: Incidents, decimal_places: 0}
        chart_type: bar
      time_interval: null
      category: Conflict type
      time_breakdown: null
      barmode: stack
      palette: &ctype_palette ['#b62879', '#8c1700', '#ed3ea2', '#ff803e',
                               '#3e35a3', '#a100cb', '#004e26', '#7ab800']
      plot_style: null
      layout_style:
        showlegend: true
        legend_title: Conflict type
        xaxis: {title: Month}
        yaxis: {title: Conflict events, range: [0, "${{ workflow.trend_chart_ytop.return }}"]}
    mapvalues:
      argnames: dataframe
      argvalues: ${{ workflow.trend_df.return }}
  - name: Persist Conflict Trend
    id: trend_html
    task: persist_text
    partial:
      root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
      filename_suffix: conflict_trend
    mapvalues:
      argnames: text
      argvalues: ${{ workflow.trend_chart.return }}
  - name: Conflict Trend Widget
    id: trend_w
    task: create_plot_widget_single_view
    skipif:
      conditions: *never
    partial:
      title: Conflict Events per Month by Type
    map:
      argnames: [view, data]
      argvalues: ${{ workflow.trend_html.return }}
  - name: Merge Conflict Trend Views
    id: trend_wm
    task: merge_widget_views
    partial:
      widgets: ${{ workflow.trend_w.return }}

- title: Species Responsible
  type: task-group
  description: Which animals, and what kind of conflict each causes.
  tasks:
  # STACKED, and in long format because of it.
  #
  # Review feedback: "Can we change this to a stacked bar chart please. Again
  # check the colours are consistent."
  #
  # draw_chart stacks by a single `category` COLUMN, so the wide cross-tab this
  # used to be -- one column per conflict type -- cannot feed it. The query now
  # emits one row per (species, conflict type) instead, scaffolded so that all
  # five types are present for every species even at zero. That padding is what
  # keeps `ctype_palette5` aligned: draw_chart cycles the palette over the
  # series in sorted order, so a period with no Human death would otherwise
  # hand Human death's colour to Human injury.
  #
  # Species order is by total descending, which a categorical x axis preserves
  # only if the rows arrive that way; the ORDER BY at the end does that.
  - name: Species by Conflict Type
    id: species_x
    task: apply_sql_query
    partial:
      query: |
        SELECT sp."Species responsible" AS "Species responsible",
               typ."Conflict type" AS "Conflict type",
               COALESCE(cnt.n, 0) AS "Events"
        FROM (
          SELECT species_h AS "Species responsible", COUNT(*) AS total
          FROM df WHERE is_conflict = 1
            AND event_type IN ('hwc_livestock_predation', 'crop_damage',
                               'infrastructure_damage', 'human_injury', 'human_death')
          GROUP BY 1
        ) sp
        CROSS JOIN (
                    SELECT 'Crop damage' AS "Conflict type"
          UNION ALL SELECT 'Human death'
          UNION ALL SELECT 'Human injury'
          UNION ALL SELECT 'Infrastructure damage'
          UNION ALL SELECT 'Livestock predation'
        ) typ
        LEFT JOIN (
          SELECT species_h AS sp_name, conflict_type AS ct, COUNT(*) AS n
          FROM df WHERE is_conflict = 1
            AND event_type IN ('hwc_livestock_predation', 'crop_damage',
                               'infrastructure_damage', 'human_injury', 'human_death')
          GROUP BY 1, 2
        ) cnt ON cnt.sp_name = sp."Species responsible"
             AND cnt.ct = typ."Conflict type"
        ORDER BY sp.total DESC, 1, 2
      columns: null
      sanitize: true
    mapvalues:
      argnames: df
      argvalues: ${{ workflow.events_grouped.return }}
  - name: "Count Axis Top per View, Draw Species Bar"
    id: species_bar_ytop_v
    task: apply_sql_query
    skipif:
      conditions: *deps
    partial:
      query: |
        SELECT MAX(5.0, COALESCE(MAX(t), 0)) * 1.15 AS ytop FROM (SELECT "Species responsible" AS k, SUM("Events") AS t FROM df GROUP BY 1)
      columns: null
      sanitize: true
    mapvalues:
      argnames: df
      argvalues: ${{ workflow.species_x.return }}
  - {name: 'Count Axis Top, All Views, Draw Species Bar', id: species_bar_ytop_all, task: merge_df,
     skipif: {conditions: *deps, unpack_depth: 2}, partial: {iterables: "${{ workflow.species_bar_ytop_v.return }}"}}
  - {name: 'Count Axis Top, Draw Species Bar', id: species_bar_ytop, task: dataframe_column_max,
     skipif: {conditions: *deps}, partial: {df: "${{ workflow.species_bar_ytop_all.return }}", column_name: ytop}}
  - name: Draw Species Bar
    id: species_bar
    task: draw_chart
    partial:
      x_axis: Species responsible
      figures:
      - metric: {display_name: Events, aggregator: sum, column: Events, decimal_places: 0}
        chart_type: bar
      time_interval: null
      category: Conflict type
      time_breakdown: null
      barmode: stack
      # The first five of ctype_palette, in the same sorted order, so a species
      # chart and the seasonality chart give Crop damage the same pink.
      palette: &ctype_palette5 ['#b62879', '#8c1700', '#ed3ea2', '#ff803e', '#3e35a3']
      plot_style: null
      layout_style:
        showlegend: true
        legend_title: Conflict type
        xaxis: {title: Species responsible}
        yaxis: {title: Conflict events, range: [0, "${{ workflow.species_bar_ytop.return }}"]}
    mapvalues:
      argnames: dataframe
      argvalues: ${{ workflow.species_x.return }}
  - {name: Persist Species Bar, id: species_bar_html, task: persist_text,
     partial: {root_path: "${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}", filename_suffix: species_bar},
     mapvalues: {argnames: text, argvalues: "${{ workflow.species_bar.return }}"}}
  # Quoted: an unquoted comma inside a flow mapping ends the value and starts
  # a new KEY, so this title became a second partial called "by Conflict
  # Type" and the compiler rejected it as a non-identifier. Every title with
  # a comma, colon or bracket in it is quoted for the same reason.
  - {name: Species Bar Widget, id: species_bar_w, task: create_plot_widget_single_view,
     skipif: {conditions: *never}, partial: {title: "Species Responsible"},
     map: {argnames: [view, data], argvalues: "${{ workflow.species_bar_html.return }}"}}
  - {name: Merge Species Bar Views, id: species_bar_wm, task: merge_widget_views,
     partial: {widgets: "${{ workflow.species_bar_w.return }}"}}

- title: Hotspots
  type: task-group
  description: Where conflict happens, as points and as density.
  tasks:
  # Village/area is free TEXT on four of the five conflict events, so it
  # cannot be grouped on. Hotspots are therefore geometry-based. Grouping by
  # Patrol Block would need a Patrol Blocks spatial feature group in ER,
  # which does not exist -- see the MRD, section 4.
  # MRD: "Map: one point per incident". ONE row per incident, at the
  # incident's location -- the first child event's geometry, per the
  # report-wide rules. conflict_seq = 1 picks that single row.
  #
  # DRAWN ONLY WHEN THE PERIOD HAS A LINKED INCIDENT. Review 0.2: "keep both,
  # but only render the incident map when the period contains at least one
  # incident collection. Otherwise show a placeholder ... At the moment both
  # maps are identical because no reports are linked." The EXISTS clause
  # empties the frame when no event sits in a collection (incident_id falls
  # back to the event's own id), so the layer and map skip, the dashboard
  # widget shows its empty state, and the Word report prints "No linked
  # incidents in this period, see Fig. 4." under the Fig. 3 caption -- the
  # caption stays, so figure numbers do not move.
  #
  # incident_geometry is aliased back to `geometry` because apply_sql_query
  # only reconstructs a geometry column under that exact name. Any other name
  # comes back as plain WKT text and the map layer gets nothing to draw.
  - name: Incident Points
    id: inc_points
    task: apply_sql_query
    partial:
      query: |
        SELECT incident_geometry AS geometry,
               conflict_type AS "Conflict type", species_h AS "Species responsible",
               substr(incident_time, 1, 16) AS "Date", serial_number AS "Serial"
        FROM df
        WHERE is_conflict = 1 AND conflict_seq = 1 AND incident_geometry IS NOT NULL
          AND EXISTS (SELECT 1 FROM df c WHERE c.incident_id <> c.id)
      columns: null
      sanitize: true
    mapvalues:
      argnames: df
      argvalues: ${{ workflow.events_grouped.return }}
  # The DICT form, shared by anchor with the pie and the event map. The list
  # this used to be assigned colours by position in whatever order the period's
  # types happened to appear, so Livestock predation was indigo on the map and
  # a different colour in the chart beside it.
  - name: Incident Points Colormap
    id: inc_cmap
    task: apply_color_map
    partial:
      input_column_name: Conflict type
      colormap: *ctype_colors
      output_column_name: inc_color
    mapvalues:
      argnames: df
      argvalues: ${{ workflow.inc_points.return }}
  - name: Incident Points Layer
    id: inc_layer
    task: create_point_layer
    skipif:
      conditions: &geo
      - any_is_empty_df
      - any_dependency_skipped
      - all_geometry_are_none
    partial:
      layer_style:
        get_radius: 8.0
        radius_units: pixels
        fill_color_column: inc_color
        get_line_color: '#ffffff'
        stroked: true
        get_line_width: 1
        opacity: 0.9
      legend: {label_column: Conflict type, color_column: inc_color}
      tooltip_columns: [Conflict type, Species responsible, Date, Serial]
    mapvalues:
      argnames: geodataframe
      argvalues: ${{ workflow.inc_cmap.return }}
  - name: Incident Map Layers
    id: inc_map_layers
    task: combine_map_layers
    partial:
      static_layers: ${{ workflow.boundary_layer.return }}
    mapvalues:
      argnames: grouped_layers
      argvalues: ${{ workflow.inc_layer.return }}
  - name: Draw Incident Map
    id: inc_map
    task: draw_ecomap
    partial:
      tile_layers: ${{ workflow.base_map_defs.return }}
      static: false
      title: null
      north_arrow_style: {placement: top-left}
      # SAME MAP FRAME AS THE MANAGEMENT REPORT: legend top-right (bottom-right
      # sat on the eastern points), a fixed view of the whole conservancy at
      # zoom 10, and the boundary outline drawn under every map. The base
      # maps were already the same pair (World Topo at full opacity, World
      # Imagery at 0.5); what made these look different was the auto-fitted
      # zoom and the missing outline. See the management report's Draw Patrol
      # Trajectories Map for how zoom 10 was chosen.
      legend_style: &map_legend
        placement: top-right
        title: Legend
      # Review feedback: "Check zoom. Make sure it's not rendering grey tiles."
      # At 20 the auto-fitted view state zooms past the level the ArcGIS
      # basemaps actually serve tiles for over rural Laikipia, and a map with
      # one or two points -- which several of these are -- fits to exactly
      # that. 15 is inside tile coverage everywhere and still shows
      # individual bomas.
      max_zoom: 15
      view_state: &conservancy_view
        longitude: 36.98
        latitude: 0.53
        zoom: 10.0
        pitch: 0
        bearing: 0
    mapvalues:
      argnames: geo_layers
      argvalues: ${{ workflow.inc_map_layers.return }}
  - {name: Persist Incident Map, id: inc_map_html, task: persist_text,
     partial: {root_path: "${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}", filename_suffix: incident_map},
     mapvalues: {argnames: text, argvalues: "${{ workflow.inc_map.return }}"}}
  - {name: Incident Map Widget, id: inc_map_w, task: create_map_widget_single_view,
     skipif: {conditions: *never}, partial: {title: Conflict Incidents},
     map: {argnames: [view, data], argvalues: "${{ workflow.inc_map_html.return }}"}}
  - {name: Merge Incident Map Views, id: inc_map_wm, task: merge_widget_views,
     partial: {widgets: "${{ workflow.inc_map_w.return }}"}}

  # THE SECOND MAP THE MRD ASKS FOR: "Map: one point per event type".
  #
  # The difference from the map above is the row it draws. That one plots one
  # point per INCIDENT, at the earliest child's geometry; this plots every
  # qualifying conflict EVENT at its own location, so a collection of three
  # linked reports is one dot there and three dots here. The two read together:
  # how many distinct incidents, and how much reporting each generated.
  #
  # Same colour dict as the incident map and the pie, so a type is one colour
  # across all three.
  # MAP EXTENT. Review 0.3: "set each map's extent from its own data. Start
  # from the conservancy boundary, expand to include every point, and add a
  # ~2 km buffer. Never zoom tighter than the boundary, even for one or two
  # points. Cap the extent at the boundary + ~20 km, and add a note under the
  # map for any points beyond it ('N reports fall outside the map area').
  # Points at 0,0 or outside East Africa stay excluded as now."
  #
  # {m}_view computes the view from that map's own reports over the whole
  # period: the boundary's box, grown to take in every point within ~20 km
  # (0.18 deg) of it, plus 0.018 deg (~2 km), and never past the 20 km cap.
  # Zoom fits that box in an 880 x 440 px area -- the map widgets are about
  # 1085 x 520 px (layout height 12) and the screenshots 1280 x 720, so the
  # legend keeps its corner -- as log2(px per degree x 360 / 512), deck.gl's
  # 512 px tile convention.
  #
  # CAPPED AT ZOOM 10.49, so a view is never tighter than the boundary needs
  # and the imagery matches the management report. deck.gl loads tile level
  # round(zoom + 1) for these 256 px tiles: the management report's fixed
  # zoom 10 gets level 11, which for this area is a cloud-free Esri World
  # Imagery mosaic; zoom 10.5 and over gets level 12, which is cloudy (first
  # test run, 22 Nov 2026: "the clouds are back"). Below the cap the view
  # zooms out as far as the reports need, up to the 20 km cap.
  #
  # ONE VIEW PER MAP, NOT PER MONTH. draw_ecomap's view_state is a plain
  # partial: wt-compiler allows only one per-view argument in mapvalues
  # (geo_layers), so with a grouper every month's map shares the extent of
  # the whole period -- which also keeps their scale comparable. With the
  # default single view this is exactly "the map's own data". draw_ecomap's
  # own auto-fit (no view_state) was not used: it rounds zoom DOWN to a whole
  # number sized for a 256-512 px map, which on these 1280 px maps would draw
  # the conservancy no bigger than the old fixed view.
  #
  # {m}_outside is the "N reports fall outside the map area" note: no rows
  # when there are none, so the report prints nothing. It counts only points
  # inside East Africa (longitude 33-42, latitude -5 to 5, the management
  # report's rule): 0,0 and other impossible locations are typing errors, not
  # reports elsewhere, and are neither mapped nor counted here.
  - name: Conflict Event Map View
    id: evt_map_view
    task: apply_sql_query
    partial:
      df: ${{ workflow.events_indexed.return }}
      query: |
        SELECT lon, lat - (0.0 / 2.0) / ppd AS lat,
               MIN(10.49, ln(ppd * 360.0 / 512.0) / ln(2.0)) AS zoom, ppd
        FROM (
          SELECT (x0 + x1) / 2.0 AS lon, (y0 + y1) / 2.0 AS lat,
                 MIN(880.0 / (x1 - x0), (440.0 - 0.0) / (y1 - y0)) AS ppd
          FROM (
            SELECT MAX(36.67738, MIN(36.85738, COALESCE(MIN(x), 36.85738)) - 0.018) AS x0,
                   MAX(0.25648, MIN(0.43648, COALESCE(MIN(y), 0.43648)) - 0.018) AS y0,
                   MIN(37.23089, MAX(37.05089, COALESCE(MAX(x), 37.05089)) + 0.018) AS x1,
                   MIN(0.74583, MAX(0.56583, COALESCE(MAX(y), 0.56583)) + 0.018) AS y1
            FROM (SELECT x, y FROM (SELECT CAST(substr(w, 1, instr(w, ' ') - 1) AS REAL) AS x, CAST(substr(w, instr(w, ' ') + 1) AS REAL) AS y FROM (SELECT TRIM(REPLACE(REPLACE(CAST(geometry AS TEXT), 'POINT (', ''), ')', '')) AS w FROM df WHERE is_conflict = 1 AND geometry IS NOT NULL)) WHERE x BETWEEN 36.67738 AND 37.23089 AND y BETWEEN 0.25648 AND 0.74583)
          )
        )
      columns: null
      sanitize: true
  - {name: Conflict Event Map View Longitude, id: evt_map_lon, task: dataframe_column_max,
     partial: {df: "${{ workflow.evt_map_view.return }}", column_name: lon}}
  - {name: Conflict Event Map View Latitude, id: evt_map_lat, task: dataframe_column_max,
     partial: {df: "${{ workflow.evt_map_view.return }}", column_name: lat}}
  - {name: Conflict Event Map View Zoom, id: evt_map_zoom, task: dataframe_column_max,
     partial: {df: "${{ workflow.evt_map_view.return }}", column_name: zoom}}
  - name: Conflict Event Map Reports Outside the Map
    id: evt_map_outside
    task: apply_sql_query
    partial:
      df: ${{ workflow.events_indexed.return }}
      query: |
        SELECT printf('%d %s fall%s outside the map area, more than about 20 km beyond the conservancy boundary.',
                      n, CASE WHEN n = 1 THEN 'report' ELSE 'reports' END, CASE WHEN n = 1 THEN 's' ELSE '' END) AS "Note"
        FROM (
          SELECT COUNT(*) AS n
          FROM (SELECT CAST(substr(w, 1, instr(w, ' ') - 1) AS REAL) AS x,
                       CAST(substr(w, instr(w, ' ') + 1) AS REAL) AS y
                FROM (SELECT TRIM(REPLACE(REPLACE(CAST(geometry AS TEXT), 'POINT (', ''), ')', '')) AS w
                      FROM df WHERE is_conflict = 1 AND geometry IS NOT NULL))
          WHERE x BETWEEN 33 AND 42 AND y BETWEEN -5 AND 5
          AND NOT (x BETWEEN 36.67738 AND 37.23089 AND y BETWEEN 0.25648 AND 0.74583)
        )
        WHERE n > 0
      columns: null
      sanitize: true
  - name: Event Points
    id: evt_points
    task: apply_sql_query
    partial:
      query: |
        SELECT geometry,
               conflict_type AS "Conflict type", species_h AS "Species responsible",
               substr(report_time, 1, 16) AS "Date", serial_number AS "Serial"
        FROM df
        WHERE is_conflict = 1 AND geometry IS NOT NULL
      columns: null
      sanitize: true
    mapvalues:
      argnames: df
      argvalues: ${{ workflow.events_grouped.return }}
  - name: Event Points Colormap
    id: evt_cmap
    task: apply_color_map
    partial:
      input_column_name: Conflict type
      colormap: *ctype_colors
      output_column_name: evt_color
    mapvalues:
      argnames: df
      argvalues: ${{ workflow.evt_points.return }}
  - name: Event Points Layer
    id: evt_layer
    task: create_point_layer
    skipif:
      conditions: *geo
    partial:
      layer_style:
        get_radius: 6.0
        radius_units: pixels
        fill_color_column: evt_color
        get_line_color: '#ffffff'
        stroked: true
        get_line_width: 1
        opacity: 0.85
      legend: {label_column: Conflict type, color_column: evt_color}
      tooltip_columns: [Conflict type, Species responsible, Date, Serial]
    mapvalues:
      argnames: geodataframe
      argvalues: ${{ workflow.evt_cmap.return }}
  - name: Event Map Layers
    id: evt_map_layers
    task: combine_map_layers
    partial:
      static_layers: ${{ workflow.boundary_layer.return }}
    mapvalues:
      argnames: grouped_layers
      argvalues: ${{ workflow.evt_layer.return }}
  - name: Draw Event Map
    id: evt_map
    task: draw_ecomap
    partial:
      tile_layers: ${{ workflow.base_map_defs.return }}
      static: false
      title: null
      north_arrow_style: {placement: top-left}
      legend_style: *map_legend
      max_zoom: 15
      view_state:
        longitude: ${{ workflow.evt_map_lon.return }}
        latitude: ${{ workflow.evt_map_lat.return }}
        zoom: ${{ workflow.evt_map_zoom.return }}
        pitch: 0
        bearing: 0
    mapvalues:
      argnames: geo_layers
      argvalues: ${{ workflow.evt_map_layers.return }}
  - {name: Persist Event Map, id: evt_map_html, task: persist_text,
     partial: {root_path: "${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}", filename_suffix: event_map},
     mapvalues: {argnames: text, argvalues: "${{ workflow.evt_map.return }}"}}
  - {name: Event Map Widget, id: evt_map_w, task: create_map_widget_single_view,
     skipif: {conditions: *never}, partial: {title: Conflict Events},
     map: {argnames: [view, data], argvalues: "${{ workflow.evt_map_html.return }}"}}
  - {name: Merge Event Map Views, id: evt_map_wm, task: merge_widget_views,
     partial: {widgets: "${{ workflow.evt_map_w.return }}"}}

# SECTION 5 (Seasonality) WAS A TASK-GROUP HERE AND IS GONE.
#
# Review feedback: "Can we move the stacked bar chart from section 5 to here
# [section 2]" and "Section 5 -- I think we can drop this section as we have
# moved the output earlier". trend_df / trend_chart / trend_html / trend_w now
# live in the Conflict Type group above, rebuilt to keep zero months.
- title: Human Injury and Death
  type: task-group
  description: People hurt or killed in conflict, by species responsible.
  tasks:
  # STACKED. Review feedback, section 6: "Could we change this to a stacked bar
  # chart please?" Long format for the same reason as the species chart, and
  # scaffolded so Injured and Killed are both always present and the palette
  # cannot swap them in a period with no deaths.
  #
  # `outcome_palette` is used by the wildlife and livestock charts and the
  # wildlife map too: injured is light blue and killed dark blue everywhere.
  # Review 0.2 found the old amber / dark red were the Infrastructure damage
  # and Human death hexes reused for an unrelated meaning ("the same hex codes
  # are reused for unrelated categories, e.g. outcome (killed/injured)"), so
  # outcome now has a ramp of its own that no other palette uses -- light to
  # dark because killed is the more severe. Sorted order puts Injured before
  # Killed.
  - name: Casualties by Species
    id: cas_by_species
    task: apply_sql_query
    partial:
      query: |
        SELECT sp."Species responsible" AS "Species responsible",
               o."Outcome" AS "Outcome",
               COALESCE(cnt.n, 0) AS "People"
        FROM (
          SELECT species_h AS "Species responsible", COUNT(*) AS total
          FROM df
          WHERE is_conflict = 1 AND event_type IN ('human_injury', 'human_death')
          GROUP BY 1
        ) sp
        CROSS JOIN (SELECT 'Injured' AS "Outcome" UNION ALL SELECT 'Killed') o
        LEFT JOIN (
          SELECT species_h AS sp_name,
                 CASE WHEN event_type = 'human_death' THEN 'Killed' ELSE 'Injured' END AS oc,
                 COUNT(*) AS n
          FROM df
          WHERE is_conflict = 1 AND event_type IN ('human_injury', 'human_death')
          GROUP BY 1, 2
        ) cnt ON cnt.sp_name = sp."Species responsible" AND cnt.oc = o."Outcome"
        ORDER BY sp.total DESC, 1, 2
      columns: null
      sanitize: true
    mapvalues:
      argnames: df
      argvalues: ${{ workflow.events_grouped.return }}
  - name: "Count Axis Top per View, Draw Casualties Bar"
    id: cas_bar_ytop_v
    task: apply_sql_query
    skipif:
      conditions: *deps
    partial:
      query: |
        SELECT MAX(5.0, COALESCE(MAX(t), 0)) * 1.15 AS ytop FROM (SELECT "Species responsible" AS k, SUM("People") AS t FROM df GROUP BY 1)
      columns: null
      sanitize: true
    mapvalues:
      argnames: df
      argvalues: ${{ workflow.cas_by_species.return }}
  - {name: 'Count Axis Top, All Views, Draw Casualties Bar', id: cas_bar_ytop_all, task: merge_df,
     skipif: {conditions: *deps, unpack_depth: 2}, partial: {iterables: "${{ workflow.cas_bar_ytop_v.return }}"}}
  - {name: 'Count Axis Top, Draw Casualties Bar', id: cas_bar_ytop, task: dataframe_column_max,
     skipif: {conditions: *deps}, partial: {df: "${{ workflow.cas_bar_ytop_all.return }}", column_name: ytop}}
  - name: Draw Casualties Bar
    id: cas_bar
    task: draw_chart
    partial:
      x_axis: Species responsible
      figures:
      - metric: {display_name: People, aggregator: sum, column: People, decimal_places: 0}
        chart_type: bar
      time_interval: null
      category: Outcome
      time_breakdown: null
      barmode: stack
      palette: &outcome_palette ['#9ecae1', '#08519c']
      plot_style: null
      layout_style:
        showlegend: true
        legend_title: Outcome
        xaxis: {title: Species responsible}
        yaxis: {title: People injured or killed, range: [0, "${{ workflow.cas_bar_ytop.return }}"]}
    mapvalues:
      argnames: dataframe
      argvalues: ${{ workflow.cas_by_species.return }}
  - {name: Persist Casualties Bar, id: cas_bar_html, task: persist_text,
     partial: {root_path: "${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}", filename_suffix: casualties_bar},
     mapvalues: {argnames: text, argvalues: "${{ workflow.cas_bar.return }}"}}
  - {name: Casualties Bar Widget, id: cas_bar_w, task: create_plot_widget_single_view,
     skipif: {conditions: *never}, partial: {title: Human Casualties by Species Responsible},
     map: {argnames: [view, data], argvalues: "${{ workflow.cas_bar_html.return }}"}}
  - {name: Merge Casualties Bar Views, id: cas_bar_wm, task: merge_widget_views,
     partial: {widgets: "${{ workflow.cas_bar_w.return }}"}}

  # PII RULE, from the MRD's report-wide rules. This table is a column
  # WHITELIST, not a blacklist: name, ID number, telephone, date of birth,
  # ethnicity and tribe are never selected, so they cannot reach a widget or
  # the Word report even if the form adds them later.
  - name: Casualty Table
    id: cas_table
    task: apply_sql_query
    partial:
      query: |
        SELECT substr(report_time, 1, 10) AS "Date",
               -- Review feedback: "Could we add the event coordinates to the
               -- 'Location' column". Village/Area is free text and is the only
               -- place-name the conflict forms carry. The coordinates come off
               -- the event geometry, which sanitize hands over as WKT
               -- ("POINT (36.9 0.44)"), so they are parsed out of the string
               -- and printed latitude first, the order a reader expects.
               -- Review 0.2: "Drop the '-' in front of the coordinates. Round
               -- coordinates to 5 decimal places." The dash was the empty-
               -- village placeholder glued in front of the coordinates, so a
               -- record with no village name read "- (0.52, 36.97)". It now
               -- prints the coordinates alone, at 5 places (about 1 m).
               COALESCE(CASE
                 WHEN lon_txt IS NULL THEN village
                 WHEN village IS NULL THEN printf('%.5f, %.5f', CAST(lat_txt AS REAL), CAST(lon_txt AS REAL))
                 ELSE village || ' (' || printf('%.5f, %.5f', CAST(lat_txt AS REAL), CAST(lon_txt AS REAL)) || ')'
               END, '-') AS "Location",
               CASE WHEN event_type = 'human_death' THEN 'Killed' ELSE 'Injured' END AS "Outcome",
               species_h AS "Species responsible",
               COALESCE(json_extract(event_details, '$."Age"'), '-') AS "Age",
               COALESCE(json_extract(event_details, '$."Sex"'), '-') AS "Sex",
               COALESCE(action_txt, '-') AS "Action taken",
               -- Review feedback: "What is the 'Circumstances' column referring
               -- to? I think this is best as event notes."
               --
               -- It used to be the structured circumstance fields (Activity at
               -- time of incident, Time of day), chosen BECAUSE they cannot
               -- carry personal detail. The event note is free text, so unlike
               -- every other column in this table it is not covered by the
               -- field whitelist: whatever a ranger typed appears verbatim,
               -- names included. Kept because the review asked for it, and
               -- flagged here so the decision is visible rather than implied.
               COALESCE(note_txt, '-') AS "Notes",
               serial_number AS "Serial"
        FROM (
          SELECT *,
                 NULLIF(TRIM(COALESCE(json_extract(event_details, '$."village_area"'),
                          json_extract(event_details, '$."Village/Area"'), '')), '') AS village,
                 NULLIF(substr(wkt, 1, instr(wkt, ' ') - 1), '') AS lon_txt,
                 NULLIF(substr(wkt, instr(wkt, ' ') + 1), '') AS lat_txt
          FROM (
            SELECT *,
                   CASE WHEN geometry IS NULL THEN NULL
                        ELSE TRIM(REPLACE(REPLACE(REPLACE(
                             CAST(geometry AS TEXT), 'POINT', ''), '(', ''), ')', ''))
                   END AS wkt
            FROM df
            WHERE is_conflict = 1 AND event_type IN ('human_injury', 'human_death')
          )
        )
        ORDER BY 1 DESC
      columns: null
      sanitize: true
    mapvalues:
      argnames: df
      argvalues: ${{ workflow.events_grouped.return }}
  - {name: Draw Casualty Table, id: cas_tbl, task: draw_table,
     partial: {columns: null, table_config: {enable_sorting: true, enable_filtering: false,
                                             enable_download: true, hide_header: false}},
     mapvalues: {argnames: dataframe, argvalues: "${{ workflow.cas_table.return }}"}}
  - {name: Persist Casualty Table, id: cas_tbl_html, task: persist_text,
     partial: {root_path: "${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}", filename_suffix: casualty_table},
     mapvalues: {argnames: text, argvalues: "${{ workflow.cas_tbl.return }}"}}
  - {name: Casualty Table Widget, id: cas_tbl_w, task: create_table_widget_single_view,
     skipif: {conditions: *never}, partial: {title: "Human Casualties"},
     map: {argnames: [view, data], argvalues: "${{ workflow.cas_tbl_html.return }}"}}
  - {name: Merge Casualty Table Views, id: cas_tbl_wm, task: merge_widget_views,
     partial: {widgets: "${{ workflow.cas_tbl_w.return }}"}}

- title: Wildlife Injury and Death
  type: task-group
  description: Animals killed or hurt in conflict, by species and by cause.
  tasks:
  - name: Wildlife Casualties by Species
    id: wl_by_species
    task: apply_sql_query
    partial:
      query: |
        SELECT sp."Species" AS "Species",
               o."Outcome" AS "Outcome",
               COALESCE(cnt.n, 0) AS "Animals"
        FROM (
          SELECT COALESCE(animal_h, 'Unknown') AS "Species", COUNT(*) AS total
          FROM df
          WHERE is_conflict = 1 AND event_type IN ('animal_carcass', 'sick_injured_animal')
          GROUP BY 1
        ) sp
        CROSS JOIN (SELECT 'Injured' AS "Outcome" UNION ALL SELECT 'Killed') o
        LEFT JOIN (
          SELECT COALESCE(animal_h, 'Unknown') AS sp_name,
                 CASE WHEN event_type = 'animal_carcass' THEN 'Killed' ELSE 'Injured' END AS oc,
                 COUNT(*) AS n
          FROM df
          WHERE is_conflict = 1 AND event_type IN ('animal_carcass', 'sick_injured_animal')
          GROUP BY 1, 2
        ) cnt ON cnt.sp_name = sp."Species" AND cnt.oc = o."Outcome"
        ORDER BY sp.total DESC, 1, 2
      columns: null
      sanitize: true
    mapvalues:
      argnames: df
      argvalues: ${{ workflow.events_grouped.return }}
  # STACKED. Review feedback, section 7: "Bar chart - Wildlife killed and
  # injured by species: change to stacked bar chart."
  - name: "Count Axis Top per View, Draw Wildlife Casualties Bar"
    id: wl_bar_ytop_v
    task: apply_sql_query
    skipif:
      conditions: *deps
    partial:
      query: |
        SELECT MAX(5.0, COALESCE(MAX(t), 0)) * 1.15 AS ytop FROM (SELECT "Species" AS k, SUM("Animals") AS t FROM df GROUP BY 1)
      columns: null
      sanitize: true
    mapvalues:
      argnames: df
      argvalues: ${{ workflow.wl_by_species.return }}
  - {name: 'Count Axis Top, All Views, Draw Wildlife Casualties Bar', id: wl_bar_ytop_all, task: merge_df,
     skipif: {conditions: *deps, unpack_depth: 2}, partial: {iterables: "${{ workflow.wl_bar_ytop_v.return }}"}}
  - {name: 'Count Axis Top, Draw Wildlife Casualties Bar', id: wl_bar_ytop, task: dataframe_column_max,
     skipif: {conditions: *deps}, partial: {df: "${{ workflow.wl_bar_ytop_all.return }}", column_name: ytop}}
  - name: Draw Wildlife Casualties Bar
    id: wl_bar
    task: draw_chart
    partial:
      x_axis: Species
      figures:
      - metric: {display_name: Animals, aggregator: sum, column: Animals, decimal_places: 0}
        chart_type: bar
      time_interval: null
      category: Outcome
      time_breakdown: null
      barmode: stack
      palette: *outcome_palette
      plot_style: null
      layout_style:
        showlegend: true
        legend_title: Outcome
        xaxis: {title: Species}
        yaxis: {title: Animals killed or injured, range: [0, "${{ workflow.wl_bar_ytop.return }}"]}
    mapvalues:
      argnames: dataframe
      argvalues: ${{ workflow.wl_by_species.return }}
  - {name: Persist Wildlife Casualties Bar, id: wl_bar_html, task: persist_text,
     partial: {root_path: "${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}", filename_suffix: wildlife_casualties_bar},
     mapvalues: {argnames: text, argvalues: "${{ workflow.wl_bar.return }}"}}
  - {name: Wildlife Casualties Bar Widget, id: wl_bar_w, task: create_plot_widget_single_view,
     skipif: {conditions: *never}, partial: {title: Wildlife Killed and Injured},
     map: {argnames: [view, data], argvalues: "${{ workflow.wl_bar_html.return }}"}}
  - {name: Merge Wildlife Casualties Bar Views, id: wl_bar_wm, task: merge_widget_views,
     partial: {widgets: "${{ workflow.wl_bar_w.return }}"}}

  # Cause of Death and Cause of Injury are separate conditional fields that
  # carry the same vocabulary (Arrow / Euthanised / Fence / Gunshot / Other /
  # Poisoning / Snare / Spear), so they are COALESCEd into one column.
  - name: Wildlife Casualty Causes
    id: wl_by_cause
    task: apply_sql_query
    partial:
      query: |
        SELECT CASE
                 WHEN wl_cause IS NULL OR TRIM(wl_cause) = '' THEN 'Not recorded'
                 WHEN LOWER(wl_cause) LIKE '%arrow%'   THEN 'Arrow'
                 WHEN LOWER(wl_cause) LIKE '%euthan%'  THEN 'Euthanised'
                 WHEN LOWER(wl_cause) LIKE '%fence%'   THEN 'Fence'
                 WHEN LOWER(wl_cause) LIKE '%gun%'     THEN 'Gunshot'
                 WHEN LOWER(wl_cause) LIKE '%poison%'  THEN 'Poisoning'
                 WHEN LOWER(wl_cause) LIKE '%snare%'   THEN 'Snare'
                 WHEN LOWER(wl_cause) LIKE '%spear%'   THEN 'Spear'
                 ELSE 'Other'
               END AS "Cause",
               COUNT(*) AS "Animals"
        FROM df
        WHERE is_conflict = 1 AND event_type IN ('animal_carcass', 'sick_injured_animal')
        GROUP BY 1 ORDER BY 2 DESC
      columns: null
      sanitize: true
    mapvalues:
      argnames: df
      argvalues: ${{ workflow.events_grouped.return }}
  # A FIXED COLOUR PER CAUSE. Review 0.2: "Show 'Not recorded' as grey across
  # all outputs." The pie used plotly's default sequence, so Not recorded took
  # whatever colour its slice position gave it. The query above folds every
  # label onto the form's fixed vocabulary (anything new lands in Other), so
  # every row has a key here -- apply_color_map paints an unlisted value
  # fully transparent, which on a pie is a missing slice.
  - name: Wildlife Cause Colormap
    id: wl_cause_cmap
    task: apply_color_map
    partial:
      input_column_name: Cause
      colormap:
        Arrow: '#8dd3c7'
        Euthanised: '#bebada'
        Fence: '#fb8072'
        Gunshot: '#80b1d3'
        Not recorded: &not_recorded '#9e9e9e'
        Other: '#bc80bd'
        Poisoning: '#fdb462'
        Snare: '#b3de69'
        Spear: '#fccde5'
      output_column_name: cause_color
    mapvalues:
      argnames: df
      argvalues: ${{ workflow.wl_by_cause.return }}
  # A PIE. Review feedback: "Bar chart - Cause of wildlife death or injury: can
  # we change this to a pie chart please? Flagging that the legend is missing
  # on the bar graph." A single-series bar had nothing to put in a legend; as a
  # pie, the causes ARE the legend.
  - name: Draw Wildlife Cause Pie
    id: wl_cause_bar
    task: draw_pie_chart
    partial:
      value_column: Animals
      label_column: Cause
      color_column: cause_color
      plot_style: {textinfo: value+percent}
      layout_style: {showlegend: true, legend_title: Cause}
    mapvalues:
      argnames: dataframe
      argvalues: ${{ workflow.wl_cause_cmap.return }}
  - {name: Persist Wildlife Cause Bar, id: wl_cause_html, task: persist_text,
     partial: {root_path: "${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}", filename_suffix: wildlife_cause_bar},
     mapvalues: {argnames: text, argvalues: "${{ workflow.wl_cause_bar.return }}"}}
  - {name: Wildlife Cause Bar Widget, id: wl_cause_w, task: create_plot_widget_single_view,
     skipif: {conditions: *never}, partial: {title: Cause of Wildlife Death or Injury},
     map: {argnames: [view, data], argvalues: "${{ workflow.wl_cause_html.return }}"}}
  - {name: Merge Wildlife Cause Bar Views, id: wl_cause_wm, task: merge_widget_views,
     partial: {widgets: "${{ workflow.wl_cause_w.return }}"}}

  - name: Wildlife Casualty Map View
    id: wl_map_view
    task: apply_sql_query
    partial:
      df: ${{ workflow.events_indexed.return }}
      query: |
        SELECT lon, lat - (0.0 / 2.0) / ppd AS lat,
               MIN(10.49, ln(ppd * 360.0 / 512.0) / ln(2.0)) AS zoom, ppd
        FROM (
          SELECT (x0 + x1) / 2.0 AS lon, (y0 + y1) / 2.0 AS lat,
                 MIN(880.0 / (x1 - x0), (440.0 - 0.0) / (y1 - y0)) AS ppd
          FROM (
            SELECT MAX(36.67738, MIN(36.85738, COALESCE(MIN(x), 36.85738)) - 0.018) AS x0,
                   MAX(0.25648, MIN(0.43648, COALESCE(MIN(y), 0.43648)) - 0.018) AS y0,
                   MIN(37.23089, MAX(37.05089, COALESCE(MAX(x), 37.05089)) + 0.018) AS x1,
                   MIN(0.74583, MAX(0.56583, COALESCE(MAX(y), 0.56583)) + 0.018) AS y1
            FROM (SELECT x, y FROM (SELECT CAST(substr(w, 1, instr(w, ' ') - 1) AS REAL) AS x, CAST(substr(w, instr(w, ' ') + 1) AS REAL) AS y FROM (SELECT TRIM(REPLACE(REPLACE(CAST(geometry AS TEXT), 'POINT (', ''), ')', '')) AS w FROM df WHERE is_conflict = 1 AND event_type IN ('animal_carcass', 'sick_injured_animal') AND geometry IS NOT NULL)) WHERE x BETWEEN 36.67738 AND 37.23089 AND y BETWEEN 0.25648 AND 0.74583)
          )
        )
      columns: null
      sanitize: true
  - {name: Wildlife Casualty Map View Longitude, id: wl_map_lon, task: dataframe_column_max,
     partial: {df: "${{ workflow.wl_map_view.return }}", column_name: lon}}
  - {name: Wildlife Casualty Map View Latitude, id: wl_map_lat, task: dataframe_column_max,
     partial: {df: "${{ workflow.wl_map_view.return }}", column_name: lat}}
  - {name: Wildlife Casualty Map View Zoom, id: wl_map_zoom, task: dataframe_column_max,
     partial: {df: "${{ workflow.wl_map_view.return }}", column_name: zoom}}
  - name: Wildlife Casualty Map Reports Outside the Map
    id: wl_map_outside
    task: apply_sql_query
    partial:
      df: ${{ workflow.events_indexed.return }}
      query: |
        SELECT printf('%d %s fall%s outside the map area, more than about 20 km beyond the conservancy boundary.',
                      n, CASE WHEN n = 1 THEN 'report' ELSE 'reports' END, CASE WHEN n = 1 THEN 's' ELSE '' END) AS "Note"
        FROM (
          SELECT COUNT(*) AS n
          FROM (SELECT CAST(substr(w, 1, instr(w, ' ') - 1) AS REAL) AS x,
                       CAST(substr(w, instr(w, ' ') + 1) AS REAL) AS y
                FROM (SELECT TRIM(REPLACE(REPLACE(CAST(geometry AS TEXT), 'POINT (', ''), ')', '')) AS w
                      FROM df WHERE is_conflict = 1 AND event_type IN ('animal_carcass', 'sick_injured_animal') AND geometry IS NOT NULL))
          WHERE x BETWEEN 33 AND 42 AND y BETWEEN -5 AND 5
          AND NOT (x BETWEEN 36.67738 AND 37.23089 AND y BETWEEN 0.25648 AND 0.74583)
        )
        WHERE n > 0
      columns: null
      sanitize: true
  - name: Wildlife Casualty Points
    id: wl_points
    task: apply_sql_query
    partial:
      query: |
        SELECT geometry,
               CASE WHEN event_type = 'animal_carcass' THEN 'Killed' ELSE 'Injured' END AS "Outcome",
               COALESCE(animal_h, 'Unknown') AS "Species",
               COALESCE(wl_cause, '-') AS "Cause",
               substr(report_time, 1, 16) AS "Date"
        FROM df
        WHERE is_conflict = 1 AND event_type IN ('animal_carcass', 'sick_injured_animal')
          AND geometry IS NOT NULL
      columns: null
      sanitize: true
    mapvalues:
      argnames: df
      argvalues: ${{ workflow.events_grouped.return }}
  - {name: Wildlife Casualty Colormap, id: wl_cmap, task: apply_color_map,
     partial: {input_column_name: Outcome, colormap: &outcome_colors {Injured: '#9ecae1', Killed: '#08519c'}, output_column_name: wl_color},
     mapvalues: {argnames: df, argvalues: "${{ workflow.wl_points.return }}"}}
  - name: Wildlife Casualty Layer
    id: wl_layer
    task: create_point_layer
    skipif:
      conditions: *geo
    partial:
      layer_style:
        get_radius: 7.0
        radius_units: pixels
        fill_color_column: wl_color
        get_line_color: '#ffffff'
        stroked: true
        get_line_width: 1
        opacity: 0.85
      legend: {label_column: Outcome, color_column: wl_color}
      tooltip_columns: [Outcome, Species, Cause, Date]
    mapvalues:
      argnames: geodataframe
      argvalues: ${{ workflow.wl_cmap.return }}
  - name: Wildlife Casualty Map Layers
    id: wl_map_layers
    task: combine_map_layers
    partial:
      static_layers: ${{ workflow.boundary_layer.return }}
    mapvalues:
      argnames: grouped_layers
      argvalues: ${{ workflow.wl_layer.return }}
  - name: Draw Wildlife Casualty Map
    id: wl_map
    task: draw_ecomap
    partial:
      tile_layers: ${{ workflow.base_map_defs.return }}
      static: false
      title: null
      north_arrow_style: {placement: top-left}
      legend_style: *map_legend
      # Review feedback: "Check zoom. Make sure it's not rendering grey tiles."
      # At 20 the auto-fitted view state zooms past the level the ArcGIS
      # basemaps actually serve tiles for over rural Laikipia, and a map with
      # one or two points -- which several of these are -- fits to exactly
      # that. 15 is inside tile coverage everywhere and still shows
      # individual bomas.
      max_zoom: 15
      view_state:
        longitude: ${{ workflow.wl_map_lon.return }}
        latitude: ${{ workflow.wl_map_lat.return }}
        zoom: ${{ workflow.wl_map_zoom.return }}
        pitch: 0
        bearing: 0
    mapvalues:
      argnames: geo_layers
      argvalues: ${{ workflow.wl_map_layers.return }}
  - {name: Persist Wildlife Casualty Map, id: wl_map_html, task: persist_text,
     partial: {root_path: "${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}", filename_suffix: wildlife_casualty_map},
     mapvalues: {argnames: text, argvalues: "${{ workflow.wl_map.return }}"}}
  - {name: Wildlife Casualty Map Widget, id: wl_map_w, task: create_map_widget_single_view,
     skipif: {conditions: *never}, partial: {title: Wildlife Killed or Injured},
     map: {argnames: [view, data], argvalues: "${{ workflow.wl_map_html.return }}"}}
  - {name: Merge Wildlife Casualty Map Views, id: wl_map_wm, task: merge_widget_views,
     partial: {widgets: "${{ workflow.wl_map_w.return }}"}}

- title: Livestock Predation
  type: task-group
  description: What was taken, by what, and whether the boma held.
  tasks:
  # Every predation record is a conflict record, so no cause filter here.
  - name: Livestock Losses by Species
    id: pred_by_species
    task: apply_sql_query
    partial:
      query: |
        SELECT a."Livestock species" AS "Livestock species",
               o."Outcome" AS "Outcome",
               CASE WHEN o."Outcome" = 'Killed' THEN a.killed ELSE a.injured END AS "Animals"
        FROM (
          SELECT CASE
                   WHEN ls IS NULL OR TRIM(ls) IN ('', '[]') THEN 'Not recorded'
                   WHEN json_valid(ls) = 0 THEN ls
                   WHEN json_type(ls) <> 'array' THEN json_extract(ls, '$')
                   WHEN json_array_length(ls) > 1 THEN 'Several species'
                   WHEN LOWER(json_extract(ls, '$[0]')) LIKE 'other%' THEN 'Other'
                   ELSE json_extract(ls, '$[0]')
                 END AS "Livestock species",
                 CAST(COALESCE(SUM(dead), 0) AS INTEGER) AS killed,
                 CAST(COALESCE(SUM(injured), 0) AS INTEGER) AS injured
          FROM (
            SELECT CAST(json_extract(event_details, '$."Livestock species"') AS TEXT) AS ls,
                   CAST(COALESCE(json_extract(event_details, '$."Total livestock dead"'), 0) AS REAL) AS dead,
                   CAST(COALESCE(json_extract(event_details, '$."Total livestock injured"'), 0) AS REAL) AS injured
            FROM df WHERE event_type = 'hwc_livestock_predation'
          )
          GROUP BY 1
        ) a
        CROSS JOIN (SELECT 'Injured' AS "Outcome" UNION ALL SELECT 'Killed') o
        ORDER BY a.killed DESC, a.injured DESC, 1, 2
      columns: null
      sanitize: true
    mapvalues:
      argnames: df
      argvalues: ${{ workflow.events_grouped.return }}
  # STACKED. Review feedback, section 8: "Bar graph - Livestock killed and
  # injured by livestock species: could we make this stacked please?" The
  # CROSS JOIN turns the two aggregate columns into two rows per species, which
  # is the shape draw_chart's `category` needs, and guarantees both series
  # exist so `outcome_palette` keeps light blue on injured.
  - name: "Count Axis Top per View, Draw Livestock Losses Bar"
    id: pred_bar_ytop_v
    task: apply_sql_query
    skipif:
      conditions: *deps
    partial:
      query: |
        SELECT MAX(5.0, COALESCE(MAX(t), 0)) * 1.15 AS ytop FROM (SELECT "Livestock species" AS k, SUM("Animals") AS t FROM df GROUP BY 1)
      columns: null
      sanitize: true
    mapvalues:
      argnames: df
      argvalues: ${{ workflow.pred_by_species.return }}
  - {name: 'Count Axis Top, All Views, Draw Livestock Losses Bar', id: pred_bar_ytop_all, task: merge_df,
     skipif: {conditions: *deps, unpack_depth: 2}, partial: {iterables: "${{ workflow.pred_bar_ytop_v.return }}"}}
  - {name: 'Count Axis Top, Draw Livestock Losses Bar', id: pred_bar_ytop, task: dataframe_column_max,
     skipif: {conditions: *deps}, partial: {df: "${{ workflow.pred_bar_ytop_all.return }}", column_name: ytop}}
  - name: Draw Livestock Losses Bar
    id: pred_bar
    task: draw_chart
    partial:
      x_axis: Livestock species
      figures:
      - metric: {display_name: Animals, aggregator: sum, column: Animals, decimal_places: 0}
        chart_type: bar
      time_interval: null
      category: Outcome
      time_breakdown: null
      barmode: stack
      palette: *outcome_palette
      plot_style: null
      layout_style:
        showlegend: true
        legend_title: Outcome
        xaxis: {title: Livestock species}
        yaxis: {title: Animals killed or injured, range: [0, "${{ workflow.pred_bar_ytop.return }}"]}
    mapvalues:
      argnames: dataframe
      argvalues: ${{ workflow.pred_by_species.return }}
  - {name: Persist Livestock Losses Bar, id: pred_bar_html, task: persist_text,
     partial: {root_path: "${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}", filename_suffix: predation_losses_bar},
     mapvalues: {argnames: text, argvalues: "${{ workflow.pred_bar.return }}"}}
  - {name: Livestock Losses Bar Widget, id: pred_bar_w, task: create_plot_widget_single_view,
     skipif: {conditions: *never}, partial: {title: Livestock Killed and Injured by Species},
     map: {argnames: [view, data], argvalues: "${{ workflow.pred_bar_html.return }}"}}
  - {name: Merge Livestock Losses Bar Views, id: pred_bar_wm, task: merge_widget_views,
     partial: {widgets: "${{ workflow.pred_bar_w.return }}"}}

  # FIG. 12 -- PREDATORS, EACH BAR STACKED BY THE LIVESTOCK KILLED.
  #
  # Review 0.2: "change to predators responsible by livestock type, so each
  # predator's bar is stacked by the livestock killed. Make sure the legend
  # reflects this (colours = livestock species)."
  #
  # Livestock species is a multi-select on the form, but the form records ONE
  # total killed per report, so a report naming goats and sheep cannot be
  # split between them. Such a report is stacked as "Several species" rather
  # than guessed at. "Other (specify in notes)" is shortened to "Other".
  #
  # The livestock list is FIXED and always present, zeros included, because
  # draw_chart deals its palette out over the series in sorted order: with a
  # fixed set of eight, goat is the same colour in every period. Sorted, the
  # series are Camel, Cattle, Donkey, Goat, Not recorded, Other, Several
  # species, Sheep -- `livestock_palette` below is in that order, with Not
  # recorded grey like everywhere else.
  - name: Predators Responsible
    id: pred_predators
    task: apply_sql_query
    partial:
      query: |
        SELECT p.pred AS "Predator", l.ls AS "Livestock species",
               CAST(COALESCE(SUM(CASE WHEN d.ls = l.ls THEN d.dead ELSE 0 END), 0) AS INTEGER) AS "Livestock killed"
        FROM (
          SELECT species_h AS pred,
                 SUM(CAST(COALESCE(json_extract(event_details, '$."Total livestock dead"'), 0) AS REAL)) AS total,
                 COUNT(*) AS attacks
          FROM df WHERE event_type = 'hwc_livestock_predation' GROUP BY 1
          HAVING SUM(CAST(COALESCE(json_extract(event_details, '$."Total livestock dead"'), 0) AS REAL)) > 0
        ) p
        CROSS JOIN (
                    SELECT 'Camel' AS ls UNION ALL SELECT 'Cattle' UNION ALL SELECT 'Donkey'
          UNION ALL SELECT 'Goat' UNION ALL SELECT 'Not recorded' UNION ALL SELECT 'Other'
          UNION ALL SELECT 'Several species' UNION ALL SELECT 'Sheep'
        ) l
        LEFT JOIN (
          SELECT species_h AS pred,
                 CASE
                   WHEN lsr IS NULL OR TRIM(lsr) IN ('', '[]') THEN 'Not recorded'
                   WHEN json_valid(lsr) = 0 THEN lsr
                   WHEN json_type(lsr) <> 'array' THEN json_extract(lsr, '$')
                   WHEN json_array_length(lsr) > 1 THEN 'Several species'
                   WHEN LOWER(json_extract(lsr, '$[0]')) LIKE 'other%' THEN 'Other'
                   ELSE json_extract(lsr, '$[0]')
                 END AS ls,
                 dead
          FROM (
            SELECT species_h,
                   CAST(json_extract(event_details, '$."Livestock species"') AS TEXT) AS lsr,
                   CAST(COALESCE(json_extract(event_details, '$."Total livestock dead"'), 0) AS REAL) AS dead
            FROM df WHERE event_type = 'hwc_livestock_predation'
          )
        ) d ON d.pred = p.pred
        GROUP BY p.pred, l.ls
        ORDER BY MAX(p.total) DESC, MAX(p.attacks) DESC, 1, 2
      columns: null
      sanitize: true
    mapvalues:
      argnames: df
      argvalues: ${{ workflow.events_grouped.return }}
  - name: "Count Axis Top per View, Draw Predators Bar"
    id: pred_pred_bar_ytop_v
    task: apply_sql_query
    skipif:
      conditions: *deps
    partial:
      query: |
        SELECT MAX(5.0, COALESCE(MAX(t), 0)) * 1.15 AS ytop FROM (SELECT "Predator" AS k, SUM("Livestock killed") AS t FROM df GROUP BY 1)
      columns: null
      sanitize: true
    mapvalues:
      argnames: df
      argvalues: ${{ workflow.pred_predators.return }}
  - {name: 'Count Axis Top, All Views, Draw Predators Bar', id: pred_pred_bar_ytop_all, task: merge_df,
     skipif: {conditions: *deps, unpack_depth: 2}, partial: {iterables: "${{ workflow.pred_pred_bar_ytop_v.return }}"}}
  - {name: 'Count Axis Top, Draw Predators Bar', id: pred_pred_bar_ytop, task: dataframe_column_max,
     skipif: {conditions: *deps}, partial: {df: "${{ workflow.pred_pred_bar_ytop_all.return }}", column_name: ytop}}
  - name: Draw Predators Bar
    id: pred_pred_bar
    task: draw_chart
    partial:
      x_axis: Predator
      figures:
      - metric: {display_name: Livestock killed, aggregator: sum, column: Livestock killed, decimal_places: 0}
        chart_type: bar
      time_interval: null
      category: Livestock species
      time_breakdown: null
      barmode: stack
      # Camel, Cattle, Donkey, Goat, Not recorded, Other, Several species, Sheep
      palette: &livestock_palette ['#e6ab02', '#1b7837', '#7f3b08', '#17becf', '#9e9e9e',
                                   '#c2a5cf', '#bf812d', '#5e3c99']
      plot_style: null
      layout_style:
        showlegend: true
        legend_title: Livestock killed
        xaxis: {title: Predator species}
        yaxis: {title: Livestock killed, range: [0, "${{ workflow.pred_pred_bar_ytop.return }}"]}
    mapvalues:
      argnames: dataframe
      argvalues: ${{ workflow.pred_predators.return }}
  - {name: Persist Predators Bar, id: pred_pred_html, task: persist_text,
     partial: {root_path: "${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}", filename_suffix: predators_bar},
     mapvalues: {argnames: text, argvalues: "${{ workflow.pred_pred_bar.return }}"}}
  - {name: Predators Bar Widget, id: pred_pred_w, task: create_plot_widget_single_view,
     skipif: {conditions: *never}, partial: {title: Livestock Killed by Predator and Livestock Type},
     map: {argnames: [view, data], argvalues: "${{ workflow.pred_pred_html.return }}"}}
  - {name: Merge Predators Bar Views, id: pred_pred_wm, task: merge_widget_views,
     partial: {widgets: "${{ workflow.pred_pred_w.return }}"}}

  # Inside / outside boma / not recorded -- the question the boma fields exist
  # to answer, and the one a manager acts on.
  - name: Where Attacks Happened
    id: pred_where
    task: apply_sql_query
    partial:
      query: |
        SELECT CASE
                 WHEN loc IS NULL OR TRIM(loc) = '' THEN 'Not recorded'
                 WHEN LOWER(loc) LIKE 'inside%'  THEN 'Inside boma'
                 WHEN LOWER(loc) LIKE 'outside%' THEN 'Outside boma'
                 ELSE 'Not applicable'
               END AS "Attack location",
               COUNT(*) AS "Attacks"
        FROM (
          SELECT COALESCE(json_extract(event_details, '$."Animals found inside or outside boma"'),
                          json_extract(event_details, '$."Animals found"')) AS loc
          FROM df WHERE event_type = 'hwc_livestock_predation'
        )
        GROUP BY 1 ORDER BY 2 DESC
      columns: null
      sanitize: true
    mapvalues:
      argnames: df
      argvalues: ${{ workflow.events_grouped.return }}
  # Fixed colours, Not recorded grey. The form's three answers are Inside boma,
  # Outside boma and N/A; the query folds them onto these four keys.
  - {name: Attack Location Colormap, id: pred_where_cmap, task: apply_color_map,
     partial: {input_column_name: Attack location, output_column_name: where_color,
               colormap: {Inside boma: '#4575b4', Outside boma: '#d73027',
                          Not applicable: '#fee090', Not recorded: *not_recorded}},
     mapvalues: {argnames: df, argvalues: "${{ workflow.pred_where.return }}"}}
  - {name: Draw Attack Location Pie, id: pred_where_pie, task: draw_pie_chart,
     partial: {value_column: Attacks, label_column: Attack location, color_column: where_color,
               plot_style: {textinfo: value+percent},
               layout_style: {showlegend: true, legend_title: Attack location}},
     mapvalues: {argnames: dataframe, argvalues: "${{ workflow.pred_where_cmap.return }}"}}
  - {name: Persist Attack Location Pie, id: pred_where_html, task: persist_text,
     partial: {root_path: "${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}", filename_suffix: attack_location_pie},
     mapvalues: {argnames: text, argvalues: "${{ workflow.pred_where_pie.return }}"}}
  - {name: Attack Location Pie Widget, id: pred_where_w, task: create_plot_widget_single_view,
     skipif: {conditions: *never}, partial: {title: Where Attacks Happened},
     map: {argnames: [view, data], argvalues: "${{ workflow.pred_where_html.return }}"}}
  - {name: Merge Attack Location Pie Views, id: pred_where_wm, task: merge_widget_views,
     partial: {widgets: "${{ workflow.pred_where_w.return }}"}}

  # FIG. 13 -- PREDATION EVENTS. Colour = predator, point size = livestock
  # killed, and since review 0.2 a legend for each.
  #
  # Review 0.2: "Is there any way we could add a size legend for livestock
  # killed?" draw_ecomap's legend draws colour swatches only -- it has no
  # notion of size -- so the sizes are made SAY-ABLE instead: three fixed bands
  # (0-1, 2-4, 5 or more killed) at three fixed radii, which a text legend can
  # name exactly. A continuous radius looked more precise but could not be
  # read back by anyone. Since review 0.3 the key shows the circles
  # themselves, drawn on the map (see SIZE KEY below).
  #
  # Colour: review 0.2 -- "Use a fixed species palette everywhere species
  # appear." The predator colours used to be the conflict-type hexes dealt out
  # by position, so Lion could be Livestock-predation indigo on this map and
  # something else next month. `species_colors` is a dict keyed by species and
  # shares no hex with any other palette in the report; species outside it are
  # drawn as "Other species", and "Unknown" is grey like every not-recorded
  # value. The SQL folds names onto those keys, because apply_color_map paints
  # an unlisted value fully transparent.
  - name: Predation Map View
    id: pred_map_view
    task: apply_sql_query
    partial:
      df: ${{ workflow.events_indexed.return }}
      query: |
        SELECT lon, lat - (80.0 / 2.0) / ppd AS lat,
               MIN(10.49, ln(ppd * 360.0 / 512.0) / ln(2.0)) AS zoom, ppd
        FROM (
          SELECT (x0 + x1) / 2.0 AS lon, (y0 + y1) / 2.0 AS lat,
                 MIN(880.0 / (x1 - x0), (440.0 - 80.0) / (y1 - y0)) AS ppd
          FROM (
            SELECT MAX(36.67738, MIN(36.85738, COALESCE(MIN(x), 36.85738)) - 0.018) AS x0,
                   MAX(0.25648, MIN(0.43648, COALESCE(MIN(y), 0.43648)) - 0.018) AS y0,
                   MIN(37.23089, MAX(37.05089, COALESCE(MAX(x), 37.05089)) + 0.018) AS x1,
                   MIN(0.74583, MAX(0.56583, COALESCE(MAX(y), 0.56583)) + 0.018) AS y1
            FROM (SELECT x, y FROM (SELECT CAST(substr(w, 1, instr(w, ' ') - 1) AS REAL) AS x, CAST(substr(w, instr(w, ' ') + 1) AS REAL) AS y FROM (SELECT TRIM(REPLACE(REPLACE(CAST(geometry AS TEXT), 'POINT (', ''), ')', '')) AS w FROM df WHERE event_type = 'hwc_livestock_predation' AND geometry IS NOT NULL)) WHERE x BETWEEN 36.67738 AND 37.23089 AND y BETWEEN 0.25648 AND 0.74583)
          )
        )
      columns: null
      sanitize: true
  - {name: Predation Map View Longitude, id: pred_map_lon, task: dataframe_column_max,
     partial: {df: "${{ workflow.pred_map_view.return }}", column_name: lon}}
  - {name: Predation Map View Latitude, id: pred_map_lat, task: dataframe_column_max,
     partial: {df: "${{ workflow.pred_map_view.return }}", column_name: lat}}
  - {name: Predation Map View Zoom, id: pred_map_zoom, task: dataframe_column_max,
     partial: {df: "${{ workflow.pred_map_view.return }}", column_name: zoom}}
  - name: Predation Map Reports Outside the Map
    id: pred_map_outside
    task: apply_sql_query
    partial:
      df: ${{ workflow.events_indexed.return }}
      query: |
        SELECT printf('%d %s fall%s outside the map area, more than about 20 km beyond the conservancy boundary.',
                      n, CASE WHEN n = 1 THEN 'report' ELSE 'reports' END, CASE WHEN n = 1 THEN 's' ELSE '' END) AS "Note"
        FROM (
          SELECT COUNT(*) AS n
          FROM (SELECT CAST(substr(w, 1, instr(w, ' ') - 1) AS REAL) AS x,
                       CAST(substr(w, instr(w, ' ') + 1) AS REAL) AS y
                FROM (SELECT TRIM(REPLACE(REPLACE(CAST(geometry AS TEXT), 'POINT (', ''), ')', '')) AS w
                      FROM df WHERE event_type = 'hwc_livestock_predation' AND geometry IS NOT NULL))
          WHERE x BETWEEN 33 AND 42 AND y BETWEEN -5 AND 5
          AND NOT (x BETWEEN 36.67738 AND 37.23089 AND y BETWEEN 0.25648 AND 0.74583)
        )
        WHERE n > 0
      columns: null
      sanitize: true
  - name: Predation Points
    id: pred_points
    task: apply_sql_query
    partial:
      query: |
        SELECT geometry, "Predator", "Livestock killed",
               CASE WHEN "Livestock killed" >= 5 THEN 17 WHEN "Livestock killed" >= 2 THEN 11 ELSE 6 END AS size_px,
               "Attack location", "Date"
        FROM (
          SELECT geometry,
                 CASE
                   WHEN species_h IS NULL OR species_h = 'Unknown' THEN 'Unknown'
                   WHEN LOWER(species_h) LIKE '%lion%'           THEN 'Lion'
                   WHEN LOWER(species_h) LIKE '%leopard%'        THEN 'Leopard'
                   WHEN LOWER(species_h) LIKE '%cheetah%'        THEN 'Cheetah'
                   WHEN LOWER(species_h) LIKE '%spotted hyena%'  THEN 'Spotted Hyena'
                   WHEN LOWER(species_h) LIKE '%striped hyena%'  THEN 'Striped Hyena'
                   WHEN LOWER(species_h) LIKE '%wild dog%'       THEN 'Wild Dog'
                   WHEN LOWER(species_h) LIKE '%jackal%'         THEN 'Jackal'
                   WHEN LOWER(species_h) LIKE '%baboon%'         THEN 'Olive Baboon'
                   WHEN LOWER(species_h) LIKE '%elephant%'       THEN 'Elephant'
                   WHEN LOWER(species_h) LIKE '%buffalo%'        THEN 'Buffalo'
                   ELSE 'Other species'
                 END AS "Predator",
                 CAST(COALESCE(CAST(json_extract(event_details, '$."Total livestock dead"') AS REAL), 0) AS INTEGER) AS "Livestock killed",
                 COALESCE(json_extract(event_details, '$."Animals found inside or outside boma"'),
                          json_extract(event_details, '$."Animals found"'), 'Not recorded') AS "Attack location",
                 substr(report_time, 1, 16) AS "Date"
          FROM df WHERE event_type = 'hwc_livestock_predation' AND geometry IS NOT NULL
        )
      columns: null
      sanitize: true
    mapvalues:
      argnames: df
      argvalues: ${{ workflow.events_grouped.return }}
  - {name: Predation Colormap, id: pred_cmap, task: apply_color_map,
     partial: {input_column_name: Predator, output_column_name: pred_color,
               colormap: &species_colors {
                 Buffalo: '#000000', Cheetah: '#ffd92f', Elephant: '#6a3d9a',
                 Jackal: '#b15928', Leopard: '#1f78b4', Lion: '#ff7f00',
                 Olive Baboon: '#fb9a99', Other species: '#cab2d6',
                 Spotted Hyena: '#e31a1c', Striped Hyena: '#33a02c',
                 Unknown: '#9e9e9e', Wild Dog: '#b2df8a'}},
     mapvalues: {argnames: df, argvalues: "${{ workflow.pred_points.return }}"}}

  # The radius is the band's pixel size, read straight off size_px:
  # radius_units pixels at radius_scale 1 draws exactly 6 / 11 / 17 px, which
  # is what the size legend promises. (pydantic still prints its cosmetic
  # get_radius serializer warning -- the column arrives as an ndarray, which
  # deck.gl consumes fine.)
  - name: Predation Layer
    id: pred_layer
    task: create_point_layer
    skipif:
      conditions: *geo
    partial:
      layer_style:
        get_radius: size_px
        radius_units: pixels
        radius_scale: 1.0
        fill_color_column: pred_color
        get_line_color: '#ffffff'
        stroked: true
        get_line_width: 1
        opacity: 0.85
      legend: {label_column: Predator, color_column: pred_color, title: Predator}
      tooltip_columns: [Predator, Livestock killed, Attack location, Date]
    mapvalues:
      argnames: geodataframe
      argvalues: ${{ workflow.pred_cmap.return }}
  # SIZE KEY. Review 0.3: "Fig. 13: are you able to make the size legend show
  # the actual circle sizes, each labelled with the value it stands for?"
  #
  # Yes, but not in the legend box: draw_ecomap's legend draws colour
  # swatches only. The key is drawn ON the map instead -- three real points
  # at the same pixel radii as the data (6 / 11 / 17 px), each labelled, on a
  # white panel -- in an 80 px strip the Predation Map View keeps free along
  # the bottom of the 440 px fit area, so it can never cover a report. Positions are
  # pixel offsets from the view centre, turned into degrees with the view's
  # own pixels-per-degree, so the key keeps its size and spacing at any zoom.
  # Ungrouped, from the whole period, and joined to every view as a static
  # layer, like the boundary.
  - name: Predation Size Key Panel
    id: pred_key_box
    task: apply_sql_query
    partial:
      df: ${{ workflow.events_indexed.return }}
      query: |
        SELECT printf('POLYGON ((%.6f %.6f, %.6f %.6f, %.6f %.6f, %.6f %.6f, %.6f %.6f))',
                      lon + -242.0 / ppd, lat + -212.0 / ppd, lon + 292.0 / ppd, lat + -212.0 / ppd,
                      lon + 292.0 / ppd, lat + -148.0 / ppd, lon + -242.0 / ppd, lat + -148.0 / ppd,
                      lon + -242.0 / ppd, lat + -212.0 / ppd) AS geometry
        FROM (
          SELECT lon, lat - (80.0 / 2.0) / ppd AS lat,
                 MIN(10.49, ln(ppd * 360.0 / 512.0) / ln(2.0)) AS zoom, ppd
          FROM (
            SELECT (x0 + x1) / 2.0 AS lon, (y0 + y1) / 2.0 AS lat,
                   MIN(880.0 / (x1 - x0), (440.0 - 80.0) / (y1 - y0)) AS ppd
            FROM (
              SELECT MAX(36.67738, MIN(36.85738, COALESCE(MIN(x), 36.85738)) - 0.018) AS x0,
                     MAX(0.25648, MIN(0.43648, COALESCE(MIN(y), 0.43648)) - 0.018) AS y0,
                     MIN(37.23089, MAX(37.05089, COALESCE(MAX(x), 37.05089)) + 0.018) AS x1,
                     MIN(0.74583, MAX(0.56583, COALESCE(MAX(y), 0.56583)) + 0.018) AS y1
              FROM (SELECT x, y FROM (SELECT CAST(substr(w, 1, instr(w, ' ') - 1) AS REAL) AS x, CAST(substr(w, instr(w, ' ') + 1) AS REAL) AS y FROM (SELECT TRIM(REPLACE(REPLACE(CAST(geometry AS TEXT), 'POINT (', ''), ')', '')) AS w FROM df WHERE event_type = 'hwc_livestock_predation' AND geometry IS NOT NULL)) WHERE x BETWEEN 36.67738 AND 37.23089 AND y BETWEEN 0.25648 AND 0.74583)
            )
          )
        )
      columns: null
      sanitize: true
  - name: Predation Size Key Circles
    id: pred_key_pts
    task: apply_sql_query
    partial:
      df: ${{ workflow.events_indexed.return }}
      query: |
        SELECT printf('POINT (%.6f %.6f)', v.lon + k.dx / v.ppd, v.lat + (-180.0) / v.ppd) AS geometry,
               k.size_px AS size_px
        FROM (SELECT -40 AS dx, 6 AS size_px UNION ALL SELECT 70 AS dx, 11 AS size_px UNION ALL SELECT 195 AS dx, 17 AS size_px) k
        CROSS JOIN (
          SELECT lon, lat - (80.0 / 2.0) / ppd AS lat,
                 MIN(10.49, ln(ppd * 360.0 / 512.0) / ln(2.0)) AS zoom, ppd
          FROM (
            SELECT (x0 + x1) / 2.0 AS lon, (y0 + y1) / 2.0 AS lat,
                   MIN(880.0 / (x1 - x0), (440.0 - 80.0) / (y1 - y0)) AS ppd
            FROM (
              SELECT MAX(36.67738, MIN(36.85738, COALESCE(MIN(x), 36.85738)) - 0.018) AS x0,
                     MAX(0.25648, MIN(0.43648, COALESCE(MIN(y), 0.43648)) - 0.018) AS y0,
                     MIN(37.23089, MAX(37.05089, COALESCE(MAX(x), 37.05089)) + 0.018) AS x1,
                     MIN(0.74583, MAX(0.56583, COALESCE(MAX(y), 0.56583)) + 0.018) AS y1
              FROM (SELECT x, y FROM (SELECT CAST(substr(w, 1, instr(w, ' ') - 1) AS REAL) AS x, CAST(substr(w, instr(w, ' ') + 1) AS REAL) AS y FROM (SELECT TRIM(REPLACE(REPLACE(CAST(geometry AS TEXT), 'POINT (', ''), ')', '')) AS w FROM df WHERE event_type = 'hwc_livestock_predation' AND geometry IS NOT NULL)) WHERE x BETWEEN 36.67738 AND 37.23089 AND y BETWEEN 0.25648 AND 0.74583)
            )
          )
        ) v
      columns: null
      sanitize: true
  - name: Predation Size Key Labels
    id: pred_key_lbl
    task: apply_sql_query
    partial:
      df: ${{ workflow.events_indexed.return }}
      query: |
        SELECT printf('POINT (%.6f %.6f)', v.lon + k.dx / v.ppd, v.lat + (-180.0) / v.ppd) AS geometry,
               k.label AS label
        FROM (SELECT -232 AS dx, 'Livestock killed:' AS label UNION ALL SELECT -28 AS dx, '0 or 1' AS label UNION ALL SELECT 87 AS dx, '2 to 4' AS label UNION ALL SELECT 218 AS dx, '5 or more' AS label) k
        CROSS JOIN (
          SELECT lon, lat - (80.0 / 2.0) / ppd AS lat,
                 MIN(10.49, ln(ppd * 360.0 / 512.0) / ln(2.0)) AS zoom, ppd
          FROM (
            SELECT (x0 + x1) / 2.0 AS lon, (y0 + y1) / 2.0 AS lat,
                   MIN(880.0 / (x1 - x0), (440.0 - 80.0) / (y1 - y0)) AS ppd
            FROM (
              SELECT MAX(36.67738, MIN(36.85738, COALESCE(MIN(x), 36.85738)) - 0.018) AS x0,
                     MAX(0.25648, MIN(0.43648, COALESCE(MIN(y), 0.43648)) - 0.018) AS y0,
                     MIN(37.23089, MAX(37.05089, COALESCE(MAX(x), 37.05089)) + 0.018) AS x1,
                     MIN(0.74583, MAX(0.56583, COALESCE(MAX(y), 0.56583)) + 0.018) AS y1
              FROM (SELECT x, y FROM (SELECT CAST(substr(w, 1, instr(w, ' ') - 1) AS REAL) AS x, CAST(substr(w, instr(w, ' ') + 1) AS REAL) AS y FROM (SELECT TRIM(REPLACE(REPLACE(CAST(geometry AS TEXT), 'POINT (', ''), ')', '')) AS w FROM df WHERE event_type = 'hwc_livestock_predation' AND geometry IS NOT NULL)) WHERE x BETWEEN 36.67738 AND 37.23089 AND y BETWEEN 0.25648 AND 0.74583)
            )
          )
        ) v
      columns: null
      sanitize: true
  - name: Predation Size Key Panel Layer
    id: pred_key_box_layer
    task: create_polygon_layer
    partial:
      geodataframe: ${{ workflow.pred_key_box.return }}
      layer_style:
        get_fill_color: '#ffffff'
        get_line_color: '#9e9e9e'
        get_line_width: 1
        stroked: true
        opacity: 0.9
        pickable: false
      legend: null
      tooltip_columns: []
  - name: Predation Size Key Circle Layer
    id: pred_key_pts_layer
    task: create_point_layer
    partial:
      geodataframe: ${{ workflow.pred_key_pts.return }}
      layer_style:
        get_radius: size_px
        radius_units: pixels
        radius_scale: 1.0
        get_fill_color: '#737373'
        get_line_color: '#ffffff'
        stroked: true
        get_line_width: 1
        opacity: 0.85
        pickable: false
      legend: null
      tooltip_columns: []
  - name: Predation Size Key Label Layer
    id: pred_key_lbl_layer
    task: create_text_layer
    partial:
      geodataframe: ${{ workflow.pred_key_lbl.return }}
      layer_style:
        get_text: label
        get_color: [33, 33, 33, 255]
        font_family: Helvetica, Arial, sans-serif
        font_weight: bold
        get_size: 12
        get_text_anchor: start
        get_alignment_baseline: center
        pickable: false
  - name: Predation Map Layers
    id: pred_map_layers
    task: combine_map_layers
    partial:
      static_layers:
      - ${{ workflow.boundary_layer.return }}
      - ${{ workflow.pred_key_box_layer.return }}
      - ${{ workflow.pred_key_pts_layer.return }}
      - ${{ workflow.pred_key_lbl_layer.return }}
    mapvalues:
      argnames: grouped_layers
      argvalues: ${{ workflow.pred_layer.return }}
  - name: Draw Predation Map
    id: pred_map
    task: draw_ecomap
    partial:
      tile_layers: ${{ workflow.base_map_defs.return }}
      static: false
      title: null
      north_arrow_style: {placement: top-left}
      legend_style: *map_legend
      # Review feedback: "Check zoom. Make sure it's not rendering grey tiles."
      # At 20 the auto-fitted view state zooms past the level the ArcGIS
      # basemaps actually serve tiles for over rural Laikipia, and a map with
      # one or two points -- which several of these are -- fits to exactly
      # that. 15 is inside tile coverage everywhere and still shows
      # individual bomas.
      max_zoom: 15
      view_state:
        longitude: ${{ workflow.pred_map_lon.return }}
        latitude: ${{ workflow.pred_map_lat.return }}
        zoom: ${{ workflow.pred_map_zoom.return }}
        pitch: 0
        bearing: 0
    mapvalues:
      argnames: geo_layers
      argvalues: ${{ workflow.pred_map_layers.return }}
  - {name: Persist Predation Map, id: pred_map_html, task: persist_text,
     partial: {root_path: "${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}", filename_suffix: predation_map},
     mapvalues: {argnames: text, argvalues: "${{ workflow.pred_map.return }}"}}
  - {name: Predation Map Widget, id: pred_map_w, task: create_map_widget_single_view,
     skipif: {conditions: *never}, partial: {title: "Predation Events"},
     map: {argnames: [view, data], argvalues: "${{ workflow.pred_map_html.return }}"}}
  - {name: Merge Predation Map Views, id: pred_map_wm, task: merge_widget_views,
     partial: {widgets: "${{ workflow.pred_map_w.return }}"}}

- title: Crop and Infrastructure Damage
  type: task-group
  description: What was damaged and how much of it, where the cause was wildlife.
  tasks:
  # MRD section "Crop / Infrastructure damage" asks for SEVEN outputs. The
  # review reordered them -- "Line chart: move it to be the first output" -- and
  # replaced the line with a stacked bar, so they now run:
  #   1 stacked bar     damage events per month, stacked crop / infrastructure
  #   2 horizontal bar  incidents per crop type
  #   3 stacked bar     extent of CROP damage, stacked by damage type
  #   4 stacked bar     incidents per tree type, stacked by number of trees
  #   5 stacked bar     property damage by property type and extent
  #   6 map             crop damage points
  #   7 map             infrastructure damage points
  # All seven are below, in that order.

  # 1 -- damage over time.
  #
  # Review feedback: "Line chart - I think we should swap this for a stacked bar
  # chart to show events over time. Months for x axis. Move it to be the first
  # output."
  #
  # Same month scaffold as the seasonality chart in section 2, for the same
  # reason: a month with no damage has to keep its slot on the axis rather than
  # vanish. GROUPED like every other figure, so with a Year grouper each year
  # gets its own chart; with no grouper there is one, spanning the whole range.
  - name: Damage Trend Frame
    id: dmg_trend_df
    task: apply_sql_query
    partial:
      query: |
        SELECT mon."Month" AS "Month",
               typ."Damage type" AS "Damage type",
               COALESCE(cnt.n, 0) AS "Events"
        FROM (
          SELECT ym, substr('​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​​', 1, n)
                 || CASE substr(ym, 6, 2) WHEN '01' THEN 'Jan' WHEN '02' THEN 'Feb' WHEN '03' THEN 'Mar'
                   WHEN '04' THEN 'Apr' WHEN '05' THEN 'May' WHEN '06' THEN 'Jun' WHEN '07' THEN 'Jul'
                   WHEN '08' THEN 'Aug' WHEN '09' THEN 'Sep' WHEN '10' THEN 'Oct' WHEN '11' THEN 'Nov'
                   ELSE 'Dec' END || ' ' || substr(ym, 1, 4) AS "Month"
          FROM (
          SELECT substr('000' || CAST((b.lo + s.n) / 12 AS TEXT), -4, 4) || '-' ||
                 substr('0' || CAST(((b.lo + s.n) % 12) + 1 AS TEXT), -2, 2) AS ym, s.n AS n
          FROM (
            SELECT MIN(CAST(substr(incident_time, 1, 4) AS INTEGER) * 12
                       + CAST(substr(incident_time, 6, 2) AS INTEGER) - 1) AS lo,
                   MAX(CAST(substr(incident_time, 1, 4) AS INTEGER) * 12
                       + CAST(substr(incident_time, 6, 2) AS INTEGER) - 1) AS hi
            FROM df WHERE incident_time IS NOT NULL
          ) b
          JOIN (SELECT ROW_NUMBER() OVER () - 1 AS n FROM df LIMIT 1200) s
            ON b.lo + s.n <= b.hi
          )
        ) mon
        CROSS JOIN (
                    SELECT 'Crop damage' AS "Damage type"
          UNION ALL SELECT 'Infrastructure damage'
        ) typ
        LEFT JOIN (
          SELECT substr(incident_time, 1, 7) AS mth,
                 conflict_type AS ct, COUNT(*) AS n
          FROM df
          WHERE is_conflict = 1 AND event_type IN ('crop_damage', 'infrastructure_damage')
          GROUP BY 1, 2
        ) cnt ON cnt.mth = mon.ym AND cnt.ct = typ."Damage type"
        WHERE EXISTS (SELECT 1 FROM df WHERE is_conflict = 1
                      AND event_type IN ('crop_damage', 'infrastructure_damage'))
        ORDER BY mon.ym, 2
      columns: null
      sanitize: true
    mapvalues:
      argnames: df
      argvalues: ${{ workflow.events_grouped.return }}
  - name: "Count Axis Top per View, Draw Damage Trend"
    id: dmg_trend_ytop_v
    task: apply_sql_query
    skipif:
      conditions: *deps
    partial:
      query: |
        SELECT MAX(5.0, COALESCE(MAX(t), 0)) * 1.15 AS ytop FROM (SELECT "Month" AS k, SUM("Events") AS t FROM df GROUP BY 1)
      columns: null
      sanitize: true
    mapvalues:
      argnames: df
      argvalues: ${{ workflow.dmg_trend_df.return }}
  - {name: 'Count Axis Top, All Views, Draw Damage Trend', id: dmg_trend_ytop_all, task: merge_df,
     skipif: {conditions: *deps, unpack_depth: 2}, partial: {iterables: "${{ workflow.dmg_trend_ytop_v.return }}"}}
  - {name: 'Count Axis Top, Draw Damage Trend', id: dmg_trend_ytop, task: dataframe_column_max,
     skipif: {conditions: *deps}, partial: {df: "${{ workflow.dmg_trend_ytop_all.return }}", column_name: ytop}}
  - name: Draw Damage Trend
    id: dmg_trend
    task: draw_chart
    partial:
      x_axis: Month
      figures:
      - metric: {display_name: Events, aggregator: sum, column: Events, decimal_places: 0}
        chart_type: bar
      time_interval: null
      category: Damage type
      time_breakdown: null
      barmode: stack
      # Crop damage then Infrastructure damage in sorted order -- the same two
      # colours those types carry in the section 2 chart and on both maps.
      palette: ['#b62879', '#ff803e']
      plot_style: null
      layout_style:
        showlegend: true
        legend_title: Damage type
        xaxis: {title: Month}
        yaxis: {title: Damage events, range: [0, "${{ workflow.dmg_trend_ytop.return }}"]}
    mapvalues:
      argnames: dataframe
      argvalues: ${{ workflow.dmg_trend_df.return }}
  - {name: Persist Damage Trend, id: dmg_trend_html, task: persist_text,
     partial: {root_path: "${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}", filename_suffix: damage_trend},
     mapvalues: {argnames: text, argvalues: "${{ workflow.dmg_trend.return }}"}}
  # skipif *never, like every other widget here, and it is NOT optional.
  #
  # Without it this inherits task-instance-defaults' [any_is_empty_df,
  # any_dependency_skipped], so on an empty period the widget itself skips and
  # returns a SkipSentinel -- which lands in gather_dashboard's widget list and
  # kills the whole run at response serialization:
  #     Unable to serialize unknown type: <class 'wt_task.skip.SkipSentinel'>
  # Forcing it to run gives a widget with null data, which is what a
  # placeholder is.
  - {name: Damage Trend Widget, id: dmg_trend_w, task: create_plot_widget_single_view,
     skipif: {conditions: *never},
     partial: {title: Crop and Infrastructure Damage over Time},
     map: {argnames: [view, data], argvalues: "${{ workflow.dmg_trend_html.return }}"}}
  - {name: Merge Damage Trend Views, id: dmg_trend_wm, task: merge_widget_views,
     partial: {widgets: "${{ workflow.dmg_trend_w.return }}"}}

  # 2 -- FIG. 16, crop damage by SPECIES RESPONSIBLE, stacked by crop.
  #
  # Review 0.2: "same approach as Fig. 12. Put species responsible on the
  # x-axis and stack the bars by crop type ... Suggested caption: 'Crop damage
  # incidents by species responsible and crop'." This replaces the one-bar-
  # per-crop chart, which also had no legend to speak of.
  #
  # Crop names keep their English half ("Cabbage / Kabichi" -> "Cabbage"), the
  # same rule species names follow. A report naming more than one crop is
  # stacked as "Several crops": the form records one extent per report, so it
  # cannot be split.
  #
  # The form offers 23 crops, so unlike livestock the crop list is NOT
  # scaffolded -- 23 legend rows of zeros would bury the one or two crops a
  # period actually has. Crops therefore take palette colours in sorted order
  # within each report. The exception is Not recorded, which must be grey:
  # it is ALWAYS present (at zero if need be) and carries a leading space, so
  # it sorts first and always takes the palette's first colour, grey.
  - name: Crop Damage by Species and Crop
    id: crop_by_crop
    task: apply_sql_query
    partial:
      query: |
        SELECT sp.s AS "Species responsible", cr.c AS "Crop",
               COALESCE(SUM(CASE WHEN d.c = cr.c AND d.s = sp.s THEN 1 ELSE 0 END), 0) AS "Incidents"
        FROM (
          SELECT species_h AS s, COUNT(*) AS total
          FROM df WHERE is_conflict = 1 AND event_type = 'crop_damage' GROUP BY 1
        ) sp
        CROSS JOIN (
          SELECT ' Not recorded' AS c
          UNION
          SELECT c FROM (
            SELECT CASE
                     WHEN tc IS NULL OR TRIM(tc) IN ('', '[]') THEN ' Not recorded'
                     WHEN json_valid(tc) = 1 AND json_type(tc) = 'array' AND json_array_length(tc) > 1 THEN 'Several crops'
                     WHEN json_valid(tc) = 1 AND json_type(tc) = 'array' THEN
                       TRIM(CASE WHEN INSTR(json_extract(tc, '$[0]'), ' / ') > 0
                                 THEN SUBSTR(json_extract(tc, '$[0]'), 1, INSTR(json_extract(tc, '$[0]'), ' / ') - 1)
                                 ELSE json_extract(tc, '$[0]') END)
                     ELSE TRIM(CASE WHEN INSTR(tc, ' / ') > 0 THEN SUBSTR(tc, 1, INSTR(tc, ' / ') - 1) ELSE tc END)
                   END AS c
            FROM (SELECT CAST(json_extract(event_details, '$."Type of crop"') AS TEXT) AS tc
                  FROM df WHERE is_conflict = 1 AND event_type = 'crop_damage')
          )
        ) cr
        LEFT JOIN (
          SELECT s, CASE
                     WHEN tc IS NULL OR TRIM(tc) IN ('', '[]') THEN ' Not recorded'
                     WHEN json_valid(tc) = 1 AND json_type(tc) = 'array' AND json_array_length(tc) > 1 THEN 'Several crops'
                     WHEN json_valid(tc) = 1 AND json_type(tc) = 'array' THEN
                       TRIM(CASE WHEN INSTR(json_extract(tc, '$[0]'), ' / ') > 0
                                 THEN SUBSTR(json_extract(tc, '$[0]'), 1, INSTR(json_extract(tc, '$[0]'), ' / ') - 1)
                                 ELSE json_extract(tc, '$[0]') END)
                     ELSE TRIM(CASE WHEN INSTR(tc, ' / ') > 0 THEN SUBSTR(tc, 1, INSTR(tc, ' / ') - 1) ELSE tc END)
                   END AS c
          FROM (SELECT species_h AS s, CAST(json_extract(event_details, '$."Type of crop"') AS TEXT) AS tc
                FROM df WHERE is_conflict = 1 AND event_type = 'crop_damage')
        ) d ON d.s = sp.s
        GROUP BY sp.s, cr.c
        ORDER BY MAX(sp.total) DESC, 1, 2
      columns: null
      sanitize: true
    mapvalues:
      argnames: df
      argvalues: ${{ workflow.events_grouped.return }}
  - name: "Count Axis Top per View, Draw Crop Bar"
    id: crop_bar_ytop_v
    task: apply_sql_query
    skipif:
      conditions: *deps
    partial:
      query: |
        SELECT MAX(5.0, COALESCE(MAX(t), 0)) * 1.15 AS ytop FROM (SELECT "Species responsible" AS k, SUM("Incidents") AS t FROM df GROUP BY 1)
      columns: null
      sanitize: true
    mapvalues:
      argnames: df
      argvalues: ${{ workflow.crop_by_crop.return }}
  - {name: 'Count Axis Top, All Views, Draw Crop Bar', id: crop_bar_ytop_all, task: merge_df,
     skipif: {conditions: *deps, unpack_depth: 2}, partial: {iterables: "${{ workflow.crop_bar_ytop_v.return }}"}}
  - {name: 'Count Axis Top, Draw Crop Bar', id: crop_bar_ytop, task: dataframe_column_max,
     skipif: {conditions: *deps}, partial: {df: "${{ workflow.crop_bar_ytop_all.return }}", column_name: ytop}}
  - name: Draw Crop Bar
    id: crop_bar
    task: draw_chart
    partial:
      x_axis: Species responsible
      figures:
      - metric: {display_name: Incidents, aggregator: sum, column: Incidents, decimal_places: 0}
        chart_type: bar
      time_interval: null
      category: Crop
      time_breakdown: null
      barmode: stack
      # Grey first (Not recorded always sorts first), then the crop palette --
      # greens and earth tones that no other chart in the report uses.
      palette: ['#9e9e9e', '#1a9850', '#fee08b', '#91cf60', '#8c510a', '#d9ef8b',
                '#bf812d', '#006837', '#dfc27d', '#66bd63', '#543005', '#a6d96a']
      plot_style: null
      layout_style:
        showlegend: true
        legend_title: Crop
        xaxis: {title: Species responsible}
        yaxis: {title: Crop damage incidents, range: [0, "${{ workflow.crop_bar_ytop.return }}"]}
    mapvalues:
      argnames: dataframe
      argvalues: ${{ workflow.crop_by_crop.return }}
  - {name: Persist Crop Bar, id: crop_bar_html, task: persist_text,
     partial: {root_path: "${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}", filename_suffix: crop_bar},
     mapvalues: {argnames: text, argvalues: "${{ workflow.crop_bar.return }}"}}
  - {name: Crop Bar Widget, id: crop_bar_w, task: create_plot_widget_single_view,
     skipif: {conditions: *never}, partial: {title: Crop Damage by Species Responsible and Crop},
     map: {argnames: [view, data], argvalues: "${{ workflow.crop_bar_html.return }}"}}
  - {name: Merge Crop Bar Views, id: crop_bar_wm, task: merge_widget_views,
     partial: {widgets: "${{ workflow.crop_bar_w.return }}"}}

  # 3 -- extent of CROP damage, stacked by damage type.
  #
  # THE BUG THE REVIEW FOUND: "This seems like it's pulling the wrong data. It
  # should just be the crop acre-bands but it also has the infrastructure
  # damage extents (which belongs in the property-type chart)."
  #
  # Correct. The WHERE read `event_type IN ('crop_damage',
  # 'infrastructure_damage')` while "Extent of damage" means different things
  # on the two forms -- acre bands (<1 / 1-5 / 5-10 / >10 acres) on Crop
  # damage, severity (Low / Medium / High) on Infrastructure damage. Both
  # vocabularies landed on one axis. Now restricted to crop_damage, which is
  # the only form the MRD's acre bands come from, and the severity bands show
  # only in output 5 below.
  #
  # The acre bands are an ORDERED scale, so the x axis is scaffolded to all
  # four in order rather than left to whatever the period contains -- a chart
  # that jumps from "<1 acre" to ">10 acres" misreads badly.
  #
  # The damage type comes from "Cause of Damage - Wildlife" (uprooting /
  # trampling / feeding-raiding), which is empty on every live record (0 of 9
  # crop_damage events on 9 Nov 2026), so today this renders as a placeholder.
  # LIKE, not =, because the field is a multi-select and a record can name more
  # than one cause.
  - name: Crop Damage Extent by Cause
    id: dmg_extent
    task: apply_sql_query
    partial:
      query: |
        SELECT e.label AS "Extent",
               c."Damage type" AS "Damage type",
               COALESCE(SUM(CASE WHEN d.ext IS NULL THEN 0
                 WHEN c."Damage type" = 'Uprooting'        AND LOWER(d.cause_txt) LIKE '%uproot%' THEN 1
                 WHEN c."Damage type" = 'Trampling'        AND LOWER(d.cause_txt) LIKE '%trampl%' THEN 1
                 WHEN c."Damage type" = 'Feeding / raiding'
                      AND (LOWER(d.cause_txt) LIKE '%feed%' OR LOWER(d.cause_txt) LIKE '%raid%')  THEN 1
                 WHEN c."Damage type" = 'Other'            AND LOWER(d.cause_txt) LIKE '%other%'   THEN 1
                 WHEN c."Damage type" = 'Not recorded'
                      AND (d.cause_txt IS NULL OR d.cause_txt = '')                               THEN 1
                 ELSE 0 END), 0) AS "Incidents"
        FROM (
                    SELECT '<1 acre' AS ext, '<1 acre' AS label
          UNION ALL SELECT '1-5 acres', '​1-5 acres'
          UNION ALL SELECT '5-10 acres', '​​5-10 acres'
          UNION ALL SELECT '>10 acres', '​​​>10 acres'
          UNION ALL SELECT 'Not recorded', '​​​​Not recorded'
        ) e
        CROSS JOIN (
                    SELECT 'Feeding / raiding' AS "Damage type"
          UNION ALL SELECT 'Not recorded'
          UNION ALL SELECT 'Other'
          UNION ALL SELECT 'Trampling'
          UNION ALL SELECT 'Uprooting'
        ) c
        LEFT JOIN (
          SELECT COALESCE(json_extract(event_details, '$."Extent of damage"'), 'Not recorded') AS ext,
                 NULLIF(TRIM(REPLACE(REPLACE(REPLACE(REPLACE(
                   CAST(json_extract(event_details, '$."Cause of Damage - Wildlife"') AS TEXT),
                   '","', ', '), '["', ''), '"]', ''), '[]', '')), '') AS cause_txt
          FROM df WHERE is_conflict = 1 AND event_type = 'crop_damage'
        ) d ON d.ext = e.ext
        WHERE EXISTS (SELECT 1 FROM df WHERE is_conflict = 1 AND event_type = 'crop_damage')
        GROUP BY 1, 2
        ORDER BY 1, 2
      columns: null
      sanitize: true
    mapvalues:
      argnames: df
      argvalues: ${{ workflow.events_grouped.return }}
  - name: "Count Axis Top per View, Draw Damage Extent Bar"
    id: dmg_extent_bar_ytop_v
    task: apply_sql_query
    skipif:
      conditions: *deps
    partial:
      query: |
        SELECT MAX(5.0, COALESCE(MAX(t), 0)) * 1.15 AS ytop FROM (SELECT "Extent" AS k, SUM("Incidents") AS t FROM df GROUP BY 1)
      columns: null
      sanitize: true
    mapvalues:
      argnames: df
      argvalues: ${{ workflow.dmg_extent.return }}
  - {name: 'Count Axis Top, All Views, Draw Damage Extent Bar', id: dmg_extent_bar_ytop_all, task: merge_df,
     skipif: {conditions: *deps, unpack_depth: 2}, partial: {iterables: "${{ workflow.dmg_extent_bar_ytop_v.return }}"}}
  - {name: 'Count Axis Top, Draw Damage Extent Bar', id: dmg_extent_bar_ytop, task: dataframe_column_max,
     skipif: {conditions: *deps}, partial: {df: "${{ workflow.dmg_extent_bar_ytop_all.return }}", column_name: ytop}}
  - name: Draw Damage Extent Bar
    id: dmg_extent_bar
    task: draw_chart
    partial:
      x_axis: Extent
      figures:
      - metric: {display_name: Incidents, aggregator: sum, column: Incidents, decimal_places: 0}
        chart_type: bar
      time_interval: null
      category: Damage type
      time_breakdown: null
      barmode: stack
      # Sorted: Feeding / raiding, Not recorded, Other, Trampling, Uprooting.
      # Review 0.2: "Create a new palette for crop damage type." The old one
      # borrowed the Infrastructure-damage orange and the Livestock-predation
      # indigo; these five appear nowhere else, Not recorded grey included.
      palette: ['#66c2a5', '#9e9e9e', '#e5c494', '#8da0cb', '#a6d854']
      plot_style: null
      layout_style:
        showlegend: true
        legend_title: Damage type
        xaxis: {title: Extent of damage}
        yaxis: {title: Crop damage incidents, range: [0, "${{ workflow.dmg_extent_bar_ytop.return }}"]}
    mapvalues:
      argnames: dataframe
      argvalues: ${{ workflow.dmg_extent.return }}
  - {name: Persist Damage Extent Bar, id: dmg_extent_html, task: persist_text,
     partial: {root_path: "${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}", filename_suffix: damage_extent_bar},
     mapvalues: {argnames: text, argvalues: "${{ workflow.dmg_extent_bar.return }}"}}
  - {name: Damage Extent Bar Widget, id: dmg_extent_w, task: create_plot_widget_single_view,
     skipif: {conditions: *never}, partial: {title: Crop Damage Extent by Damage Type},
     map: {argnames: [view, data], argvalues: "${{ workflow.dmg_extent_html.return }}"}}
  - {name: Merge Damage Extent Bar Views, id: dmg_extent_wm, task: merge_widget_views,
     partial: {widgets: "${{ workflow.dmg_extent_w.return }}"}}

  # 3 -- incidents per tree type, stacked by number of trees.
  #
  # Both source fields -- "Type of tree crop" and "Extent of damage (no trees)"
  # -- are empty on every live crop_damage record. Same reasoning as above: the
  # MRD asks for it, so it is built and renders empty rather than being dropped.
  - name: Tree Crop Damage
    id: tree_by_type
    task: apply_sql_query
    partial:
      query: |
        SELECT COALESCE(NULLIF(TRIM(REPLACE(REPLACE(REPLACE(REPLACE(
                 CAST(json_extract(event_details, '$."Type of tree crop"') AS TEXT),
                 '","', ', '), '["', ''), '"]', ''), '[]', '')), ''), 'Not recorded') AS "Tree crop",
               COUNT(*) AS "Incidents",
               CAST(COALESCE(SUM(CAST(COALESCE(json_extract(event_details, '$."Extent of damage (no trees)"'), 0) AS REAL)), 0) AS INTEGER) AS "Trees damaged"
        FROM df WHERE is_conflict = 1 AND event_type = 'crop_damage'
          AND json_extract(event_details, '$."Type of tree crop"') IS NOT NULL
        GROUP BY 1 ORDER BY 3 DESC, 2 DESC
      columns: null
      sanitize: true
    mapvalues:
      argnames: df
      argvalues: ${{ workflow.events_grouped.return }}
  - name: "Count Axis Top per View, Draw Tree Crop Bar"
    id: tree_bar_ytop_v
    task: apply_sql_query
    skipif:
      conditions: *deps
    partial:
      query: |
        SELECT MAX(5.0, COALESCE(MAX(t), 0)) * 1.15 AS ytop FROM (SELECT "Tree crop" AS k, MAX(SUM("Incidents"), SUM("Trees damaged")) AS t FROM df GROUP BY 1)
      columns: null
      sanitize: true
    mapvalues:
      argnames: df
      argvalues: ${{ workflow.tree_by_type.return }}
  - {name: 'Count Axis Top, All Views, Draw Tree Crop Bar', id: tree_bar_ytop_all, task: merge_df,
     skipif: {conditions: *deps, unpack_depth: 2}, partial: {iterables: "${{ workflow.tree_bar_ytop_v.return }}"}}
  - {name: 'Count Axis Top, Draw Tree Crop Bar', id: tree_bar_ytop, task: dataframe_column_max,
     skipif: {conditions: *deps}, partial: {df: "${{ workflow.tree_bar_ytop_all.return }}", column_name: ytop}}
  - name: Draw Tree Crop Bar
    id: tree_bar
    task: draw_bar_chart
    partial:
      category: Tree crop
      bar_chart_configs:
      - {label: Incidents,     column: Incidents,     agg_func: sum, show_label: true, style: {marker_color: '#01665e'}}
      - {label: Trees damaged, column: Trees damaged, agg_func: sum, show_label: true, style: {marker_color: '#80cdc1'}}
      # Grouped, not stacked, and deliberately so: incidents and trees damaged
      # are different units, and stacking them would draw a total that means
      # nothing. The dead `barmode: stack` that used to sit here never took
      # effect anyway.
      layout_kwargs:
        showlegend: true
        legend_title: Measure
        xaxis: {title: Type of tree crop}
        yaxis: {title: Count, range: [0, "${{ workflow.tree_bar_ytop.return }}"]}
    mapvalues:
      argnames: dataframe
      argvalues: ${{ workflow.tree_by_type.return }}
  - {name: Persist Tree Crop Bar, id: tree_bar_html, task: persist_text,
     partial: {root_path: "${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}", filename_suffix: tree_crop_bar},
     mapvalues: {argnames: text, argvalues: "${{ workflow.tree_bar.return }}"}}
  - {name: Tree Crop Bar Widget, id: tree_bar_w, task: create_plot_widget_single_view,
     skipif: {conditions: *never}, partial: {title: Tree Crop Damage by Tree Type},
     map: {argnames: [view, data], argvalues: "${{ workflow.tree_bar_html.return }}"}}
  - {name: Merge Tree Crop Bar Views, id: tree_bar_wm, task: merge_widget_views,
     partial: {widgets: "${{ workflow.tree_bar_w.return }}"}}

  # 4 -- property damage by property type, stacked by extent band.
  #
  # ONE ROW PER COMBINATION, not per property -- a known limitation. Type of
  # Property is a multi-select and 4 of the 6 live records name more than one
  # thing, so "Water Pipes, Water Tank" is its own category and a reader cannot
  # total water tanks alone. json_each would fix it and apply_sql_query's own
  # source lists it as readable, but opening the virtual table trips
  # SQLITE_UPDATE on sqlite_master, which the deny-by-default authorizer
  # rejects: "vtable constructor failed: json_each". A recursive CTE is the
  # other route and validate_sql_query refuses anything not starting with
  # SELECT. The report states the limitation rather than letting a reader
  # assume otherwise.
  - name: Infrastructure Damage by Property
    id: infra_by_type
    task: apply_sql_query
    partial:
      query: |
        SELECT p."Property" AS "Property",
               x.label AS "Extent",
               COALESCE(SUM(CASE WHEN d.prop IS NULL THEN 0
                                 WHEN d.ext = x.ext THEN 1 ELSE 0 END), 0) AS "Incidents"
        FROM (
          SELECT COALESCE(NULLIF(TRIM(REPLACE(REPLACE(REPLACE(REPLACE(
                   CAST(json_extract(event_details, '$."Type of Property"') AS TEXT),
                   '","', ', '), '["', ''), '"]', ''), '[]', '')), ''), 'Not recorded') AS "Property",
                 COUNT(*) AS total
          FROM df WHERE is_conflict = 1 AND event_type = 'infrastructure_damage'
          GROUP BY 1
        ) p
        CROSS JOIN (
                    SELECT 'Low' AS ext, 'Low' AS label
          UNION ALL SELECT 'Medium', '​Medium'
          UNION ALL SELECT 'High', '​​High'
          UNION ALL SELECT 'Not recorded', '​​​Not recorded'
        ) x
        LEFT JOIN (
          SELECT COALESCE(NULLIF(TRIM(REPLACE(REPLACE(REPLACE(REPLACE(
                   CAST(json_extract(event_details, '$."Type of Property"') AS TEXT),
                   '","', ', '), '["', ''), '"]', ''), '[]', '')), ''), 'Not recorded') AS prop,
                 COALESCE(json_extract(event_details, '$."Extent of damage"'), 'Not recorded') AS ext
          FROM df WHERE is_conflict = 1 AND event_type = 'infrastructure_damage'
        ) d ON d.prop = p."Property"
        GROUP BY 1, 2
        ORDER BY p.total DESC, 1, 2
      columns: null
      sanitize: true
    mapvalues:
      argnames: df
      argvalues: ${{ workflow.events_grouped.return }}
  # STACKED, and retitled. Review feedback, section 9: "Bar graph -
  # Infrastructure damage by property type: make this stacked please. Change
  # chart caption to say 'Infrastructure damage by property type and damage
  # extent'."
  #
  # Low / Medium / High is an ordered severity scale, so the series labels
  # carry a sort prefix: draw_chart orders its series with sorted(), which
  # would otherwise stack High, Low, Medium alphabetically and make the
  # gradient meaningless. The prefix is now invisible -- 0 to 3 zero-width
  # spaces (U+200B), fewer sorting first -- instead of the "1. ", "2. " that
  # showed in the legend; the crop extent axis (Fig. 17) does the same.
  - name: "Count Axis Top per View, Draw Infrastructure Damage Bar"
    id: infra_bar_ytop_v
    task: apply_sql_query
    skipif:
      conditions: *deps
    partial:
      query: |
        SELECT MAX(5.0, COALESCE(MAX(t), 0)) * 1.15 AS ytop FROM (SELECT "Property" AS k, SUM("Incidents") AS t FROM df GROUP BY 1)
      columns: null
      sanitize: true
    mapvalues:
      argnames: df
      argvalues: ${{ workflow.infra_by_type.return }}
  - {name: 'Count Axis Top, All Views, Draw Infrastructure Damage Bar', id: infra_bar_ytop_all, task: merge_df,
     skipif: {conditions: *deps, unpack_depth: 2}, partial: {iterables: "${{ workflow.infra_bar_ytop_v.return }}"}}
  - {name: 'Count Axis Top, Draw Infrastructure Damage Bar', id: infra_bar_ytop, task: dataframe_column_max,
     skipif: {conditions: *deps}, partial: {df: "${{ workflow.infra_bar_ytop_all.return }}", column_name: ytop}}
  - name: Draw Infrastructure Damage Bar
    id: infra_bar
    task: draw_chart
    partial:
      x_axis: Property
      figures:
      - metric: {display_name: Incidents, aggregator: sum, column: Incidents, decimal_places: 0}
        chart_type: bar
      time_interval: null
      category: Extent
      time_breakdown: null
      barmode: stack
      # Review 0.2: "Infrastructure extent: use a light-to-dark ramp of the
      # infrastructure orange from the conflict palette, since extent is
      # ordered (low -> high)." Low, Medium, High step from pale to deep around
      # the conflict palette's #ff803e; Not recorded is grey. The old set
      # borrowed Human death's dark red for High.
      palette: ['#ffd9bf', '#ff9f5e', '#c2560f', '#9e9e9e']
      plot_style: null
      layout_style:
        showlegend: true
        legend_title: Extent of damage
        xaxis: {title: Type of property}
        yaxis: {title: Infrastructure damage incidents, range: [0, "${{ workflow.infra_bar_ytop.return }}"]}
    mapvalues:
      argnames: dataframe
      argvalues: ${{ workflow.infra_by_type.return }}
  - {name: Persist Infrastructure Damage Bar, id: infra_bar_html, task: persist_text,
     partial: {root_path: "${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}", filename_suffix: infrastructure_bar},
     mapvalues: {argnames: text, argvalues: "${{ workflow.infra_bar.return }}"}}
  - {name: Infrastructure Damage Bar Widget, id: infra_bar_w, task: create_plot_widget_single_view,
     skipif: {conditions: *never},
     partial: {title: "Infrastructure Damage by Property Type and Damage Extent"},
     map: {argnames: [view, data], argvalues: "${{ workflow.infra_bar_html.return }}"}}
  - {name: Merge Infrastructure Damage Bar Views, id: infra_bar_wm, task: merge_widget_views,
     partial: {widgets: "${{ workflow.infra_bar_w.return }}"}}

  # 6 and 7 -- FIGS. 20 AND 21, one map each, as the MRD asks.
  #
  # Review 0.3: "Figs 20 and 21: I think we should change to plain point
  # maps, one point per report, coloured by extent of damage (crop acre bands
  # / infrastructure low-high ramp, 'Not recorded' in grey). Drop the
  # 'reports within ~100 m drawn as one larger point' sizing."
  #
  # One row per report, one fixed point size, no size key. The colours are
  # unchanged: crop the pink ramp by acre band, infrastructure the orange
  # ramp of Fig. 19, Not recorded grey. Two reports at the same place (the 27
  # Sep / 26 Oct water-pipe reports, ~10 m apart) draw one on top of the
  # other again; hovering shows the top one.
  - name: Crop Damage Map View
    id: crop_map_view
    task: apply_sql_query
    partial:
      df: ${{ workflow.events_indexed.return }}
      query: |
        SELECT lon, lat - (0.0 / 2.0) / ppd AS lat,
               MIN(10.49, ln(ppd * 360.0 / 512.0) / ln(2.0)) AS zoom, ppd
        FROM (
          SELECT (x0 + x1) / 2.0 AS lon, (y0 + y1) / 2.0 AS lat,
                 MIN(880.0 / (x1 - x0), (440.0 - 0.0) / (y1 - y0)) AS ppd
          FROM (
            SELECT MAX(36.67738, MIN(36.85738, COALESCE(MIN(x), 36.85738)) - 0.018) AS x0,
                   MAX(0.25648, MIN(0.43648, COALESCE(MIN(y), 0.43648)) - 0.018) AS y0,
                   MIN(37.23089, MAX(37.05089, COALESCE(MAX(x), 37.05089)) + 0.018) AS x1,
                   MIN(0.74583, MAX(0.56583, COALESCE(MAX(y), 0.56583)) + 0.018) AS y1
            FROM (SELECT x, y FROM (SELECT CAST(substr(w, 1, instr(w, ' ') - 1) AS REAL) AS x, CAST(substr(w, instr(w, ' ') + 1) AS REAL) AS y FROM (SELECT TRIM(REPLACE(REPLACE(CAST(geometry AS TEXT), 'POINT (', ''), ')', '')) AS w FROM df WHERE is_conflict = 1 AND event_type = 'crop_damage' AND geometry IS NOT NULL)) WHERE x BETWEEN 36.67738 AND 37.23089 AND y BETWEEN 0.25648 AND 0.74583)
          )
        )
      columns: null
      sanitize: true
  - {name: Crop Damage Map View Longitude, id: crop_map_lon, task: dataframe_column_max,
     partial: {df: "${{ workflow.crop_map_view.return }}", column_name: lon}}
  - {name: Crop Damage Map View Latitude, id: crop_map_lat, task: dataframe_column_max,
     partial: {df: "${{ workflow.crop_map_view.return }}", column_name: lat}}
  - {name: Crop Damage Map View Zoom, id: crop_map_zoom, task: dataframe_column_max,
     partial: {df: "${{ workflow.crop_map_view.return }}", column_name: zoom}}
  - name: Crop Damage Map Reports Outside the Map
    id: crop_map_outside
    task: apply_sql_query
    partial:
      df: ${{ workflow.events_indexed.return }}
      query: |
        SELECT printf('%d %s fall%s outside the map area, more than about 20 km beyond the conservancy boundary.',
                      n, CASE WHEN n = 1 THEN 'report' ELSE 'reports' END, CASE WHEN n = 1 THEN 's' ELSE '' END) AS "Note"
        FROM (
          SELECT COUNT(*) AS n
          FROM (SELECT CAST(substr(w, 1, instr(w, ' ') - 1) AS REAL) AS x,
                       CAST(substr(w, instr(w, ' ') + 1) AS REAL) AS y
                FROM (SELECT TRIM(REPLACE(REPLACE(CAST(geometry AS TEXT), 'POINT (', ''), ')', '')) AS w
                      FROM df WHERE is_conflict = 1 AND event_type = 'crop_damage' AND geometry IS NOT NULL))
          WHERE x BETWEEN 33 AND 42 AND y BETWEEN -5 AND 5
          AND NOT (x BETWEEN 36.67738 AND 37.23089 AND y BETWEEN 0.25648 AND 0.74583)
        )
        WHERE n > 0
      columns: null
      sanitize: true
  - name: Crop Damage Points
    id: crop_points
    task: apply_sql_query
    partial:
      query: |
        SELECT geometry,
               CASE WHEN ext IS NULL OR TRIM(ext) = '' THEN 'Not recorded'
                    WHEN ext LIKE '%<%' THEN '<1 acre'
                    WHEN ext LIKE '1%5%' THEN '1-5 acres'
                    WHEN ext LIKE '5%10%' THEN '5-10 acres'
                    WHEN ext LIKE '%>%' THEN '>10 acres'
                    ELSE 'Not recorded' END AS "Extent",
               item AS "Crop", sp AS "Species responsible", dt AS "Date"
        FROM (
          SELECT geometry, species_h AS sp, substr(report_time, 1, 10) AS dt,
                 json_extract(event_details, '$."Extent of damage"') AS ext,
                 COALESCE(NULLIF(TRIM(REPLACE(REPLACE(REPLACE(REPLACE(
                   CAST(json_extract(event_details, '$."Type of crop"') AS TEXT),
                   '","', ', '), '["', ''), '"]', ''), '[]', '')), ''), 'Not recorded') AS item
          FROM df
          WHERE is_conflict = 1 AND event_type = 'crop_damage' AND geometry IS NOT NULL
        )
      columns: null
      sanitize: true
    mapvalues:
      argnames: df
      argvalues: ${{ workflow.events_grouped.return }}
  - {name: Crop Damage Colormap, id: crop_cmap, task: apply_color_map,
     partial: {input_column_name: Extent, output_column_name: crop_color,
               colormap: {'<1 acre': '#f3c6df', '1-5 acres': '#e07bb3', '5-10 acres': '#b62879',
                          '>10 acres': '#6b1446', Not recorded: *not_recorded}},
     mapvalues: {argnames: df, argvalues: "${{ workflow.crop_points.return }}"}}
  - name: Crop Damage Layer
    id: crop_layer
    task: create_point_layer
    skipif:
      conditions: *geo
    partial:
      layer_style:
        get_radius: 7.0
        radius_units: pixels
        fill_color_column: crop_color
        get_line_color: '#ffffff'
        stroked: true
        get_line_width: 1
        opacity: 0.9
      legend: {label_column: Extent, color_column: crop_color, title: Extent of damage}
      tooltip_columns: [Crop, Extent, Species responsible, Date]
    mapvalues:
      argnames: geodataframe
      argvalues: ${{ workflow.crop_cmap.return }}
  - name: Crop Damage Map Layers
    id: crop_map_layers
    task: combine_map_layers
    partial:
      static_layers: ${{ workflow.boundary_layer.return }}
    mapvalues:
      argnames: grouped_layers
      argvalues: ${{ workflow.crop_layer.return }}
  - name: Draw Crop Damage Map
    id: crop_map
    task: draw_ecomap
    partial:
      tile_layers: ${{ workflow.base_map_defs.return }}
      static: false
      title: null
      north_arrow_style: {placement: top-left}
      legend_style: *map_legend
      max_zoom: 15
      view_state:
        longitude: ${{ workflow.crop_map_lon.return }}
        latitude: ${{ workflow.crop_map_lat.return }}
        zoom: ${{ workflow.crop_map_zoom.return }}
        pitch: 0
        bearing: 0
    mapvalues:
      argnames: geo_layers
      argvalues: ${{ workflow.crop_map_layers.return }}
  - {name: Persist Crop Damage Map, id: crop_map_html, task: persist_text,
     partial: {root_path: "${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}", filename_suffix: crop_damage_map},
     mapvalues: {argnames: text, argvalues: "${{ workflow.crop_map.return }}"}}
  - {name: Crop Damage Map Widget, id: crop_map_w, task: create_map_widget_single_view,
     skipif: {conditions: *never}, partial: {title: Crop Damage Locations},
     map: {argnames: [view, data], argvalues: "${{ workflow.crop_map_html.return }}"}}
  - {name: Merge Crop Damage Map Views, id: crop_map_wm, task: merge_widget_views,
     partial: {widgets: "${{ workflow.crop_map_w.return }}"}}

  - name: Infrastructure Damage Map View
    id: infra_map_view
    task: apply_sql_query
    partial:
      df: ${{ workflow.events_indexed.return }}
      query: |
        SELECT lon, lat - (0.0 / 2.0) / ppd AS lat,
               MIN(10.49, ln(ppd * 360.0 / 512.0) / ln(2.0)) AS zoom, ppd
        FROM (
          SELECT (x0 + x1) / 2.0 AS lon, (y0 + y1) / 2.0 AS lat,
                 MIN(880.0 / (x1 - x0), (440.0 - 0.0) / (y1 - y0)) AS ppd
          FROM (
            SELECT MAX(36.67738, MIN(36.85738, COALESCE(MIN(x), 36.85738)) - 0.018) AS x0,
                   MAX(0.25648, MIN(0.43648, COALESCE(MIN(y), 0.43648)) - 0.018) AS y0,
                   MIN(37.23089, MAX(37.05089, COALESCE(MAX(x), 37.05089)) + 0.018) AS x1,
                   MIN(0.74583, MAX(0.56583, COALESCE(MAX(y), 0.56583)) + 0.018) AS y1
            FROM (SELECT x, y FROM (SELECT CAST(substr(w, 1, instr(w, ' ') - 1) AS REAL) AS x, CAST(substr(w, instr(w, ' ') + 1) AS REAL) AS y FROM (SELECT TRIM(REPLACE(REPLACE(CAST(geometry AS TEXT), 'POINT (', ''), ')', '')) AS w FROM df WHERE is_conflict = 1 AND event_type = 'infrastructure_damage' AND geometry IS NOT NULL)) WHERE x BETWEEN 36.67738 AND 37.23089 AND y BETWEEN 0.25648 AND 0.74583)
          )
        )
      columns: null
      sanitize: true
  - {name: Infrastructure Damage Map View Longitude, id: infra_map_lon, task: dataframe_column_max,
     partial: {df: "${{ workflow.infra_map_view.return }}", column_name: lon}}
  - {name: Infrastructure Damage Map View Latitude, id: infra_map_lat, task: dataframe_column_max,
     partial: {df: "${{ workflow.infra_map_view.return }}", column_name: lat}}
  - {name: Infrastructure Damage Map View Zoom, id: infra_map_zoom, task: dataframe_column_max,
     partial: {df: "${{ workflow.infra_map_view.return }}", column_name: zoom}}
  - name: Infrastructure Damage Map Reports Outside the Map
    id: infra_map_outside
    task: apply_sql_query
    partial:
      df: ${{ workflow.events_indexed.return }}
      query: |
        SELECT printf('%d %s fall%s outside the map area, more than about 20 km beyond the conservancy boundary.',
                      n, CASE WHEN n = 1 THEN 'report' ELSE 'reports' END, CASE WHEN n = 1 THEN 's' ELSE '' END) AS "Note"
        FROM (
          SELECT COUNT(*) AS n
          FROM (SELECT CAST(substr(w, 1, instr(w, ' ') - 1) AS REAL) AS x,
                       CAST(substr(w, instr(w, ' ') + 1) AS REAL) AS y
                FROM (SELECT TRIM(REPLACE(REPLACE(CAST(geometry AS TEXT), 'POINT (', ''), ')', '')) AS w
                      FROM df WHERE is_conflict = 1 AND event_type = 'infrastructure_damage' AND geometry IS NOT NULL))
          WHERE x BETWEEN 33 AND 42 AND y BETWEEN -5 AND 5
          AND NOT (x BETWEEN 36.67738 AND 37.23089 AND y BETWEEN 0.25648 AND 0.74583)
        )
        WHERE n > 0
      columns: null
      sanitize: true
  - name: Infrastructure Damage Points
    id: infra_points
    task: apply_sql_query
    partial:
      query: |
        SELECT geometry,
               CASE WHEN ext IS NULL OR TRIM(ext) = '' THEN 'Not recorded'
                    WHEN LOWER(ext) LIKE 'low%' THEN 'Low'
                    WHEN LOWER(ext) LIKE 'med%' THEN 'Medium'
                    WHEN LOWER(ext) LIKE 'high%' THEN 'High'
                    ELSE 'Not recorded' END AS "Extent",
               item AS "Property", sp AS "Species responsible", dt AS "Date"
        FROM (
          SELECT geometry, species_h AS sp, substr(report_time, 1, 10) AS dt,
                 json_extract(event_details, '$."Extent of damage"') AS ext,
                 COALESCE(NULLIF(TRIM(REPLACE(REPLACE(REPLACE(REPLACE(
                   CAST(json_extract(event_details, '$."Type of Property"') AS TEXT),
                   '","', ', '), '["', ''), '"]', ''), '[]', '')), ''), 'Not recorded') AS item
          FROM df
          WHERE is_conflict = 1 AND event_type = 'infrastructure_damage' AND geometry IS NOT NULL
        )
      columns: null
      sanitize: true
    mapvalues:
      argnames: df
      argvalues: ${{ workflow.events_grouped.return }}
  - {name: Infrastructure Damage Colormap, id: infra_cmap, task: apply_color_map,
     partial: {input_column_name: Extent, output_column_name: infra_color,
               colormap: {Low: '#ffd9bf', Medium: '#ff9f5e', High: '#c2560f', Not recorded: *not_recorded}},
     mapvalues: {argnames: df, argvalues: "${{ workflow.infra_points.return }}"}}
  - name: Infrastructure Damage Layer
    id: infra_layer
    task: create_point_layer
    skipif:
      conditions: *geo
    partial:
      layer_style:
        get_radius: 7.0
        radius_units: pixels
        fill_color_column: infra_color
        get_line_color: '#ffffff'
        stroked: true
        get_line_width: 1
        opacity: 0.9
      legend: {label_column: Extent, color_column: infra_color, title: Extent of damage}
      tooltip_columns: [Property, Extent, Species responsible, Date]
    mapvalues:
      argnames: geodataframe
      argvalues: ${{ workflow.infra_cmap.return }}
  - name: Infrastructure Damage Map Layers
    id: infra_map_layers
    task: combine_map_layers
    partial:
      static_layers: ${{ workflow.boundary_layer.return }}
    mapvalues:
      argnames: grouped_layers
      argvalues: ${{ workflow.infra_layer.return }}
  - name: Draw Infrastructure Damage Map
    id: infra_map
    task: draw_ecomap
    partial:
      tile_layers: ${{ workflow.base_map_defs.return }}
      static: false
      title: null
      north_arrow_style: {placement: top-left}
      legend_style: *map_legend
      max_zoom: 15
      view_state:
        longitude: ${{ workflow.infra_map_lon.return }}
        latitude: ${{ workflow.infra_map_lat.return }}
        zoom: ${{ workflow.infra_map_zoom.return }}
        pitch: 0
        bearing: 0
    mapvalues:
      argnames: geo_layers
      argvalues: ${{ workflow.infra_map_layers.return }}
  - {name: Persist Infrastructure Damage Map, id: infra_map_html, task: persist_text,
