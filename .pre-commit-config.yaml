# Generated output is excluded from every hook.
# ecoscope-workflows-*-workflow/ is emitted by wt-compiler, and CI's
# _recompile.yml recompiles it and diffs byte for byte -- so any hook that
# rewrites those files breaks the build. end-of-file-fixer stripped the
# trailing newline from dags/__init__.py and CI failed on a one-line diff.
exclude: '^ecoscope-workflows-[^/]+-workflow/'

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer

  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version.
    rev: "v0.4.3"
    hooks:
      - id: ruff
        args: [--fix, --extend-select, B006, --select, I]
      - id: ruff-format
