# All cases are mock-io with SYNTHETIC fixtures from
# dev/fixtures/build_hwc_fixtures.py. Real Naibunga event data is sensitive
# and is never committed -- the sample it was modelled on lives in gitignored
# .scratch/ and nowhere else.
#
# The events fixture serves both get_events and process_events_details, which
# are both io-tagged, so both are overridden to the same file.
#
# template_path resolves from the inner package dir, so the cases point at
# the repo copy of the template. The FORM default is the Google Drive URL --
# the cases deliberately do not exercise it, because a test that fails when
# someone edits a Drive share is not a test.
#
# No live case yet: it needs the Naibunga connection name and a confirmation
# that the event-type slugs and the display titles in events_prepared match
# the instance.

base:
  name: Base case (two months, synthetic fixtures)
  description: >-
    Untouched-form defaults over Oct-Nov 2026. Exercises all twelve sections,
    the derived conflict label across all eight event types, species
    harmonisation (the same animal spelled three ways must give one bar), the
    fixed month grouper (two views), and the Word report with map and chart
    figures.
  mock_io: true
  mock_io_overrides:
    ecoscope.platform.tasks.io.get_events: dev/fixtures/events.example-return.parquet
    ecoscope.platform.tasks.io.process_events_details: dev/fixtures/events.example-return.parquet
  params:
    workflow_details:
      name: "Naibunga Lower HWC Report"
      description: "Human-wildlife conflict incidents, losses and response"
    er_client_name:
      data_source:
        name: "naibunga"
    time_range:
      since: "2026-10-01T00:00:00"
      until: "2026-11-30T23:59:59"
      timezone:
        label: "(GMT+03:00) Nairobi"
        tzCode: "Africa/Nairobi"
        name: "East Africa Time"
        utc: "+03:00"
    base_map_defs:
      base_maps:
        - url: "https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}"
          opacity: 1
        - url: "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}"
          opacity: 0.5

no_poisoning:
  name: Naibunga as it actually is (no poisoning records)
  description: >-
    The real shape of the instance on 8 Nov 2026 - every conflict event type
    present except Poisoning, which has zero records. Guards the slot that
    would otherwise vanish from the layout: the Poisoning Events card must
    render and read 0, not disappear.
  mock_io: true
  mock_io_overrides:
    ecoscope.platform.tasks.io.get_events: dev/fixtures/events-no-poisoning.example-return.parquet
    ecoscope.platform.tasks.io.process_events_details: dev/fixtures/events-no-poisoning.example-return.parquet
  params:
    workflow_details:
      name: "Naibunga Lower HWC Report"
      description: "No poisoning records in the period"
    er_client_name:
      data_source:
        name: "naibunga"
    time_range:
      since: "2026-10-01T00:00:00"
      until: "2026-10-31T23:59:59"
      timezone:
        label: "(GMT+03:00) Nairobi"
        tzCode: "Africa/Nairobi"
        name: "East Africa Time"
        utc: "+03:00"
    base_map_defs:
      base_maps:
        - url: "https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}"
          opacity: 1

empty:
  name: Empty period (no events at all)
  description: >-
    Zero-row fixture: the skip chains must hold, every widget renders as a
    placeholder rather than vanishing, and the Word report still renders with
    "No records for this period." in each section.
  mock_io: true
  mock_io_overrides:
    ecoscope.platform.tasks.io.get_events: dev/fixtures/events-empty.example-return.parquet
    ecoscope.platform.tasks.io.process_events_details: dev/fixtures/events-empty.example-return.parquet
  params:
    workflow_details:
      name: "Naibunga Lower HWC Report"
      description: "Empty period"
    er_client_name:
      data_source:
        name: "naibunga"
    time_range:
      since: "2026-10-01T00:00:00"
      until: "2026-10-31T23:59:59"
      timezone:
        label: "(GMT+03:00) Nairobi"
        tzCode: "Africa/Nairobi"
        name: "East Africa Time"
        utc: "+03:00"
    base_map_defs:
      base_maps:
        - url: "https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}"
          opacity: 1
