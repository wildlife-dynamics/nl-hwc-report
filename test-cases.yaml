# All cases are mock-io with SYNTHETIC fixtures from
# dev/build_mock_io.py. Real Naibunga event data is sensitive
# and is never committed -- the sample it was modelled on lives in gitignored
# .scratch/ and nowhere else.
#
# The events fixture serves both get_events and process_events_details, which
# are both io-tagged, so both are overridden to the same file.
#
# No case sets template_path: every one inherits the Google Drive URL pinned
# in spec.yaml, so each run fetches the live template. That is deliberate --
# it is the same artifact a real run uses, so a test passing here means the
# template on Drive actually renders. The cost is that the cases need network
# and will fail if the Drive share changes; dev/check_template_sync.py is what
# tells you the template has drifted from this repo.
#
# No live case yet: it needs the Naibunga connection name and a confirmation
# that the event-type slugs and the display titles in events_prepared match
# the instance.
#
# SECTION 4 ADDS A SECOND IO TASK, AND EVERY CASE MUST OVERRIDE IT.
#
# `get_incident_events` (ecoscope-workflows-ext-wd, the storyboard chain) is
# io-tagged, and the package ships NO packaged example return for it. Under
# --mock-io, wt_task.testing looks for an override env var first and then for a
# packaged `get-incident-events.example-return.*`, so without the override
# below every case dies before the DAG starts with
#     FileNotFoundError: Expected exactly 1 example-return file matching
#     'get-incident-events.example-return.*' in ecoscope_workflows_ext_wd.tasks
# The anchor is `ecoscope_workflows_ext_wd.tasks`, NOT `...tasks.io`, and the
# env var name is derived from it, so the dotted key has to match exactly.
#
# ALL THREE CASES USE THE EMPTY FIXTURE, AND THAT IS A WORKAROUND, NOT A
# CHOICE. `incident-events.example-return.parquet` -- the populated one, the
# same Loshaiki raid as the events fixture -- is still in mock-io/ and is the
# right fixture for `base`. It is not wired up because it makes the Windows
# job fail:
#
#   Task instance 'storyboards' raised ValueError('Invalid format string')
#
# format_incident_storyboards formats its tile dates with '%-d' (and
# _detail_value and _when do the same). '%-' is a glibc strftime extension for
# an unpadded day: fine on Linux and macOS, rejected outright by the Windows C
# runtime. The task returns early on an empty frame, so the empty fixture never
# reaches that code and the other two platforms never see it either -- which is
# exactly why only `base`, and only on windows-latest, went red.
#
# This is an upstream bug in ecoscope-workflows-ext-wd 0.0.14, not something
# this repo can patch: the formatting is inside the installed task. It is
# reported upstream; see .scratch/UPSTREAM-ext-wd-windows.md.
#
# WHEN IT IS FIXED, change the `base` override below back to
# mock-io/incident-events.example-return.parquet and the storyboard is covered
# again. Nothing else needs to change.
#
# The empty fixture is not a lie about production, for what it is worth: it is
# the task's own documented empty return, and it is Naibunga's real state --
# no event on the instance is in a collection, so section 4 is a placeholder
# there today either way.

base:
  name: Base case (two months, synthetic fixtures)
  description: >-
    Untouched-form defaults over Oct-Nov 2026. Exercises all ten MRD sections,
    the derived conflict label across all eight event types, species
    harmonisation (the same animal spelled three ways must give one bar), the
    incident-collection rule (three events at Loshaiki count as one incident
    while still counting their own casualties), and the Word report with map
    and chart figures. One view: there is no grouper.
  mock_io: true
  mock_io_overrides:
    ecoscope.platform.tasks.io.get_events: mock-io/events.example-return.parquet
    ecoscope.platform.tasks.io.process_events_details: mock-io/events.example-return.parquet
    # Was mock-io/incident-events.example-return.parquet -- see the note at the
    # top of this file. Swap it back once ext-wd stops using '%-d'.
    ecoscope_workflows_ext_wd.tasks.get_incident_events: mock-io/incident-events-empty.example-return.parquet
  params:
    workflow_details:
      name: "Naibunga Lower HWC Report"
      description: "Human-wildlife conflict incidents, losses and response"
    prepared_by:
      var: "Ecoscope"
    er_client_name:
      data_source:
        name: "naibunga"
    time_range:
      since: "2026-10-01T00:00:00"
      until: "2026-11-30T23:59:59"
      timezone:
        label: "(GMT+03:00) Nairobi"
        tzCode: "Africa/Nairobi"
        name: "East Africa Time"
        utc: "+03:00"
    base_map_defs:
      base_maps:
        - url: "https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}"
          opacity: 1
        - url: "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}"
          opacity: 0.5

no_poisoning:
  name: Naibunga as it actually is (no poisoning records)
  description: >-
    The real shape of the instance on 8 Nov 2026 - every conflict event type
    present except Poisoning, which has zero records. Guards the slot that
    would otherwise vanish from the layout: the Poisoning Events card must
    render and read 0, not disappear.
  mock_io: true
  mock_io_overrides:
    ecoscope.platform.tasks.io.get_events: mock-io/events-no-poisoning.example-return.parquet
    ecoscope.platform.tasks.io.process_events_details: mock-io/events-no-poisoning.example-return.parquet
    ecoscope_workflows_ext_wd.tasks.get_incident_events: mock-io/incident-events-empty.example-return.parquet
  params:
    workflow_details:
      name: "Naibunga Lower HWC Report"
      description: "No poisoning records in the period"
    prepared_by:
      var: "Ecoscope"
    er_client_name:
      data_source:
        name: "naibunga"
    time_range:
      since: "2026-10-01T00:00:00"
      until: "2026-10-31T23:59:59"
      timezone:
        label: "(GMT+03:00) Nairobi"
        tzCode: "Africa/Nairobi"
        name: "East Africa Time"
        utc: "+03:00"
    base_map_defs:
      base_maps:
        - url: "https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}"
          opacity: 1

empty:
  name: Empty period (no events at all)
  description: >-
    Zero-row fixture: the skip chains must hold, every widget renders as a
    placeholder rather than vanishing, and the Word report still renders with
    "No records for this period." in each section.
  mock_io: true
  mock_io_overrides:
    ecoscope.platform.tasks.io.get_events: mock-io/events-empty.example-return.parquet
    ecoscope.platform.tasks.io.process_events_details: mock-io/events-empty.example-return.parquet
    ecoscope_workflows_ext_wd.tasks.get_incident_events: mock-io/incident-events-empty.example-return.parquet
  params:
    workflow_details:
      name: "Naibunga Lower HWC Report"
      description: "Empty period"
    prepared_by:
      var: "Ecoscope"
    er_client_name:
      data_source:
        name: "naibunga"
    time_range:
      since: "2026-10-01T00:00:00"
      until: "2026-10-31T23:59:59"
      timezone:
        label: "(GMT+03:00) Nairobi"
        tzCode: "Africa/Nairobi"
        name: "East Africa Time"
        utc: "+03:00"
    base_map_defs:
      base_maps:
        - url: "https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}"
          opacity: 1
